        const getNextMonday = () => { const d = new Date(); d.setDate(d.getDate() + ((1 + 7 - d.getDay()) % 7)); return d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' }); };
        const getNextOfficeDay = () => { const d = new Date(); const day = d.getDay(); let add = (3 - day + 7) % 7; if(add === 0) add = 7; d.setDate(d.getDate() + add); return d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' }); };
        const formatDate = (isoString) => { if (!isoString) return '-'; const date = new Date(isoString); return date.toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }); };
        const isRecent = (dateString, days = 7) => { if (!dateString) return false; const date = new Date(dateString); const now = new Date(); const diffTime = Math.abs(now - date); return Math.ceil(diffTime / (1000 * 60 * 60 * 24)) <= days; };

            return d.getMonth() === 1;
        };

        const processStockTransaction = async (itemName, quantity, type, origin, user, requestId = null, notes = '') => {
            const q = query(collection(db, 'estoque_lab_2026'), where('name', '==', itemName));
            const querySnapshot = await getDocs(q);

            let stockItem = null;

            if (!querySnapshot.empty) {
                stockItem = querySnapshot.docs[0];
            } else {
                // Fallback: Busca todos e compara ignorando espaços em branco e letras maiúsculas/minúsculas
                const allStock = await getDocs(collection(db, 'estoque_lab_2026'));
                const fallbackDoc = allStock.docs.find(d => d.data().name && d.data().name.trim().toLowerCase() === itemName.trim().toLowerCase());
                if (fallbackDoc) {
                    stockItem = fallbackDoc;
                }
            }

            if (!stockItem) {
                if (origin === 'reposicao_logistica') {
                    throw new Error('NOT_IN_STOCK');
                }
                if (origin === 'pedido') throw new Error(`Item "${itemName}" não encontrado no estoque. Verifique espaços no nome ou cadastre-o primeiro.`);
                return;
            }

            const currentQty = parseInt(stockItem.data().currentQty || 0);
            const change = parseInt(quantity);

            if (type === 'out' && currentQty < change) {
                throw new Error(`Estoque insuficiente de "${itemName}". Atual: ${currentQty}, Necessário: ${change}`);
            }

            const newQty = type === 'in' ? currentQty + change : currentQty - change;

            await updateDoc(doc(db, 'estoque_lab_2026', stockItem.id), {
                currentQty: newQty,
                updatedAt: new Date().toISOString()
            });

            await addDoc(collection(db, 'movimentacoes_estoque_2026'), {
                itemId: stockItem.id,
                itemName: itemName,
                type: type,
                quantity: change,
                origin: origin,
                requestId: requestId,
                user: user.name,
                userRole: user.role,
                timestamp: new Date().toISOString(),
                balanceAfter: newQty,
                notes: notes
            });
        };

        // --- COMPONENTES (ORDEM CORRIGIDA) ---

        const LoginScreen = ({ onLogin }) => {
            const [name, setName] = React.useState('');
            const [role, setRole] = React.useState('lab_tech');
            const [sector, setSector] = React.useState('');
            const [password, setPassword] = React.useState('');
            const [error, setError] = React.useState('');

            const handleEnter = () => {
                setError(''); if (!name.trim()) return setError("Digite seu nome.");
                if (role === 'admin') { if (password !== SENHA_ADMIN) return setError("Senha incorreta."); onLogin({ name, role, sector: 'ADMINISTRAÇÃO' }); }
                else if (role === 'master') { if (password !== SENHA_MASTER) return setError("Senha incorreta."); onLogin({ name, role, sector: 'GESTOR DO SISTEMA' }); }
                else { if (!sector) return setError("Selecione seu setor."); onLogin({ name, role, sector }); }
            };

            return (
                <div className="min-h-screen bg-slate-50 flex items-center justify-center p-4">
                    <div className="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full border border-slate-100 fade-in">
                        <div className="flex justify-center mb-8"><InstitutionalLogo /></div>
                        <h2 className="text-xl font-semibold text-center text-slate-700 mb-1">LabFlow 2026</h2>
                        <p className="text-center text-slate-500 mb-6 text-sm">Controle de Almoxarifado & Adm</p>
                        <div className="space-y-4">
                            <div><label className="block text-sm font-bold text-slate-700 mb-1">Seu Nome</label><input type="text" value={name} onChange={(e) => setName(e.target.value)} placeholder="Ex: João Silva" className="w-full p-3 border border-slate-300 rounded-lg outline-none" /></div>
                            <div><label className="block text-sm font-bold text-slate-700 mb-1">Função</label><div className="grid grid-cols-3 gap-2"><button onClick={() => setRole('lab_tech')} className={`p-2 rounded-lg border flex flex-col items-center justify-center gap-1 ${role === 'lab_tech' ? 'bg-blue-50 border-blue-500 text-blue-700' : 'border-slate-200 text-slate-500'}`}><Icons.Beaker /><span className="text-xs font-medium">Lab</span></button><button onClick={() => setRole('admin')} className={`p-2 rounded-lg border flex flex-col items-center justify-center gap-1 ${role === 'admin' ? 'bg-purple-50 border-purple-500 text-purple-700' : 'border-slate-200 text-slate-500'}`}><Icons.Briefcase /><span className="text-xs font-medium">Admin</span></button><button onClick={() => setRole('master')} className={`p-2 rounded-lg border flex flex-col items-center justify-center gap-1 ${role === 'master' ? 'bg-red-50 border-red-500 text-red-700' : 'border-slate-200 text-slate-500'}`}><Icons.Shield /><span className="text-xs font-medium">Gestor</span></button></div></div>
                            {role === 'lab_tech' ? (<div className="fade-in"><label className="block text-sm font-bold text-slate-700 mb-1">Setor</label><div className="relative"><div className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"><Icons.Building2 /></div><select value={sector} onChange={(e) => setSector(e.target.value)} className="w-full pl-10 pr-3 py-3 border border-slate-300 rounded-lg outline-none bg-white"><option value="" disabled>Selecione...</option>{SETORES.map(s => <option key={s} value={s}>{s}</option>)}</select></div></div>) : (<div className="fade-in"><label className="block text-sm font-bold text-slate-700 mb-1">Senha</label><div className="relative"><div className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"><Icons.Lock /></div><input type="password" value={password} onChange={(e) => setPassword(e.target.value)} placeholder="Senha" className="w-full pl-10 pr-3 py-3 border border-slate-300 rounded-lg outline-none" /></div></div>)}
                            {error && <div className="text-red-500 text-sm font-medium text-center bg-red-50 p-2 rounded">{error}</div>}
                            <button onClick={handleEnter} className="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-lg shadow uppercase">Entrar</button>
                        </div>
                    </div>
                </div>
            );
        };

        const NoticeBanner = ({ notices, userRole, onUpdateNotice }) => {
            const [isEditing, setIsEditing] = React.useState(false);
            const [tempAdmin, setTempAdmin] = React.useState(notices.admin || '');
            React.useEffect(() => { setTempAdmin(notices.admin || ''); }, [notices]);
            const handleSave = () => { onUpdateNotice({ admin: (userRole === 'admin' || userRole === 'master') ? tempAdmin : notices.admin }); setIsEditing(false); };
            
            if (isEditing) return (<div className="bg-yellow-50 border-b border-yellow-200 p-4 animate-in fade-in"><h4 className="text-sm font-bold text-yellow-800 mb-2 flex items-center gap-2"><Icons.Edit/> Editar Aviso</h4><div className="flex flex-col gap-3">{(userRole === 'admin' || userRole === 'master') && <input className="w-full p-2 border rounded text-sm outline-none" value={tempAdmin} onChange={e => setTempAdmin(e.target.value)} placeholder="Aviso Administração..." />}<div className="flex gap-2 justify-end"><button onClick={() => setIsEditing(false)} className="px-3 py-1 text-xs text-slate-500 rounded border bg-white">Cancelar</button><button onClick={handleSave} className="bg-blue-600 text-white px-4 py-1 rounded text-xs font-bold shadow-sm">Salvar</button></div></div></div>);
            
            if (!notices.admin && userRole !== 'admin' && userRole !== 'master') return null;
            
            return (<div className="bg-gradient-to-r from-orange-50 via-yellow-50 to-orange-50 border-b border-orange-200 relative shadow-sm"><div className="max-w-5xl mx-auto px-4 py-2 flex flex-col sm:flex-row items-center justify-between gap-2 text-center sm:text-left min-h-[40px]"><div className="flex-1 flex flex-col sm:flex-row gap-x-6 gap-y-2 justify-center sm:justify-start items-center w-full">{notices.admin && <div className="flex items-center gap-2 text-indigo-900 animate-blink font-semibold text-sm"><span className="bg-indigo-600 text-white text-[10px] px-1.5 py-0.5 rounded font-bold uppercase">Aviso Adm</span><span>{notices.admin}</span></div>}</div>{userRole !== 'lab_tech' && <button onClick={() => setIsEditing(true)} className="text-slate-400 hover:text-blue-600 p-1.5 bg-white/50 hover:bg-white rounded-full transition"><Icons.Edit /></button>}</div></div>);
        };

        const InventoryItemCard = ({ item, isLocked, onUpdateQty, onDelete, onEdit }) => {
            const [isEditing, setIsEditing] = React.useState(false);
            const [editData, setEditData] = React.useState({ ...item });
            const handleSave = () => { onEdit(item.id, { ...editData, name: editData.name.trim() }); setIsEditing(false); };
            const handleCancel = () => { setEditData({ ...item }); setIsEditing(false); };
            const getStatusColor = (current, min) => { const cur = parseInt(current); const minimum = parseInt(min); if (cur <= 0 || cur < minimum) return 'bg-red-100 text-red-700 border-red-200'; if (cur >= minimum && cur <= minimum * 1.2) return 'bg-yellow-100 text-yellow-800 border-yellow-200'; return 'bg-green-100 text-green-700 border-green-200'; };
            const getStatusLabel = (current, min) => { const cur = parseInt(current); const minimum = parseInt(min); if (cur <= 0 || cur < minimum) return 'Crítico'; if (cur >= minimum && cur <= minimum * 1.2) return 'Atenção'; return 'OK'; };

            if (isEditing) return (<div className="bg-white p-4 rounded-xl shadow-sm border border-blue-200 relative overflow-hidden"><div className="flex flex-col gap-2"><input className="p-1.5 border rounded text-sm font-bold" value={editData.name} onChange={e => setEditData({...editData, name: e.target.value})} placeholder="Nome" /><select className="p-1.5 border rounded text-xs" value={editData.category} onChange={e => setEditData({...editData, category: e.target.value})}><optgroup label="Almoxarifado"><option value="reagente">Reagente</option><option value="materiais">Materiais</option><option value="consumivel_log">Consumível Lab</option></optgroup><optgroup label="Adm"><option value="epi">EPI</option><option value="escritorio">Escritório</option><option value="consumivel_adm">Consumível Adm</option></optgroup></select><input className="p-1.5 border rounded text-xs" value={editData.location} onChange={e => setEditData({...editData, location: e.target.value})} placeholder="Local" /><div className="grid grid-cols-3 gap-1"><input type="number" className="p-1.5 border rounded text-xs" value={editData.currentQty} onChange={e => setEditData({...editData, currentQty: e.target.value})} placeholder="Qtd" /><input type="number" className="p-1.5 border rounded text-xs" value={editData.minQty} onChange={e => setEditData({...editData, minQty: e.target.value})} placeholder="Min" /><select className="p-1.5 border rounded text-xs" value={editData.unit} onChange={e => setEditData({...editData, unit: e.target.value})}><option value="un">un</option><option value="cx">cx</option><option value="ml">ml</option><option value="L">L</option><option value="kg">kg</option><option value="pct">pct</option></select></div><div className="flex justify-end gap-2 mt-2"><button onClick={handleCancel} className="text-xs text-slate-500 hover:underline">Cancelar</button><button onClick={handleSave} className="bg-blue-600 text-white px-3 py-1 rounded text-xs font-bold">Salvar</button></div></div></div>);
            
            return (
                <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200 relative overflow-hidden">
                    <div className={`absolute top-0 right-0 px-3 py-1 text-[10px] font-bold uppercase rounded-bl-lg border-l border-b ${getStatusColor(item.currentQty, item.minQty)}`}>{getStatusLabel(item.currentQty, item.minQty)}</div>
                    <div className="flex justify-between items-start mt-2"><div><h4 className="font-bold text-slate-800 text-lg leading-tight">{item.name}</h4><div className="text-xs text-slate-500 mb-2 mt-1">{CAT_LABELS[item.category] || item.category} • Local: {item.location || '-'}</div></div></div>
                    <div className="flex items-center justify-between mt-4 bg-slate-50 p-3 rounded-lg"><div className="text-center"><div className="text-xs text-slate-400 uppercase">Mín</div><div className="font-bold text-slate-600">{item.minQty}</div></div><div className="text-center"><div className="text-xs text-slate-400 uppercase">Atual</div><div className="text-2xl font-bold text-blue-600">{item.currentQty} <span className="text-sm text-slate-400 font-normal">{item.unit}</span></div></div><div className="flex flex-col gap-1"><button onClick={() => onUpdateQty(item.id, item.name, item.currentQty, 1)} className="p-1 bg-green-100 text-green-700 rounded hover:bg-green-200"><Icons.Plus/></button><button onClick={() => onUpdateQty(item.id, item.name, item.currentQty, -1)} className="p-1 bg-red-100 text-red-700 rounded hover:bg-red-200"><Icons.X/></button></div></div>
                    {!isLocked && (<div className="flex justify-between mt-3 pt-3 border-t border-slate-100 animate-in fade-in"><button onClick={() => onDelete(item.id)} className="text-red-500 hover:bg-red-50 p-1.5 rounded transition"><Icons.Trash2 /></button><button onClick={() => setIsEditing(true)} className="text-blue-500 hover:bg-blue-50 p-1.5 rounded transition"><Icons.Edit /></button></div>)}
                </div>
            );
        };

        const RequestCard = ({ req, role, onDelete, onUpdateStatus, onOutOfStock, onSaveStockInfo, onApprovePartial, onUpdateReq, onReceiveLogistics, currentUser }) => {
            const [itemCode, setItemCode] = React.useState(req.itemCode || '');
            const [storageLocation, setStorageLocation] = React.useState(req.storageLocation || '');
            const [hasChanges, setHasChanges] = React.useState(false);
            const [showPartialInput, setShowPartialInput] = React.useState(false);
            const [partialQty, setPartialQty] = React.useState(req.quantity);
            const [isEditingReq, setIsEditingReq] = React.useState(false);
            const [editItem, setEditItem] = React.useState(req.item);
            const [editQty, setEditQty] = React.useState(req.quantity);
            const [editUnit, setEditUnit] = React.useState(req.unit);
            const [editCategory, setEditCategory] = React.useState(req.category);
            const [editSector, setEditSector] = React.useState(req.requesterSector || '');

            React.useEffect(() => { if (!req.itemCode && !req.storageLocation && role !== 'lab_tech') { try { const catalog = JSON.parse(localStorage.getItem('labflow_catalog') || '{}'); const savedItem = catalog[req.item.trim().toLowerCase()]; if (savedItem) { if (savedItem.code) { setItemCode(savedItem.code); setHasChanges(true); } if (savedItem.loc) { setStorageLocation(savedItem.loc); setHasChanges(true); } } } catch (e) {} } }, [req.item, role]);

            const handleSaveInfo = () => { onSaveStockInfo(req.id, itemCode, storageLocation, req.item); setHasChanges(false); };
            const handleStatusAction = async (status) => { if (status === 'approved') { try { await processStockTransaction(req.item, req.quantity, 'out', 'pedido', currentUser, req.id, `Pedido Aprovado Total (${req.quantity} ${req.unit})`); onSaveStockInfo(req.id, itemCode, storageLocation, req.item); onUpdateStatus(req.id, status); } catch (error) { alert("Erro de Estoque: " + error.message); } } else { onUpdateStatus(req.id, status); } };
            const handlePartialConfirm = async () => { try { await processStockTransaction(req.item, partialQty, 'out', 'pedido', currentUser, req.id, `Pedido Aprovado Parcial (${partialQty}/${req.quantity} ${req.unit})`); onSaveStockInfo(req.id, itemCode, storageLocation, req.item); onApprovePartial(req.id, partialQty, req.quantity); setShowPartialInput(false); } catch (error) { alert("Erro de Estoque: " + error.message); } };
            const handleSaveEditReq = () => { onUpdateReq(req.id, { item: editItem.trim(), quantity: editQty, unit: editUnit, category: editCategory, requesterSector: editSector }); setIsEditingReq(false); };
            
            const isAdmCategory = CAT_GROUPS.admin.includes(req.category);
            const badgeColor = isAdmCategory ? 'bg-purple-100 text-purple-700 border-purple-200' : 'bg-slate-100 text-slate-700 border-slate-200';

            return (
                <div className={`bg-white rounded-lg shadow-sm border p-4 transition-all ${req.status === 'pending' ? 'border-l-4 border-l-yellow-400' : req.status === 'approved' ? 'border-l-4 border-l-green-500 bg-green-50/10' : 'border-l-4 border-l-red-500 opacity-75'}`}>
                    {isEditingReq ? (
                        <div className="flex flex-col gap-3 bg-blue-50/50 p-2 rounded"><h4 className="text-xs font-bold text-blue-800 uppercase">Editando Pedido (Gestor)</h4><div className="grid grid-cols-2 gap-2"><div className="col-span-2"><label className="text-[10px] font-bold text-blue-800 uppercase">Item</label><input className="p-2 border rounded text-sm w-full" value={editItem} onChange={e => setEditItem(e.target.value)} /></div><div><label className="text-[10px] font-bold text-blue-800 uppercase">Categoria</label><select className="p-2 border rounded text-sm w-full" value={editCategory} onChange={e => setEditCategory(e.target.value)}><optgroup label="Adm (Cicilha)"><option value="epi">🥽 EPI</option><option value="escritorio">📎 Escritório</option><option value="consumivel_adm">🗑️ Consumível (Adm)</option></optgroup><optgroup label="Almoxarifado (Logística)"><option value="reagente">🧪 Reagente</option><option value="materiais">📦 Materiais</option><option value="consumivel_log">🧴 Consumível (Lab)</option></optgroup></select></div><div className="flex gap-1"><div className="flex-1"><label className="text-[10px] font-bold text-blue-800 uppercase">Qtd</label><input className="p-2 border rounded text-sm w-full" type="number" value={editQty} onChange={e => setEditQty(e.target.value)} /></div><div className="w-20"><label className="text-[10px] font-bold text-blue-800 uppercase">Un</label><select className="p-2 border rounded text-sm w-full" value={editUnit} onChange={e => setEditUnit(e.target.value)}><option value="un">un</option><option value="cx">cx</option><option value="ml">ml</option><option value="L">L</option><option value="pct">pct</option></select></div></div><div className="col-span-2"><label className="text-[10px] font-bold text-blue-800 uppercase">Setor Solicitante</label><select className="p-2 border rounded text-sm w-full" value={editSector} onChange={e => setEditSector(e.target.value)}>{SETORES.map(s => <option key={s} value={s}>{s}</option>)}</select></div></div><div className="flex justify-end gap-2"><button onClick={() => setIsEditingReq(false)} className="px-3 py-1 bg-white border rounded text-xs">Cancelar</button><button onClick={handleSaveEditReq} className="px-3 py-1 bg-blue-600 text-white rounded text-xs font-bold">Salvar Alterações</button></div></div>
                    ) : (
                        <div className="flex flex-col md:flex-row justify-between gap-4">
                            <div className="flex-1">
                                <div className="flex items-center flex-wrap gap-2 mb-2"><span className={`text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded border ${badgeColor}`}>{CAT_LABELS[req.category] || req.category}</span>{req.isUrgent && <span className="flex items-center gap-1 text-[10px] font-bold bg-red-100 text-red-600 px-2 py-0.5 rounded border border-red-200"><Icons.AlertCircle /> URGENTE</span>}<span className="text-xs text-slate-400 flex items-center gap-1 ml-auto md:ml-0"><Icons.Clock /> {formatDate(req.createdAt)}</span></div>
                                <div className="flex items-center gap-2"><div><h3 className="text-lg font-bold text-slate-800 leading-tight">{req.item}</h3><div className="text-sm font-medium text-slate-500 mt-1">Qtd: {req.quantity} {req.unit}</div></div>{(role === 'master' || role === 'admin') && <button onClick={() => setIsEditingReq(true)} className="text-slate-300 hover:text-blue-500 p-1"><Icons.Edit /></button>}</div>
                                {role !== 'lab_tech' && (<div className="mt-3 flex gap-2 items-end"><div className="flex-1 max-w-[120px]"><label className="text-[10px] font-bold text-slate-400 uppercase">Cód.</label><input type="text" value={itemCode} onChange={(e) => { setItemCode(e.target.value); setHasChanges(true); }} placeholder="0000" className="w-full text-xs p-1.5 border border-slate-300 rounded outline-none"/></div><div className="flex-1 max-w-[120px]"><label className="text-[10px] font-bold text-slate-400 uppercase">Local</label><input type="text" value={storageLocation} onChange={(e) => { setStorageLocation(e.target.value); setHasChanges(true); }} placeholder="A1" className="w-full text-xs p-1.5 border border-slate-300 rounded outline-none"/></div>{hasChanges && <button onClick={handleSaveInfo} title="Salvar" className="mb-[1px] p-1.5 bg-blue-100 text-blue-600 rounded"><Icons.Save /></button>}</div>)}
                                {role === 'lab_tech' && (req.itemCode || req.storageLocation) && (<div className="mt-2 text-xs text-slate-500 flex gap-3">{req.itemCode && <span><strong>Cód:</strong> {req.itemCode}</span>}{req.storageLocation && <span><strong>Local:</strong> {req.storageLocation}</span>}</div>)}
                                <div className="mt-3 pt-3 border-t border-slate-50 flex flex-wrap items-center gap-3 text-sm text-slate-600"><div className="flex items-center gap-1.5 bg-slate-100 px-2 py-1 rounded"><Icons.User /> <span className="font-semibold">{req.requesterName}</span><span className="text-slate-300">|</span><span className="text-blue-600 font-bold text-xs">{req.requesterSector || 'N/A'}</span></div>{req.notes && <span className="italic text-slate-400 text-xs">Obs: {req.notes}</span>}</div>
                                {req.status === 'out_of_stock' && req.logisticsMessage && <div className="mt-2 bg-red-50 border border-red-100 p-2 rounded text-red-700 text-sm"><strong>Motivo:</strong> {req.logisticsMessage}</div>}
                                {req.status === 'approved' && req.logisticsMessage && <div className="mt-2 bg-yellow-50 border border-yellow-100 p-2 rounded text-yellow-800 text-sm"><strong>Nota:</strong> {req.logisticsMessage}</div>}
                            </div>
                            {role !== 'lab_tech' && (
                                <div className="flex flex-row md:flex-col gap-2 justify-center border-t md:border-t-0 md:border-l border-slate-100 pt-3 md:pt-0 md:pl-4 min-w-[140px]">
                                    {role === 'master' && CAT_GROUPS.logistics.includes(req.category) ? (
                                        req.status === 'pending' ? (
                                            <button onClick={() => onReceiveLogistics(req.id, req.item, req.quantity, req.unit)} className="bg-blue-600 text-white py-2 px-3 rounded-lg text-xs font-bold hover:bg-blue-700 flex items-center justify-center gap-2 shadow-sm transition">
                                                <Icons.Box /> DAR BAIXA
                                            </button>
                                        ) : (
                                            <div className="text-center"><span className="text-sm font-bold text-green-600">RECEBIDO</span></div>
                                        )
                                    ) : (
                                        req.status === 'pending' ? (
                                            !showPartialInput ? (
                                                <>
                                                    <button onClick={() => handleStatusAction('approved')} className="bg-green-100 text-green-700 py-1.5 px-3 rounded text-xs font-bold hover:bg-green-200 flex items-center justify-center gap-2" title="Entregar Total (Baixa Estoque)"><Icons.CheckCircle2 /> TOTAL</button>
                                                    <button onClick={() => setShowPartialInput(true)} className="bg-orange-100 text-orange-700 py-1.5 px-3 rounded text-xs font-bold hover:bg-orange-200 flex items-center justify-center gap-2" title="Entregar Parcial (Baixa Estoque)"><Icons.Scissors /> PARCIAL</button>
                                                    <button onClick={() => onOutOfStock(req.id)} className="bg-red-100 text-red-700 py-1.5 px-3 rounded text-xs font-bold hover:bg-red-200 flex items-center justify-center gap-2"><Icons.PackageX /> EM FALTA</button>
                                                </>
                                            ) : (
                                                <div className="flex flex-col gap-2 animate-in fade-in">
                                                    <div className="text-xs font-bold text-slate-500 text-center">Qtd Real?</div>
                                                    <input type="number" value={partialQty} onChange={(e) => setPartialQty(e.target.value)} className="w-full p-1 border rounded text-center text-sm font-bold"/>
                                                    <div className="flex gap-1"><button onClick={() => setShowPartialInput(false)} className="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded py-1 text-xs">X</button><button onClick={handlePartialConfirm} className="flex-1 bg-green-600 hover:bg-green-700 text-white rounded py-1 text-xs font-bold">OK</button></div>
                                                </div>
                                            )
                                        ) : (
                                            <div className="text-center"><span className={`text-sm font-bold ${req.status === 'approved' ? 'text-green-600' : 'text-red-600'}`}>{req.status === 'approved' ? 'SEPARADO' : 'INDISPONÍVEL'}</span><button onClick={() => handleStatusAction('pending')} className="block mx-auto text-xs text-slate-400 underline mt-1">Alterar</button></div>
                                        )
                                    )}
                                </div>
                            )}
                            {(role === 'lab_tech' || role === 'master') && req.status === 'pending' && role !== 'admin' && (<div className="flex items-center justify-end md:justify-center min-w-[50px] border-t md:border-t-0 md:border-l border-slate-100 pt-2 md:pl-4"><button onClick={() => onDelete(req.id)} className="ml-2 text-slate-300 hover:text-red-500"><Icons.Trash2 /></button></div>)}
                            {role === 'lab_tech' && req.status !== 'pending' && (<div className="flex items-center justify-end md:justify-center min-w-[100px] border-t md:border-t-0 md:border-l border-slate-100 pt-2 md:pl-4">{req.status === 'approved' && <div className="text-center"><span className="text-green-600 text-xs font-bold bg-green-50 px-2 py-1 rounded">DISPONÍVEL</span><div className="text-[10px] text-slate-400 mt-1">Retirar na {CAT_GROUPS.admin.includes(req.category) ? '4ª' : '2ª'}</div></div>}{req.status === 'out_of_stock' && <span className="text-red-600 text-xs font-bold bg-red-50 px-2 py-1 rounded">EM FALTA</span>}</div>)}
                        </div>
                    )}
                </div>
            );
        };

        const HistoryRow = ({ req, onMarkRestocked, isLocked, onDelete, onEdit }) => {
            const [isEditing, setIsEditing] = React.useState(false);
            const [editItem, setEditItem] = React.useState(req.item);
            const [editQty, setEditQty] = React.useState(req.quantity);
            const [editUnit, setEditUnit] = React.useState(req.unit);
            const [editCategory, setEditCategory] = React.useState(req.category);

            const handleSave = () => {
                onEdit(req.id, { item: editItem.trim(), quantity: editQty, unit: editUnit, category: editCategory });
                setIsEditing(false);
            };

            if (isEditing) {
                return (
                    <div className="bg-white p-3 rounded-lg border border-blue-200 flex flex-col gap-2">
                        <div className="text-xs font-bold text-blue-800 uppercase mb-1">Editando Histórico</div>
                        <div className="grid grid-cols-2 md:grid-cols-4 gap-2">
                            <input className="p-1.5 border rounded text-sm col-span-2" value={editItem} onChange={e => setEditItem(e.target.value)} />
                            <input type="number" className="p-1.5 border rounded text-sm" value={editQty} onChange={e => setEditQty(e.target.value)} />
                            <select className="p-1.5 border rounded text-sm" value={editUnit} onChange={e => setEditUnit(e.target.value)}>
                                <option value="un">un</option><option value="cx">cx</option><option value="ml">ml</option><option value="L">L</option><option value="pct">pct</option>
                            </select>
                            <select className="p-1.5 border rounded text-sm col-span-2" value={editCategory} onChange={e => setEditCategory(e.target.value)}>
                                <optgroup label="Adm (Cicilha)"><option value="epi">🥽 EPI</option><option value="escritorio">📎 Escritório</option><option value="consumivel_adm">🗑️ Consumível (Adm)</option></optgroup>
                                <optgroup label="Almoxarifado (Logística)"><option value="reagente">🧪 Reagente</option><option value="materiais">📦 Materiais</option><option value="consumivel_log">🧴 Consumível (Lab)</option></optgroup>
                            </select>
                        </div>
                        <div className="flex justify-end gap-2 mt-2">
                            <button onClick={() => setIsEditing(false)} className="px-3 py-1 bg-slate-100 rounded text-xs">Cancelar</button>
                            <button onClick={handleSave} className="px-3 py-1 bg-blue-600 text-white rounded text-xs font-bold">Salvar</button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="bg-white p-3 rounded-lg border border-slate-200 flex flex-col md:flex-row gap-4 items-center text-sm">
                    <div className="flex-1 w-full">
                        <div className="flex justify-between mb-1"><span className="font-bold text-slate-700">{req.item}</span><span className="text-slate-400 text-xs">{formatDate(req.createdAt)}</span></div>
                        <div className="flex gap-2 text-xs text-slate-500"><span>{req.quantity} {req.unit}</span><span>• {req.requesterName} ({req.requesterSector})</span>{req.itemCode && <span>• Cód: {req.itemCode}</span>}</div>
                        <div className="mt-1"><span className="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded border bg-slate-50 text-slate-500">{CAT_LABELS[req.category] || req.category}</span></div>
                        {req.logisticsMessage && <div className={`text-xs mt-1 ${req.status === 'approved' ? 'text-yellow-700 bg-yellow-50 p-1 rounded inline-block' : 'text-red-500'}`}>Obs: {req.logisticsMessage}</div>}
                    </div>
                    <div className="flex flex-col md:flex-row items-center md:items-end gap-2 w-full md:w-auto justify-between md:justify-end">
                        <div className="flex items-center gap-2">
                            <span className={`px-2 py-1 rounded text-xs font-bold ${req.status === 'approved' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}`}>{req.status === 'approved' ? 'Entregue/Disp.' : 'Em Falta'}</span>
                            {req.status === 'out_of_stock' && !req.stockRestored && <button onClick={() => onMarkRestocked(req.id)} className="flex items-center gap-1 bg-blue-50 text-blue-600 border border-blue-200 px-2 py-1 rounded text-xs hover:bg-blue-100 transition"><Icons.RefreshCw /> Reposto?</button>}
                            {req.status === 'out_of_stock' && req.stockRestored && <span className="text-xs text-blue-600 font-bold border border-blue-100 bg-blue-50 px-2 py-1 rounded">Estoque OK</span>}
                        </div>
                        {!isLocked && (
                            <div className="flex gap-2 animate-in fade-in pt-2 md:pt-0">
                                <button onClick={() => setIsEditing(true)} className="text-blue-500 hover:bg-blue-50 p-1.5 rounded transition"><Icons.Edit /></button>
                                <button onClick={() => onDelete(req.id)} className="text-red-500 hover:bg-red-50 p-1.5 rounded transition"><Icons.Trash2 /></button>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // --- NOVA VISUALIZAÇÃO: SOLICITAÇÃO DE COMPRAS (ADMIN) ---
        const PurchaseRequestView = ({ userRole }) => {
            const [items, setItems] = React.useState([]);
            const [searchTerm, setSearchTerm] = React.useState('');

            React.useEffect(() => {
                const q = query(collection(db, 'estoque_lab_2026'), orderBy('name'));
                const unsubscribe = onSnapshot(q, (snapshot) => {
                    const docs = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setItems(docs);
                });
                return () => unsubscribe();
            }, []);

            // Filtra itens de ADM que estão com estoque BAIXO (Crítico ou Atenção)
            const purchaseList = items.filter(item => {
                const isAdmCategory = CAT_GROUPS.admin.includes(item.category);
                const current = parseInt(item.currentQty || 0);
                const min = parseInt(item.minQty || 0);
                const isLowStock = current <= (min * 1.2); // Crítico ou Atenção
                const matchesSearch = item.name.toLowerCase().includes(searchTerm.toLowerCase());
                
                return isAdmCategory && isLowStock && matchesSearch;
            });

            const handleExportPurchasePDF = () => {
                if (purchaseList.length === 0) return alert("Nenhum item para compra.");
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();

                // Cabeçalho
                doc.setFontSize(16);
                doc.setTextColor(40, 40, 40);
                doc.text("REQUISIÇÃO DE COMPRAS - ADMINISTRATIVO", 105, 20, null, null, 'center');
                doc.setFontSize(10);
                doc.text(`Data de Emissão: ${new Date().toLocaleDateString('pt-BR')}`, 14, 30);
                doc.text(`Solicitante: ${userRole === 'master' ? 'Gestor do Sistema' : 'Administração (Cicilha)'}`, 14, 35);

                const tableColumn = ["Item", "Categoria", "Qtd Atual", "Estoque Mín", "Sugestão de Compra"];
                const tableRows = purchaseList.map(item => {
                    const current = parseInt(item.currentQty || 0);
                    const min = parseInt(item.minQty || 0);
                    const max = parseInt(item.maxQty || 0);
                    // Sugestão: Se tiver Max, sugere (Max - Atual). Se não, sugere (Min * 2).
                    const suggestion = max > 0 ? (max - current) : (min > 0 ? min * 2 : 0);
                    
                    return [
                        item.name,
                        CAT_LABELS_CLEAN[item.category] || item.category,
                        `${current} ${item.unit}`,
                        min,
                        `${suggestion > 0 ? suggestion : '-'} ${item.unit}`
                    ];
                });

                doc.autoTable({
                    head: [tableColumn],
                    body: tableRows,
                    startY: 45,
                    theme: 'grid',
                    headStyles: { fillColor: [220, 20, 60] } // Cor vermelha para chamar atenção de compra
                });

                // Rodapé com Assinaturas
                const finalY = doc.lastAutoTable.finalY + 30;
                doc.line(14, finalY, 90, finalY); // Linha 1
                doc.text("Aprovação da Gerência", 52, finalY + 5, null, null, 'center');

                doc.line(110, finalY, 190, finalY); // Linha 2
                doc.text("Setor de Compras", 150, finalY + 5, null, null, 'center');

                doc.save('requisicao_compras_adm.pdf');
            };

            return (
                <div className="animate-in fade-in">
                    <div className="bg-red-50 border border-red-100 p-4 rounded-lg mb-6">
                        <h3 className="text-red-800 font-bold flex items-center gap-2"><Icons.ShoppingCart /> Painel de Compras (Escritório)</h3>
                        <p className="text-xs text-red-600 mt-1">Listando automaticamente itens com estoque Crítico ou em Atenção.</p>
                    </div>

                    <div className="flex justify-between items-center mb-4">
                        <div className="relative w-full max-w-md">
                            <div className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"><Icons.Search /></div>
                            <input type="text" placeholder="Filtrar lista de compras..." value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} className="w-full pl-10 pr-4 py-2 rounded-full border border-slate-200 focus:ring-2 focus:ring-blue-500 outline-none shadow-sm" />
                        </div>
                        <button onClick={handleExportPurchasePDF} className="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg font-bold shadow flex items-center gap-2">
                            <Icons.FileText /> Gerar Requisição PDF
                        </button>
                    </div>

                    <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                        <table className="w-full text-sm text-left">
                            <thead className="bg-slate-50 text-slate-500 font-semibold border-b">
                                <tr>
                                    <th className="p-3">Item</th>
                                    <th className="p-3">Status</th>
                                    <th className="p-3">Atual</th>
                                    <th className="p-3">Mínimo</th>
                                    <th className="p-3">Máximo</th>
                                    <th className="p-3 font-bold text-blue-600">Sugestão Compra</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-100">
                                {purchaseList.map(item => {
                                    const current = parseInt(item.currentQty || 0);
                                    const min = parseInt(item.minQty || 0);
                                    const max = parseInt(item.maxQty || 0);
                                    const suggestion = max > 0 ? (max - current) : (min * 2);
                                    
                                    return (
                                        <tr key={item.id} className="hover:bg-slate-50">
                                            <td className="p-3 font-bold text-slate-700">{item.name}</td>
                                            <td className="p-3">
                                                {current <= 0 || current < min ? 
                                                    <span className="bg-red-100 text-red-700 px-2 py-0.5 rounded-full text-xs font-bold">Crítico</span> : 
                                                    <span className="bg-yellow-100 text-yellow-800 px-2 py-0.5 rounded-full text-xs font-bold">Atenção</span>
                                                }
                                            </td>
                                            <td className="p-3">{current} {item.unit}</td>
                                            <td className="p-3 text-slate-400">{min}</td>
                                            <td className="p-3 text-slate-400">{max}</td>
                                            <td className="p-3 font-bold text-blue-600 bg-blue-50/50">{suggestion > 0 ? suggestion : '-'} {item.unit}</td>
                                        </tr>
                                    );
                                })}
                                {purchaseList.length === 0 && <tr><td colSpan="6" className="p-8 text-center text-slate-400">Tudo certo! Nenhum item precisa de reposição no momento.</td></tr>}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        };

        const MovementsView = ({ userRole }) => {
            const [movements, setMovements] = React.useState([]);
            const [loading, setLoading] = React.useState(true);

            React.useEffect(() => {
                // Busca movimentações
                const q = query(collection(db, 'movimentacoes_estoque_2026'), orderBy('timestamp', 'desc'));
                const unsubscribe = onSnapshot(q, (snapshot) => {
                    setMovements(snapshot.docs.map(d => ({id: d.id, ...d.data()})));
                    setLoading(false);
                });
                return () => unsubscribe();
            }, []);

            if (loading) return <div className="text-center py-10 text-slate-500">Carregando histórico...</div>;

            return (
                <div className="animate-in fade-in space-y-4">
                    <h3 className="text-lg font-bold text-slate-700 flex items-center gap-2 mb-4"><Icons.Activity /> Histórico de Movimentações</h3>
                    <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                        <table className="w-full text-sm text-left">
                            <thead className="bg-slate-50 text-slate-500 font-semibold border-b">
                                <tr>
                                    <th className="p-3">Data</th>
                                    <th className="p-3">Item</th>
                                    <th className="p-3">Qtd</th>
                                    <th className="p-3">Tipo</th>
                                    <th className="p-3">Origem</th>
                                    <th className="p-3">Usuário</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-100">
                                {movements.map(mov => (
                                    <tr key={mov.id} className="hover:bg-slate-50">
                                        <td className="p-3 text-slate-500 text-xs">{formatDate(mov.timestamp)}</td>
                                        <td className="p-3 font-medium text-slate-700">{mov.itemName}</td>
                                        <td className="p-3 font-bold">{mov.quantity}</td>
                                        <td className="p-3">
                                            {mov.type === 'in' ? 
                                                <span className="bg-green-100 text-green-700 px-2 py-0.5 rounded text-xs font-bold flex items-center w-fit gap-1"><Icons.ArrowUpCircle/> Entrada</span> : 
                                                <span className="bg-red-100 text-red-700 px-2 py-0.5 rounded text-xs font-bold flex items-center w-fit gap-1"><Icons.ArrowDownCircle/> Saída</span>
                                            }
                                        </td>
                                        <td className="p-3 text-xs uppercase tracking-wide text-slate-500">{mov.origin}</td>
                                        <td className="p-3 text-xs text-slate-600">{mov.user}</td>
                                    </tr>
                                ))}
                                {movements.length === 0 && <tr><td colSpan="6" className="p-8 text-center text-slate-400">Nenhuma movimentação registrada.</td></tr>}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        };

        const InventoryView = ({ userRole, currentUser }) => {
            const [items, setItems] = React.useState([]);
            const [searchTerm, setSearchTerm] = React.useState('');
            const [showForm, setShowForm] = React.useState(false);
            const [isInventoryLocked, setIsInventoryLocked] = React.useState(true);
            const [newItem, setNewItem] = React.useState({ name: '', category: 'epi', unit: 'un', currentQty: 0, minQty: 0, maxQty: 0, location: '', notes: '' });
            const [filterTab, setFilterTab] = React.useState('Todos');

            React.useEffect(() => {
                const q = query(collection(db, 'estoque_lab_2026'), orderBy('name'));
                const unsubscribe = onSnapshot(q, (snapshot) => {
                    const docs = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setItems(docs);
                });
                return () => unsubscribe();
            }, []);

            const handleAddItem = async (e) => {
                e.preventDefault(); if (!newItem.name) return;
                try { await addDoc(collection(db, 'estoque_lab_2026'), { ...newItem, name: newItem.name.trim(), updatedAt: new Date().toISOString() }); setNewItem({ name: '', category: 'epi', unit: 'un', currentQty: 0, minQty: 0, maxQty: 0, location: '', notes: '' }); setShowForm(false); } catch (e) { console.error(e); }
            };

            const handleUpdateQty = async (id, itemName, currentQty, change) => {
                const newQty = parseInt(currentQty) + change;
                if (newQty < 0) return;
                try {
                    await processStockTransaction(itemName, Math.abs(change), change > 0 ? 'in' : 'out', 'manual', currentUser, null, 'Ajuste Manual Rápido');
                } catch (e) { alert(e.message); }
            };
            
            const handleDeleteItem = async (id) => {
                if (confirm('Tem certeza que deseja excluir este item do estoque?')) {
                    try { await deleteDoc(doc(db, 'estoque_lab_2026', id)); } catch(e) { console.error(e); }
                }
            };

            const handleEditItem = async (id, updatedData) => {
                try {
                    await updateDoc(doc(db, 'estoque_lab_2026', id), { ...updatedData, updatedAt: new Date().toISOString() });
                } catch (e) { console.error(e); }
            };

            const getStatus = (current, min) => {
                const cur = parseInt(current) || 0;
                const minimum = parseInt(min) || 0;
                if (cur <= 0 || cur < minimum) return 'Crítico';
                if (cur >= minimum && cur <= minimum * 1.2) return 'Atenção';
                return 'OK';
            };

            const displayedItems = items.filter(item => {
                const matchesSearch = item.name.toLowerCase().includes(searchTerm.toLowerCase());
                if (!matchesSearch) return false;
                if (filterTab === 'Todos') return true;
                const status = getStatus(item.currentQty, item.minQty);
                if (filterTab === 'OK' && status === 'OK') return true;
                if (filterTab === 'Atenção' && status === 'Atenção') return true;
                if (filterTab === 'Crítico' && status === 'Crítico') return true;
                return false;
            });

            return (
                <div className="animate-in fade-in">
                    <div className="flex flex-col md:flex-row justify-between items-center mb-4 gap-4">
                        <div className="relative w-full md:w-96">
                            <div className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"><Icons.Search /></div>
                            <input type="text" placeholder="Buscar item no estoque..." value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} className="w-full pl-10 pr-4 py-2 rounded-full border border-slate-200 focus:ring-2 focus:ring-blue-500 outline-none shadow-sm" />
                        </div>
                        
                        <div className="flex gap-2">
                             <button 
                                onClick={() => setIsInventoryLocked(!isInventoryLocked)} 
                                className={`px-4 py-2 rounded-lg font-bold shadow flex items-center gap-2 transition ${isInventoryLocked ? 'bg-slate-100 text-slate-600 hover:bg-slate-200' : 'bg-red-100 text-red-600 hover:bg-red-200'}`}
                                title={isInventoryLocked ? "Destravar Edição" : "Travar Edição"}
                            >
                                {isInventoryLocked ? <><Icons.Lock /> Travado</> : <><Icons.Unlock /> Destravado</>}
                            </button>
                            <button onClick={() => setShowForm(!showForm)} className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-bold shadow flex items-center gap-2">
                                <Icons.Plus /> Novo Item
                            </button>
                        </div>
                    </div>

                    <div className="flex gap-2 mb-6 overflow-x-auto pb-2 border-b border-slate-200">
                        {['Todos', 'OK', 'Atenção', 'Crítico'].map(tab => (
                            <button 
                                key={tab} 
                                onClick={() => setFilterTab(tab)}
                                className={`px-4 py-1.5 rounded-full text-xs font-bold transition-all whitespace-nowrap border ${filterTab === tab ? 'bg-blue-600 border-blue-600 text-white shadow-md' : 'bg-white border-slate-200 text-slate-500 hover:bg-slate-50 dark:bg-slate-800 dark:border-slate-700'}`}
                            >
                                {tab === 'OK' ? 'OK / Disponível' : tab}
                                {tab !== 'Todos' && <span className="ml-1 opacity-75">({items.filter(i => getStatus(i.currentQty, i.minQty) === tab).length})</span>}
                            </button>
                        ))}
                    </div>

                    {showForm && (
                        <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-200 mb-6">
                            <h3 className="font-bold text-slate-700 mb-3">Cadastrar Novo Item</h3>
                            <form onSubmit={handleAddItem} className="grid grid-cols-1 md:grid-cols-4 gap-4">
                                <input className="p-2 border rounded" placeholder="Nome do Item" value={newItem.name} onChange={e => setNewItem({...newItem, name: e.target.value})} required />
                                <select className="p-2 border rounded" value={newItem.category} onChange={e => setNewItem({...newItem, category: e.target.value})}>
                                    {userRole === 'master' && <optgroup label="Almoxarifado (Logística)"><option value="reagente">Reagente</option><option value="materiais">Materiais</option><option value="consumivel_log">Consumível Lab</option></optgroup>}
                                    <optgroup label="Adm (Cicilha)"><option value="epi">EPI</option><option value="escritorio">Escritório</option><option value="consumivel_adm">Consumível Adm</option></optgroup>
                                </select>
                                <input className="p-2 border rounded" placeholder="Local (ex: A1)" value={newItem.location} onChange={e => setNewItem({...newItem, location: e.target.value})} />
                                <select className="p-2 border rounded" value={newItem.unit} onChange={e => setNewItem({...newItem, unit: e.target.value})}><option value="un">un</option><option value="cx">cx</option><option value="L">L</option><option value="kg">kg</option><option value="pct">pct</option></select>
                                <div className="md:col-span-4 grid grid-cols-3 gap-4">
                                    <input type="number" className="p-2 border rounded" placeholder="Qtd Atual" value={newItem.currentQty} onChange={e => setNewItem({...newItem, currentQty: e.target.value})} />
                                    <input type="number" className="p-2 border rounded" placeholder="Estoque Mínimo" value={newItem.minQty} onChange={e => setNewItem({...newItem, minQty: e.target.value})} />
                                    <input type="number" className="p-2 border rounded" placeholder="Estoque Máximo" value={newItem.maxQty} onChange={e => setNewItem({...newItem, maxQty: e.target.value})} />
                                </div>
                                <button type="submit" className="md:col-span-4 bg-green-600 text-white py-2 rounded font-bold hover:bg-green-700">Salvar Item</button>
                            </form>
                        </div>
                    )}
                    
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                        {displayedItems.map(item => (
                            <InventoryItemCard 
                                key={item.id} 
                                item={item} 
                                isLocked={isInventoryLocked}
                                onUpdateQty={handleUpdateQty}
                                onDelete={handleDeleteItem}
                                onEdit={handleEditItem}
                            />
                        ))}
                    </div>
                </div>
            );
        };

        const SuggestionsView = ({ suggestions, userRole }) => {
            const handleUpdateStatus = async (id, status) => {
                await updateDoc(doc(db, 'sugestoes_lab_2026', id), { status });
            };
            const handleDelete = async (id) => {
                if (confirm("Excluir esta sugestão?")) {
                    await deleteDoc(doc(db, 'sugestoes_lab_2026', id));
                }
            };

            return (
                <div className="animate-in fade-in space-y-4">
                    <div className="bg-yellow-50 border border-yellow-100 p-4 rounded-xl mb-6">
                        <h3 className="text-yellow-800 font-bold flex items-center gap-2"><Icons.Lightbulb /> Caixa de Sugestões</h3>
                        <p className="text-xs text-yellow-600 mt-1">Itens solicitados pelos técnicos que não existem no banco de dados.</p>
                    </div>
                    {suggestions.length === 0 ? <div className="text-center text-slate-400 py-10">Nenhuma sugestão no momento.</div> : (
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            {suggestions.map(sug => (
                                <div key={sug.id} className={`bg-white p-4 rounded-xl shadow-sm border ${sug.status === 'pending' ? 'border-yellow-300' : 'border-slate-200'} relative`}>
                                    {sug.status === 'pending' && <span className="absolute top-2 right-2 bg-yellow-100 text-yellow-700 text-[10px] font-bold px-2 py-0.5 rounded-full">NOVA</span>}
                                    {sug.status === 'reviewed' && <span className="absolute top-2 right-2 bg-green-100 text-green-700 text-[10px] font-bold px-2 py-0.5 rounded-full">VISTA</span>}
                                    <h4 className="font-bold text-slate-800 mb-1 pr-12">{sug.item}</h4>
                                    <div className="text-xs text-slate-500 mb-2">Sugerido por: {sug.requesterName} ({sug.requesterSector}) em {formatDate(sug.createdAt)}</div>
                                    <div className="bg-slate-50 p-2 rounded text-sm text-slate-700 italic mb-4">"{sug.motivo}"</div>
                                    
                                    {(userRole === 'admin' || userRole === 'master') && (
                                        <div className="flex justify-end gap-2 border-t border-slate-100 pt-3">
                                            {sug.status === 'pending' && <button onClick={() => handleUpdateStatus(sug.id, 'reviewed')} className="text-xs bg-blue-50 text-blue-600 px-3 py-1.5 rounded font-bold hover:bg-blue-100 transition">Marcar como Vista</button>}
                                            <button onClick={() => handleDelete(sug.id)} className="text-red-500 hover:bg-red-50 p-1.5 rounded transition"><Icons.Trash2 /></button>
                                        </div>
                                    )}
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            );
        };

        const DashboardView = ({ requests }) => {
            const stats = React.useMemo(() => {
                let totalRequests = requests.length;
                let approved = 0;
                let outOfStock = 0;
                let pending = 0;
                let totalFulfillmentTimeMs = 0;
                let fulfilledCount = 0;

                const itemCounts = {};
                const sectorCounts = {};
                const monthCounts = {};

                requests.forEach(r => {
                    // Contagem de Status e Tempo de Atendimento
                    if (r.status === 'approved') {
                        approved++;
                        if (r.statusUpdatedAt && r.createdAt) {
                            const diff = new Date(r.statusUpdatedAt) - new Date(r.createdAt);
                            if (diff > 0) {
                                totalFulfillmentTimeMs += diff;
                                fulfilledCount++;
                            }
                        }
                    } else if (r.status === 'out_of_stock') {
                        outOfStock++;
                    } else {
                        pending++;
                    }

                    // Contagem de Itens (Volume consumido)
                    const qty = parseInt(r.quantity) || 1;
                    const itemName = r.item ? r.item.trim() : 'Desconhecido';
                    itemCounts[itemName] = (itemCounts[itemName] || 0) + qty;

                    // Contagem por Setor (Volume de Pedidos)
                    const sector = r.requesterSector || 'Outros';
                    sectorCounts[sector] = (sectorCounts[sector] || 0) + 1;

                    // Contagem Mensal
                    if (r.createdAt) {
                        const d = new Date(r.createdAt);
                        const monthKey = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
                        const monthLabel = d.toLocaleDateString('pt-BR', { month: 'short', year: 'numeric' });
                        if (!monthCounts[monthKey]) monthCounts[monthKey] = { label: monthLabel, count: 0 };
                        monthCounts[monthKey].count++;
                    }
                });

                // Formatação do Tempo Médio
                let avgTimeLabel = "-";
                if (fulfilledCount > 0) {
                    const avgMs = totalFulfillmentTimeMs / fulfilledCount;
                    const hours = avgMs / (1000 * 60 * 60);
                    if (hours < 1) avgTimeLabel = `${Math.round(hours * 60)} min`;
                    else if (hours < 24) avgTimeLabel = `${Math.round(hours)}h`;
                    else avgTimeLabel = `${(hours / 24).toFixed(1)} dias`;
                }

                // Rankings e Ordenação
                const topItems = Object.entries(itemCounts).map(([name, count]) => ({name, count})).sort((a,b) => b.count - a.count).slice(0, 5);
                const topSectors = Object.entries(sectorCounts).map(([name, count]) => ({name, count})).sort((a,b) => b.count - a.count);
                const monthlyData = Object.keys(monthCounts).sort().map(k => monthCounts[k]);

                // Valores Máximos para os gráficos de barra
                const maxMonthCount = Math.max(...monthlyData.map(m => m.count), 1);
                const maxSectorCount = Math.max(...topSectors.map(s => s.count), 1);
                const maxItemCount = Math.max(...topItems.map(i => i.count), 1);

                return {
                    totalRequests, approved, outOfStock, pending, avgTimeLabel,
                    topItems, topSectors, monthlyData,
                    maxMonthCount, maxSectorCount, maxItemCount
                };
            }, [requests]);

            const totalFinished = stats.approved + stats.outOfStock;
            const approvedRate = totalFinished > 0 ? Math.round((stats.approved / totalFinished) * 100) : 0;
            const outOfStockRate = totalFinished > 0 ? Math.round((stats.outOfStock / totalFinished) * 100) : 0;

            return (
                <div className="animate-in fade-in space-y-6">
                    <div className="bg-gradient-to-r from-blue-50 to-indigo-50 border border-blue-100 p-4 rounded-xl mb-6">
                        <h3 className="text-blue-800 font-black flex items-center gap-2"><Icons.BarChart /> Dashboard Analítico</h3>
                        <p className="text-xs text-blue-600 mt-1">Visão gerencial consolidada de todos os registros do LabFlow.</p>
                    </div>

                    {/* KPIs Principais */}
                    <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                        <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex flex-col justify-between">
                            <div className="text-slate-400 text-xs font-bold uppercase tracking-wider mb-2">Total Pedidos</div>
                            <div className="text-4xl font-black text-slate-800">{stats.totalRequests}</div>
                        </div>
                        <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex flex-col justify-between">
                            <div className="text-green-500 text-xs font-bold uppercase tracking-wider mb-2">Itens Entregues</div>
                            <div className="text-4xl font-black text-green-600">{stats.approved}</div>
                        </div>
                        <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex flex-col justify-between">
                            <div className="text-red-400 text-xs font-bold uppercase tracking-wider mb-2">Itens Em Falta</div>
                            <div className="text-4xl font-black text-red-600">{stats.outOfStock}</div>
                        </div>
                        <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex flex-col justify-between">
                            <div className="text-blue-400 text-xs font-bold uppercase tracking-wider mb-2">Tempo Médio Atend.</div>
                            <div className="text-4xl font-black text-blue-600">{stats.avgTimeLabel}</div>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        {/* Taxa de Atendimento */}
                        <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex flex-col justify-center">
                            <h3 className="font-bold text-slate-800 mb-6 flex items-center gap-2">Taxa de Conversão (Finalizados)</h3>
                            <div className="flex h-8 rounded-full overflow-hidden mb-4 bg-slate-100 shadow-inner">
                                <div style={{width: `${approvedRate}%`}} className="bg-green-500 h-full flex items-center justify-center text-xs text-white font-bold transition-all">{approvedRate > 5 ? `${approvedRate}%` : ''}</div>
                                <div style={{width: `${outOfStockRate}%`}} className="bg-red-500 h-full flex items-center justify-center text-xs text-white font-bold transition-all">{outOfStockRate > 5 ? `${outOfStockRate}%` : ''}</div>
                            </div>
                            <div className="flex justify-around text-sm font-semibold mt-2">
                                <div className="text-green-700 flex items-center gap-2"><div className="w-4 h-4 rounded-full bg-green-500 shadow-sm"></div> {stats.approved} Entregues</div>
                                <div className="text-red-700 flex items-center gap-2"><div className="w-4 h-4 rounded-full bg-red-500 shadow-sm"></div> {stats.outOfStock} Em Falta</div>
                            </div>
                        </div>

                        {/* Evolução Mensal */}
                        <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                            <h3 className="font-bold text-slate-800 mb-4 flex items-center gap-2"><Icons.Activity /> Pedidos por Mês</h3>
                            <div className="flex items-end h-32 gap-3 pb-2 border-b border-slate-100">
                                {stats.monthlyData.length === 0 && <div className="text-slate-400 text-sm m-auto">Aguardando dados históricos...</div>}
                                {stats.monthlyData.map((m, i) => (
                                    <div key={i} className="flex-1 flex flex-col items-center justify-end gap-1 group h-full">
                                        <div className="text-xs font-bold text-blue-600 opacity-0 group-hover:opacity-100 transition-opacity mb-1">{m.count}</div>
                                        <div style={{height: `${(m.count / stats.maxMonthCount) * 100}%`}} className="w-full bg-blue-100 group-hover:bg-blue-500 rounded-t-md transition-all min-h-[4px]"></div>
                                    </div>
                                ))}
                            </div>
                            <div className="flex items-end gap-3 mt-2">
                                {stats.monthlyData.map((m, i) => (
                                    <div key={i} className="flex-1 text-[10px] text-slate-500 font-semibold uppercase truncate text-center">{m.label.split(' de ')[0]}</div>
                                ))}
                            </div>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        {/* Ranking de Setores */}
                        <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                            <h3 className="font-bold text-slate-800 mb-5 flex items-center gap-2"><Icons.Building2 /> Setores que Mais Consomem</h3>
                            <div className="space-y-5">
                                {stats.topSectors.length === 0 && <div className="text-slate-400 text-sm">Sem dados.</div>}
                                {stats.topSectors.map((sector, i) => (
                                    <div key={i}>
                                        <div className="flex justify-between text-sm mb-1.5">
                                            <span className="font-bold text-slate-700 flex items-center gap-2"><span className="text-slate-400 text-xs w-4">{i+1}º</span> {sector.name}</span>
                                            <span className="font-bold text-purple-600">{sector.count} ped.</span>
                                        </div>
                                        <div className="w-full bg-slate-100 h-2.5 rounded-full overflow-hidden">
                                            <div style={{width: `${(sector.count / stats.maxSectorCount) * 100}%`}} className="bg-purple-500 h-full rounded-full transition-all"></div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* Itens Mais Solicitados */}
                        <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                            <h3 className="font-bold text-slate-800 mb-5 flex items-center gap-2"><Icons.ShoppingCart /> Top 5 Itens (Volume)</h3>
                            <div className="space-y-5">
                                {stats.topItems.length === 0 && <div className="text-slate-400 text-sm">Sem dados.</div>}
                                {stats.topItems.map((item, i) => (
                                    <div key={i}>
                                        <div className="flex justify-between text-sm mb-1.5">
                                            <span className="font-bold text-slate-700 truncate max-w-[80%] flex items-center gap-2"><span className="text-slate-400 text-xs w-4">{i+1}º</span> {item.name}</span>
                                            <span className="font-bold text-blue-600">{item.count} unid.</span>
                                        </div>
                                        <div className="w-full bg-slate-100 h-2.5 rounded-full overflow-hidden">
                                            <div style={{width: `${(item.count / stats.maxItemCount) * 100}%`}} className="bg-blue-500 h-full rounded-full transition-all"></div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [user, setUser] = React.useState(null);
            const [appUser, setAppUser] = React.useState(null);
            const [requests, setRequests] = React.useState([]);
            const [suggestions, setSuggestions] = React.useState([]);
            const [notices, setNotices] = React.useState({ logistics: '', admin: '' });
            const [loading, setLoading] = React.useState(true);
            const [view, setView] = React.useState('active'); 
            const [inventoryNames, setInventoryNames] = React.useState([]);
            const [inventoryMap, setInventoryMap] = React.useState({});
            const [newItem, setNewItem] = React.useState('');
            const [quantity, setQuantity] = React.useState('');
            const [unit, setUnit] = React.useState('un');
            const [category, setCategory] = React.useState('reagente');
            const [isUrgent, setIsUrgent] = React.useState(false);
            const [notes, setNotes] = React.useState('');
            const [searchTerm, setSearchTerm] = React.useState('');
            const [draftSaved, setDraftSaved] = React.useState(false);
            const [modalOpen, setModalOpen] = React.useState(false);
            const [selectedReqId, setSelectedReqId] = React.useState(null);
            const [stockMessage, setStockMessage] = React.useState('');
            const [isHistoryLocked, setIsHistoryLocked] = React.useState(true);

            // DARK MODE STATE
            const [isDarkMode, setIsDarkMode] = React.useState(() => localStorage.getItem('labflow_theme') === 'dark');
            
            // EXPORTAÇÃO EXCEL
            const [isExportingExcel, setIsExportingExcel] = React.useState(false);

            // ESTADOS DO RELATÓRIO DE CONSUMO MENSAL
            const [showConsumptionModal, setShowConsumptionModal] = React.useState(false);
            const [consumptionMonth, setConsumptionMonth] = React.useState(() => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`; });

            // NOVOS ESTADOS PARA O GESTOR (CÓDIGO, LOCAL E SETOR)
            const [itemCodeReq, setItemCodeReq] = React.useState('');
            const [storageLocationReq, setStorageLocationReq] = React.useState('');
            const [sectorReq, setSectorReq] = React.useState('');

            React.useEffect(() => { signInAnonymously(auth).catch(console.error); onAuthStateChanged(auth, u => { setUser(u); const s = localStorage.getItem('labflow_user_v2'); if (s) setAppUser(JSON.parse(s)); setLoading(false); }); }, []);
            React.useEffect(() => { if (!user) return; onSnapshot(doc(db, 'solicitacoes_lab_2026', 'NOTICES_CONFIG'), s => s.exists() ? setNotices(s.data()) : setDoc(doc(db, 'solicitacoes_lab_2026', 'NOTICES_CONFIG'), { logistics: '', admin: '' })); }, [user]);
            React.useEffect(() => { if (appUser && (newItem || quantity || notes)) { localStorage.setItem('labflow_draft_v1', JSON.stringify({ item: newItem, quantity, unit, category, notes, isUrgent })); setDraftSaved(true); setTimeout(() => setDraftSaved(false), 2000); } }, [newItem, quantity, unit, category, notes, isUrgent, appUser]);
            React.useEffect(() => { if (!user) return; onSnapshot(query(collection(db, 'solicitacoes_lab_2026'), orderBy('createdAt', 'desc')), s => setRequests(s.docs.filter(d => d.id !== 'NOTICES_CONFIG').map(d => ({ id: d.id, ...d.data() })))); }, [user]);
            
            // Fetch Sugestões
            React.useEffect(() => {
                if (!user) return;
                const q = query(collection(db, 'sugestoes_lab_2026'), orderBy('createdAt', 'desc'));
                const unsubscribe = onSnapshot(q, s => setSuggestions(s.docs.map(d => ({ id: d.id, ...d.data() }))));
                return () => unsubscribe();
            }, [user]);

            // Controle do Dark Mode Global
            React.useEffect(() => {
                if (isDarkMode) { document.documentElement.classList.add('dark'); localStorage.setItem('labflow_theme', 'dark'); }
                else { document.documentElement.classList.remove('dark'); localStorage.setItem('labflow_theme', 'light'); }
            }, [isDarkMode]);

            // --- AUTOFILL INVENTORY FETCH ---
            React.useEffect(() => { 
                if (!user) return; 
                const q = query(collection(db, 'estoque_lab_2026'), orderBy('name')); 
                const unsub = onSnapshot(q, (s) => {
                    const names = [];
                    const map = {};
                    s.docs.forEach(d => {
                        const data = d.data();
                        map[data.name.trim().toLowerCase()] = data;
                        
                        // SE FOR TÉCNICO, ESCONDE OS ITENS DE LOGÍSTICA DO DROPDOWN
                        if (appUser && appUser.role === 'lab_tech' && CAT_GROUPS.logistics.includes(data.category)) {
                            return; 
                        }
                        
                        names.push(data.name);
                    });
                    setInventoryNames(names);
                    setInventoryMap(map);
                }); 
                return () => unsub(); 
            }, [user, appUser]);

            const handleItemChange = (e) => {
                const val = e.target.value;
                setNewItem(val);
                // Lógica de Auto-fill
                const match = inventoryMap[val.trim().toLowerCase()];
                if (match) {
                    setCategory(match.category);
                    setUnit(match.unit); 
                    setStorageLocationReq(match.location || '');
                    
                    try {
                        const catalog = JSON.parse(localStorage.getItem('labflow_catalog') || '{}');
                        const savedItem = catalog[val.trim().toLowerCase()];
                        if (savedItem && savedItem.code) {
                            setItemCodeReq(savedItem.code);
                        } else {
                            setItemCodeReq('');
                        }
                    } catch(err) {}
                } else {
                    setItemCodeReq('');
                    setStorageLocationReq('');
                }
            };

            const handleLogin = (u) => { setAppUser(u); localStorage.setItem('labflow_user_v2', JSON.stringify(u)); };
            const handleLogout = () => { setAppUser(null); localStorage.removeItem('labflow_user_v2'); };
            const handleUpdateNotice = async (n) => await updateDoc(doc(db, 'solicitacoes_lab_2026', 'NOTICES_CONFIG'), n);
            const handleSubmitRequest = async (e) => { 
                e.preventDefault(); 
                if (!newItem.trim() || !quantity) return; 
                await addDoc(collection(db, 'solicitacoes_lab_2026'), { 
                    item: newItem.trim(), 
                    quantity, 
                    unit, 
                    category, 
                    isUrgent, 
                    notes, 
                    itemCode: itemCodeReq, 
                    storageLocation: storageLocationReq, 
                    requesterName: appUser.name, 
                    requesterSector: sectorReq || appUser.sector, 
                    requesterId: user.uid, 
                    createdAt: new Date().toISOString(), 
                    status: 'pending', 
                    statusUpdatedAt: new Date().toISOString()
