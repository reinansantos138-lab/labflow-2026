        const toSuperscript = (num) => {
            const map = {'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹', '-':'⁻'};
            return num.toString().split('').map(c => map[c]||c).join('');
        };

        const sendEmailNotification = async (to, subject, htmlBody) => {
            if (!to) return;
            const toArray = Array.isArray(to) ? to : [to];
            try {
                await addDoc(collection(db, 'mail'), {
                    to: toArray,
                    message: { subject, html: htmlBody }
                });
            } catch(e) { console.error('Erro ao enviar email:', e); }
        };

            if (!user) return;
            try {

                    details,
                    user: user.name,
                    userRole: user.role,
                    userUID: user.uid || '',
                    timestamp: new Date().toISOString()
                });

            Mail: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
        };

        const getNextMonday = () => { const d = new Date(); d.setDate(d.getDate() + ((1 + 7 - d.getDay()) % 7)); return d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' }); };
        const getNextOfficeDay = () => { const d = new Date(); const day = d.getDay(); let add = (3 - day + 7) % 7; if(add === 0) add = 7; d.setDate(d.getDate() + add); return d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' }); };
        const formatDate = (isoString) => { if (!isoString) return '-'; const date = new Date(isoString); return date.toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }); };
        const isRecent = (dateString, days = 7) => { if (!dateString) return false; const date = new Date(dateString); const now = new Date(); const diffTime = Math.abs(now - date); return Math.ceil(diffTime / (1000 * 60 * 60 * 24)) <= days; };

        // --- STREAMING_CHUNK:Contexto de Diálogos Customizados (Substituindo Alert/Confirm)... ---
        const DialogContext = React.createContext({ showAlert: () => {}, showConfirm: () => {} });

        const DialogProvider = ({ children }) => {
            const [dialog, setDialog] = React.useState({ isOpen: false, type: '', message: '', onConfirm: null });

            const showAlert = (message) => setDialog({ isOpen: true, type: 'alert', message, onConfirm: null });
            const showConfirm = (message, onConfirm) => setDialog({ isOpen: true, type: 'confirm', message, onConfirm });

            const handleConfirm = () => {
                if (dialog.onConfirm) dialog.onConfirm();
                setDialog({ isOpen: false });
            };

            return (
                <DialogContext.Provider value={{ showAlert, showConfirm }}>
                    {children}
                    {dialog.isOpen && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 modal-overlay fade-in">
                            <div className="bg-white rounded-xl shadow-2xl p-6 w-full max-w-sm text-center">
                                <div className="flex justify-center mb-4 text-blue-600">
                                    <Icons.AlertCircle />
                                </div>
                                <p className="text-sm text-slate-700 mb-6 font-medium">{dialog.message}</p>
                                <div className="flex gap-2 justify-center">
                                    {dialog.type === 'confirm' && (
                                        <button onClick={() => setDialog({ isOpen: false })} className="px-5 py-2 border border-slate-300 rounded-lg text-slate-600 font-bold hover:bg-slate-50 transition">Cancelar</button>
                                    )}
                                    <button onClick={handleConfirm} className="px-5 py-2 bg-blue-600 text-white rounded-lg font-bold hover:bg-blue-700 shadow transition">OK</button>
                                </div>
                            </div>
                        </div>
                    )}
                </DialogContext.Provider>
            );
        };

        // --- STREAMING_CHUNK:Motor do Estoque... ---
        const processStockTransaction = async (itemName, quantity, type, origin, user, requestId = null, notes = '', specificItemId = null) => {
            let matchingItems = [];

            if (specificItemId) {
                const docSnap = await getDoc(doc(db, 'estoque_lab_2026', specificItemId));
                if (!docSnap.exists()) throw new Error('Lote específico não encontrado no banco.');
                matchingItems = [{ doc: docSnap, id: docSnap.id, ...docSnap.data() }];
            } else {
                const q = query(collection(db, 'estoque_lab_2026'), where('name', '==', itemName));
                const querySnapshot = await getDocs(q);

                if (!querySnapshot.empty) {
                    matchingItems = querySnapshot.docs.map(d => ({ doc: d, id: d.id, ...d.data() }));
                } else {
                    const allStock = await getDocs(collection(db, 'estoque_lab_2026'));
                    matchingItems = allStock.docs
                        .filter(d => d.data().name && d.data().name.trim().toLowerCase() === itemName.trim().toLowerCase())
                        .map(d => ({ doc: d, id: d.id, ...d.data() }));
                }
            }

            if (matchingItems.length === 0) {
                if (origin === 'reposicao_logistica') throw new Error('NOT_IN_STOCK');
                if (origin === 'pedido') throw new Error(`Item "${itemName}" não encontrado no estoque. Verifique espaços no nome ou cadastre-o primeiro.`);
                return;
            }

            if (type === 'out') {
                matchingItems.sort((a, b) => {
                    if (!a.validade) return 1; 
                    if (!b.validade) return -1;
                    return new Date(a.validade) - new Date(b.validade);
                });

                let remainingChange = parseInt(quantity);
                const totalAvailable = matchingItems.reduce((sum, item) => sum + parseInt(item.currentQty || 0), 0);
                
                if (!specificItemId && totalAvailable < remainingChange) {
                    throw new Error(`Estoque insuficiente de "${itemName}". Total disponível: ${totalAvailable}, Necessário: ${remainingChange}`);
                }

                for (let item of matchingItems) {
                    if (remainingChange <= 0 && !specificItemId) break;
                    
                    let currentQty = parseInt(item.currentQty || 0);
                    let deduct = specificItemId ? remainingChange : Math.min(currentQty, remainingChange);
                    
                    if (deduct <= 0 && !specificItemId) continue; 

                    let newQty = currentQty - deduct;
                    remainingChange -= deduct;

                    await updateDoc(doc(db, 'estoque_lab_2026', item.id), {
                        currentQty: newQty,
                        updatedAt: new Date().toISOString()
                    });

                    const minQty = parseInt(item.minQty || 0);
                    if (newQty < minQty && minQty > 0) {
                        const to = CAT_GROUPS.logistics.includes(item.category) ? EMAIL_LOGISTICS : EMAIL_ADMIN;
                        await sendEmailNotification(to, `⚠️ Estoque crítico: ${itemName}`, `<p>O lote de <b>${itemName}</b> atingiu o nível crítico de estoque.</p><p>Quantidade atual: ${newQty}</p><p>Mínimo exigido: ${minQty}</p>`);
                    }

                    await addDoc(collection(db, 'movimentacoes_estoque_2026'), {
                        itemId: item.id,
                        itemName: itemName,
                        lote: item.lote || '', 
                        type: 'out',
                        quantity: deduct,
                        origin: origin,
                        requestId: requestId,
                        user: user.name,
                        userRole: user.role,
                        timestamp: new Date().toISOString(),
                        balanceAfter: newQty,
                        notes: notes + (matchingItems.length > 1 && !specificItemId ? ` (Abateu do lote: ${item.lote || 'S/N'})` : '')
                    });
                }
            } else {
                const item = matchingItems[0];
                const currentQty = parseInt(item.currentQty || 0);
                const change = parseInt(quantity);
                const newQty = currentQty + change;

                await updateDoc(doc(db, 'estoque_lab_2026', item.id), {
                    currentQty: newQty,
                    updatedAt: new Date().toISOString()
                });

                await addDoc(collection(db, 'movimentacoes_estoque_2026'), {
                    itemId: item.id,
                    itemName: itemName,
                    lote: item.lote || '', 
                    type: 'in',
                    quantity: change,
                    origin: origin,
                    requestId: requestId,
                    user: user.name,
                    userRole: user.role,
                    timestamp: new Date().toISOString(),
                    balanceAfter: newQty,
                    notes: notes
                });
            }
        };

        // --- STREAMING_CHUNK:Componente LoginScreen... ---

            const [role, setRole] = React.useState('lab_tech');

            const [error, setError] = React.useState('');
            const [isLoading, setIsLoading] = React.useState(false);

            const handleLoginSubmit = async () => {
                setError('');
                if (!email.trim() || !password.trim()) return setError("Preencha e-mail e senha.");
                setIsLoading(true);
                try {
                    const userCredential = await signInWithEmailAndPassword(auth, email, password);
                    const docSnap = await getDoc(doc(db, 'users_lab_2026', userCredential.user.uid));
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        data.uid = userCredential.user.uid;
                        onLogin(data);
                    } else {
                        setError("Perfil não encontrado no banco de dados.");
                    }
                } catch (err) {
                    console.error(err);
                    setError("E-mail ou senha incorretos.");
                }
                setIsLoading(false);
            };

            const handleRegisterSubmit = async () => {
                setError('');
                if (!name.trim()) return setError("Digite seu nome completo.");
                if (!email.trim()) return setError("Digite seu e-mail.");
                if (password.length < 6) return setError("A senha deve ter pelo menos 6 caracteres.");
                if (password !== confirmPassword) return setError("As senhas não coincidem.");
                
                if (role === 'logistics' && accessCode !== SENHA_LOGISTICA) return setError("Código de acesso incorreto para Logística.");
                if (role === 'admin' && accessCode !== SENHA_ADMIN) return setError("Código de acesso incorreto para Administração.");
                if (role === 'master' && accessCode !== SENHA_MASTER) return setError("Código de acesso incorreto para Gestor.");
                if (role === 'lab_tech' && !sector) return setError("Selecione seu setor.");

                setIsLoading(true);
                try {
                    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                    const userProfile = {
                        name: name.trim(),
                        email: email.trim(),

                        sector: role === 'logistics' ? 'LOGÍSTICA' : role === 'admin' ? 'ADMINISTRAÇÃO' : role === 'master' ? 'GESTOR DO SISTEMA' : sector
                    };
                    
                    await setDoc(doc(db, 'users_lab_2026', userCredential.user.uid), userProfile);
                    userProfile.uid = userCredential.user.uid;
                    onLogin(userProfile);
                } catch (err) {
                    console.error(err);
                    if (err.code === 'auth/email-already-in-use') setError("Este e-mail já está cadastrado.");
                    else setError("Erro ao criar conta: " + err.message);
                }
                setIsLoading(false);
            };

            return (
                <div className="min-h-screen bg-slate-50 flex flex-col items-center justify-center p-4">
                    <div className="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full border border-slate-100 fade-in">
                        <div className="flex justify-center mb-6"><InstitutionalLogo /></div>
                        <h2 className="text-xl font-semibold text-center text-slate-700 mb-1">
                            {isRegistering ? 'Criar Nova Conta' : 'Acesso ao Sistema do MQB'}
                        </h2>
                        <p className="text-center text-slate-500 mb-6 text-sm">LabFlow 2026</p>
                        
                        <div className="space-y-4">
                            {!isRegistering ? (
                                <>
                                    <div>
                                        <label className="block text-sm font-bold text-slate-700 mb-1">E-mail (Login)</label>
                                        <input type="email" value={email} onChange={(e) => setEmail(e.target.value)} placeholder="exemplo@senaicimatec.com" className="w-full p-3 border border-slate-300 rounded-lg outline-none" />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-bold text-slate-700 mb-1">Senha</label>
                                        <div className="relative">
                                            <div className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"><Icons.Lock /></div>
                                            <input type="password" value={password} onChange={(e) => setPassword(e.target.value)} placeholder="Sua senha" className="w-full pl-10 pr-3 py-3 border border-slate-300 rounded-lg outline-none" />
                                        </div>
                                    </div>
                                    {error && <div className="text-red-500 text-sm font-medium text-center bg-red-50 p-2 rounded">{error}</div>}
                                    <button onClick={handleLoginSubmit} disabled={isLoading} className="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-lg shadow uppercase transition-all">
                                        {isLoading ? 'Aguarde...' : 'Entrar'}
                                    </button>
                                    <div className="text-center mt-4 pt-4 border-t border-slate-100">
                                        <button onClick={() => { setIsRegistering(true); setError(''); }} className="text-sm text-blue-600 hover:underline font-semibold">
                                            Não tem uma conta? Cadastre-se
                                        </button>
                                    </div>
                                </>
                            ) : (
                                <div className="animate-in fade-in space-y-3">
                                    <div><label className="block text-xs font-bold text-slate-700 mb-1">Nome Completo</label><input type="text" value={name} onChange={(e) => setName(e.target.value)} placeholder="Ex: João Silva" className="w-full p-2.5 border border-slate-300 rounded-lg outline-none text-sm" /></div>
                                    
                                    <div><label className="block text-xs font-bold text-slate-700 mb-1">E-mail Corporativo</label><input type="email" value={email} onChange={(e) => setEmail(e.target.value)} placeholder="exemplo@senaicimatec.com" className="w-full p-2.5 border border-slate-300 rounded-lg outline-none text-sm" /></div>
                                    
                                    <div className="grid grid-cols-2 gap-3">
                                        <div><label className="block text-xs font-bold text-slate-700 mb-1">Senha</label><input type="password" value={password} onChange={(e) => setPassword(e.target.value)} placeholder="Mínimo 6 char" className="w-full p-2.5 border border-slate-300 rounded-lg outline-none text-sm" /></div>
                                        <div><label className="block text-xs font-bold text-slate-700 mb-1">Confirmar Senha</label><input type="password" value={confirmPassword} onChange={(e) => setConfirmPassword(e.target.value)} placeholder="Repita a senha" className="w-full p-2.5 border border-slate-300 rounded-lg outline-none text-sm" /></div>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-bold text-slate-700 mb-1">Sua Função</label>
                                        <div className="grid grid-cols-2 md:grid-cols-4 gap-2">
                                            <button onClick={() => setRole('lab_tech')} className={`p-2 rounded-lg border flex flex-col items-center justify-center gap-1 ${role === 'lab_tech' ? 'bg-blue-50 border-blue-500 text-blue-700' : 'border-slate-200 text-slate-500'}`}><Icons.Beaker /><span className="text-[10px] font-medium uppercase">Lab</span></button>
                                            <button onClick={() => setRole('logistics')} className={`p-2 rounded-lg border flex flex-col items-center justify-center gap-1 ${role === 'logistics' ? 'bg-indigo-50 border-indigo-500 text-indigo-700' : 'border-slate-200 text-slate-500'}`}><Icons.Truck /><span className="text-[10px] font-medium uppercase">Logística</span></button>
                                            <button onClick={() => setRole('admin')} className={`p-2 rounded-lg border flex flex-col items-center justify-center gap-1 ${role === 'admin' ? 'bg-purple-50 border-purple-500 text-purple-700' : 'border-slate-200 text-slate-500'}`}><Icons.Briefcase /><span className="text-[10px] font-medium uppercase">Admin</span></button>
                                            <button onClick={() => setRole('master')} className={`p-2 rounded-lg border flex flex-col items-center justify-center gap-1 ${role === 'master' ? 'bg-red-50 border-red-500 text-red-700' : 'border-slate-200 text-slate-500'}`}><Icons.Shield /><span className="text-[10px] font-medium uppercase">Gestor</span></button>
                                        </div>
                                    </div>
                                    
                                    {role === 'lab_tech' ? (
                                        <div className="fade-in"><label className="block text-xs font-bold text-slate-700 mb-1">Setor / Laboratório</label><div className="relative"><div className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"><Icons.Building2 /></div><select value={sector} onChange={(e) => setSector(e.target.value)} className="w-full pl-10 pr-3 py-2.5 border border-slate-300 rounded-lg outline-none bg-white text-sm"><option value="" disabled>Selecione...</option>{SETORES.map(s => <option key={s} value={s}>{s}</option>)}</select></div></div>
                                    ) : (
                                        <div className="fade-in"><label className="block text-xs font-bold text-slate-700 mb-1">Código de Acesso Institucional</label><div className="relative"><div className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"><Icons.Lock /></div><input type="password" value={accessCode} onChange={(e) => setAccessCode(e.target.value)} placeholder="Código obrigatório da chefia" className="w-full pl-10 pr-3 py-2.5 border border-slate-300 rounded-lg outline-none text-sm" /></div></div>
                                    )}

                                    {error && <div className="text-red-500 text-xs font-medium text-center bg-red-50 p-2 rounded">{error}</div>}
                                    
                                    <button onClick={handleRegisterSubmit} disabled={isLoading} className="w-full mt-2 py-3 bg-green-600 hover:bg-green-700 text-white font-bold rounded-lg shadow uppercase transition-all">
                                        {isLoading ? 'Aguarde...' : 'Criar Conta'}
                                    </button>

                                        <button onClick={() => { setIsRegistering(false); setError(''); }} className="text-sm text-slate-500 hover:text-slate-800 font-semibold">

                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                    
                    <div className="mt-8 text-[11px] text-slate-400 font-semibold tracking-wide uppercase">
                        Developed by Reinan Souza dos Santos
                    </div>
                </div>
            );
        };

        // --- STREAMING_CHUNK:Componente Banners e Cartões de Estoque... ---
        const NoticeBanner = ({ notices, userRole, onUpdateNotice }) => {
            const [isEditing, setIsEditing] = React.useState(false);
            const [tempLogistics, setTempLogistics] = React.useState(notices.logistics || '');

            if (isEditing) return (<div className="bg-yellow-50 border-b border-yellow-200 p-4 animate-in fade-in"><h4 className="text-sm font-bold text-yellow-800 mb-2 flex items-center gap-2"><Icons.Edit/> Editar Aviso</h4><div className="flex flex-col gap-3">{(userRole === 'logistics' || userRole === 'master') && <input className="w-full p-2 border rounded text-sm outline-none" value={tempLogistics} onChange={e => setTempLogistics(e.target.value)} placeholder="Aviso Logística..." />}{(userRole === 'admin' || userRole === 'master') && <input className="w-full p-2 border rounded text-sm outline-none" value={tempAdmin} onChange={e => setTempAdmin(e.target.value)} placeholder="Aviso Administração..." />}<div className="flex gap-2 justify-end"><button onClick={() => setIsEditing(false)} className="px-3 py-1 text-xs text-slate-500 rounded border bg-white">Cancelar</button><button onClick={handleSave} className="bg-blue-600 text-white px-4 py-1 rounded text-xs font-bold shadow-sm">Salvar</button></div></div></div>);
            
            if (!notices.logistics && !notices.admin && userRole !== 'logistics' && userRole !== 'admin' && userRole !== 'master') return null;
            
            return (<div className="bg-gradient-to-r from-blue-50 via-indigo-50 to-blue-50 border-b border-blue-200 relative shadow-sm"><div className="max-w-5xl mx-auto px-4 py-2 flex flex-col sm:flex-row items-center justify-between gap-2 text-center sm:text-left min-h-[40px]"><div className="flex-1 flex flex-col sm:flex-row gap-x-6 gap-y-2 justify-center sm:justify-start items-center w-full">{notices.logistics && <div className="flex items-center gap-2 text-indigo-800 animate-blink font-semibold text-sm"><span className="bg-indigo-600 text-white text-[10px] px-1.5 py-0.5 rounded font-bold uppercase">Logística</span><span>{notices.logistics}</span></div>}{notices.admin && <div className="flex items-center gap-2 text-indigo-900 animate-blink font-semibold text-sm"><span className="bg-indigo-600 text-white text-[10px] px-1.5 py-0.5 rounded font-bold uppercase">Adm</span><span>{notices.admin}</span></div>}</div>{userRole !== 'lab_tech' && <button onClick={() => setIsEditing(true)} className="text-slate-400 hover:text-blue-600 p-1.5 bg-white/50 hover:bg-white rounded-full transition"><Icons.Edit /></button>}</div></div>);
        };

        const InventoryItemCard = ({ item, isLocked, onUpdateQty, onDelete, onEdit, isFirstToExpire, hasMultipleLots, userRole }) => {
            const { showAlert } = React.useContext(DialogContext);
            const [isEditing, setIsEditing] = React.useState(false);
            const [editData, setEditData] = React.useState({ ...item });
            const [adjustMode, setAdjustMode] = React.useState(null); 
            const [adjustAmount, setAdjustAmount] = React.useState('');

            const handleSave = () => { onEdit(item.id, { ...editData, name: editData.name.trim() }); setIsEditing(false); };
            const handleCancel = () => { setEditData({ ...item }); setIsEditing(false); };
            const getStatusColor = (current, min) => { const cur = parseInt(current); const minimum = parseInt(min); if (cur <= 0 || cur < minimum) return 'bg-red-100 text-red-700 border-red-200'; if (cur >= minimum && cur <= minimum * 1.2) return 'bg-yellow-100 text-yellow-800 border-yellow-200'; return 'bg-green-100 text-green-700 border-green-200'; };
            const getStatusLabel = (current, min) => { const cur = parseInt(current); const minimum = parseInt(min); if (cur <= 0 || cur < minimum) return 'Crítico'; if (cur >= minimum && cur <= minimum * 1.2) return 'Atenção'; return 'OK'; };

            const handleConfirmAdjust = () => {
                const amt = parseInt(adjustAmount);
                if (!amt || amt <= 0) {
                    setAdjustMode(null);
                    return;
                }
                onUpdateQty(item.id, item.name, item.currentQty, adjustMode === 'in' ? amt : -amt);
                setAdjustMode(null);
                setAdjustAmount('');
            };

            const isLogisticsCategory = ['reagente', 'materiais', 'consumivel_log'].includes(editData.category);

            if (isEditing) return (
                <div className="bg-white p-4 rounded-xl shadow-sm border border-blue-200 relative overflow-hidden">
