                }); 
                setNewItem(''); 
                setQuantity(''); 
                setNotes(''); 
                setItemCodeReq('');
                setStorageLocationReq('');
                setSectorReq('');
                localStorage.removeItem('labflow_draft_v1'); 
                alert('Solicitação enviada!'); 
            };
            const handleSaveStockInfo = async (id, c, l, n) => { await updateDoc(doc(db, 'solicitacoes_lab_2026', id), { itemCode: c, storageLocation: l }); const cat = JSON.parse(localStorage.getItem('labflow_catalog') || '{}'); cat[n.trim().toLowerCase()] = { code: c, loc: l }; localStorage.setItem('labflow_catalog', JSON.stringify(cat)); };
            const handleUpdateReq = async (id, d) => await updateDoc(doc(db, 'solicitacoes_lab_2026', id), d);
            const handleApprovePartial = async (id, nq, oq) => { await updateDoc(doc(db, 'solicitacoes_lab_2026', id), { status: 'approved', quantity: nq, statusUpdatedAt: new Date().toISOString(), logisticsMessage: `Qtd Ajustada. Solicitado: ${oq}` }); };
            const handleMarkRestocked = async (id) => await updateDoc(doc(db, 'solicitacoes_lab_2026', id), { stockRestored: true });
            const handleOutOfStockClick = (id) => { setSelectedReqId(id); setStockMessage(''); setModalOpen(true); };
            const confirmOutOfStock = async () => { if (!selectedReqId) return; await updateDoc(doc(db, 'solicitacoes_lab_2026', selectedReqId), { status: 'out_of_stock', statusUpdatedAt: new Date().toISOString(), logisticsMessage: stockMessage || '' }); setModalOpen(false); };
            const updateStatus = async (id, s) => { const d = { status: s, statusUpdatedAt: new Date().toISOString() }; if (s === 'approved' || s === 'pending') d.logisticsMessage = ''; await updateDoc(doc(db, 'solicitacoes_lab_2026', id), d); };
            const deleteRequest = async (id) => { if (confirm('Excluir?')) await deleteDoc(doc(db, 'solicitacoes_lab_2026', id)); };
            
            const handleReceiveLogistics = async (id, item, quantity, unit) => {
                if (!confirm(`Confirmar o recebimento de ${quantity} ${unit} de ${item}?`)) return;
                
                let msg = 'Recebido e incorporado ao estoque.';
                try {
                    await processStockTransaction(item, quantity, 'in', 'reposicao_logistica', appUser, id, `Reposição recebida do Almoxarifado Central`);
                } catch (e) {
                    if (e.message === 'NOT_IN_STOCK') {
                        msg = 'Recebido e arquivado (Item não monitorado no estoque).';
                    } else {
                        console.error(e);
                        alert("Aviso de Estoque: " + e.message);
                    }
                }

                await updateDoc(doc(db, 'solicitacoes_lab_2026', id), {
                    status: 'approved',
                    isArchived: true,
                    statusUpdatedAt: new Date().toISOString(),
                    logisticsMessage: msg
                });
            };

            const handleExportPDF = (type = 'all') => {
                const d7 = new Date(); d7.setDate(d7.getDate() - 7);
                let data = requests.filter(r => new Date(r.createdAt) > d7);
                
                if (appUser.role === 'lab_tech') {
                    data = data.filter(r => r.requesterSector === appUser.sector);
                } else if (appUser.role === 'admin') {
                    data = data.filter(r => CAT_GROUPS.admin.includes(r.category));
                } else if (appUser.role === 'master' && type === 'logistics') {
                    // Exporta APENAS os itens de logística que ainda estão pendentes (Para entregar ao almoxarifado)
                    data = requests.filter(r => CAT_GROUPS.logistics.includes(r.category) && r.status === 'pending');
                }

                if (!data.length) return alert("Nada para exportar.");
                
                // ORDENAÇÃO POR SETOR
                const priorityOrder = ['QGI', 'MIC', 'ESP', 'FQA'];
                data.sort((a, b) => {
                    const sectorA = a.requesterSector || 'OUTROS';
                    const sectorB = b.requesterSector || 'OUTROS';
                    const idxA = priorityOrder.indexOf(sectorA);
                    const idxB = priorityOrder.indexOf(sectorB);
                    if (idxA !== -1 && idxB !== -1) return idxA - idxB;
                    if (idxA !== -1) return -1;
                    if (idxB !== -1) return 1;
                    return sectorA.localeCompare(sectorB);
                });

                const { jsPDF } = window.jspdf; const doc = new jsPDF('l', 'mm', 'a4');
                doc.setFontSize(18); doc.text(type === 'logistics' ? "Pedidos Almoxarifado/Logística" : "Relatório Semanal - LabFlow 2026", 14, 22);
                doc.setFontSize(10); doc.text(`Gerado em: ${new Date().toLocaleDateString('pt-BR')}`, 14, 28);
                doc.text(`Perfil: ${type === 'logistics' ? 'Gestão de Logística' : appUser.role === 'admin' ? 'Administração' : appUser.role === 'master' ? 'Gestor do Sistema' : appUser.sector}`, 14, 33);
                
                doc.autoTable({ 
                    head: [["Data", "Cód", "Item", "Local", "Qtd", "Cat", "Solicitante", "Status"]], 
                    body: data.map(r => {
                        const rawLabel = CAT_LABELS[r.category] || r.category;
                        // Regex para remover emojis
                        const cleanLabel = rawLabel.replace(/([\u2700-\u27BF]|[\uE000-\uF8FF]|\uD83C[\uDC00-\uDFFF]|\uD83D[\uDC00-\uDFFF]|[\u2011-\u26FF]|\uD83E[\uDD10-\uDDFF])/g, '').trim();
                        
                        // Translate Status
                        let statusPT = 'Pendente';
                        if (r.status === 'approved') statusPT = 'Disponível';
                        if (r.status === 'out_of_stock') statusPT = 'Em Falta';

                        return [
                            new Date(r.createdAt).toLocaleDateString('pt-BR'), 
                            r.itemCode||'-', 
                            r.item, 
                            r.storageLocation||'-', 
                            `${r.quantity} ${r.unit}`, 
                            cleanLabel, 
                            `${r.requesterName} (${r.requesterSector})`, 
                            statusPT
                        ];
                    }), 
                    startY: 40 
                });
                doc.save('relatorio.pdf');
            };
            
            // --- NOVA FUNÇÃO: EXPORTAR CONSUMO MENSAL POR SETOR (COM GRÁFICO E DETALHES) ---
            const handleExportConsumptionPDF = () => {
                if (!consumptionMonth) return;
                const [yearStr, monthStr] = consumptionMonth.split('-');
                const targetYear = parseInt(yearStr);
                const targetMonth = parseInt(monthStr) - 1; // 0-indexed no JS
                
                const monthName = new Date(targetYear, targetMonth, 1).toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
                
                // Filtra os entregues do mês selecionado
                const currentMonthRequests = requests.filter(r => {
                    if(r.status !== 'approved') return false;
                    const reqDate = new Date(r.statusUpdatedAt || r.createdAt);
                    return reqDate.getMonth() === targetMonth && reqDate.getFullYear() === targetYear;
                });

                if (currentMonthRequests.length === 0) {
                    alert("Nenhum consumo registrado neste mês.");
                    return;
                }

                // Agrupamento de dados: Setor -> Total & Itens
                const sectorData = {};
                currentMonthRequests.forEach(r => {
                    const sector = r.requesterSector || 'OUTROS';
                    const qty = parseInt(r.quantity) || 0;
                    const itemName = r.item || 'Desconhecido';
                    const unit = r.unit || 'un';
                    
                    if (!sectorData[sector]) sectorData[sector] = { total: 0, items: {} };
                    
                    sectorData[sector].total += qty;
                    
                    const itemKey = `${itemName} (${unit})`;
                    sectorData[sector].items[itemKey] = (sectorData[sector].items[itemKey] || 0) + qty;
                });

                // Ordena os setores por quem gastou mais (Volume total)
                const chartData = Object.entries(sectorData).sort((a, b) => b[1].total - a[1].total);

                const { jsPDF } = window.jspdf; 
                const doc = new jsPDF('p', 'mm', 'a4');
                
                doc.setFontSize(18); 
                doc.text("Relatório Detalhado de Consumo por Setor", 14, 22);
                doc.setFontSize(10); 
                doc.text(`Referência: ${monthName.charAt(0).toUpperCase() + monthName.slice(1)}`, 14, 28);
                doc.text(`Gerado em: ${new Date().toLocaleDateString('pt-BR')} às ${new Date().toLocaleTimeString('pt-BR')}`, 14, 33);
                doc.text(`Gerado por: ${appUser.name} (${appUser.role === 'master' ? 'Gestor' : 'Admin'})`, 14, 38);
                
                // Gráfico de Barras
                let yPos = 50;
                const maxVal = chartData[0][1].total || 1;
                const maxBarWidth = 120;

                doc.setFontSize(12);
                doc.setFont(undefined, 'bold');
                doc.text("Volume Consumido por Área (Soma de Unidades)", 14, yPos);
                yPos += 10;
                
                doc.setFontSize(10);
                doc.setFont(undefined, 'normal');

                chartData.forEach(([sector, data]) => {
                    const value = data.total;
                    // Texto do setor
                    doc.text(sector.length > 22 ? sector.substring(0, 22) + '...' : sector, 14, yPos + 4);
                    
                    // Barra
                    const barWidth = (value / maxVal) * maxBarWidth;
                    doc.setFillColor(37, 99, 235);
                    doc.rect(55, yPos, barWidth, 6, 'F');
                    
                    // Valor
                    doc.setTextColor(80, 80, 80);
                    doc.text(value.toString(), 55 + barWidth + 2, yPos + 4);
                    doc.setTextColor(0, 0, 0);
                    
                    yPos += 9;
                });

                // Tabela Detalhada (Setor -> Itens)
                yPos += 10;
                const tableRows = [];

                chartData.forEach(([sector, data]) => {
                    // Cabeçalho do Setor
                    tableRows.push([{
                        content: `▶ SETOR: ${sector.toUpperCase()} (Total Geral: ${data.total})`, 
                        colSpan: 2, 
                        styles: { fontStyle: 'bold', fillColor: [241, 245, 249], textColor: [30, 64, 175] }
                    }]);
                    
                    // Itens do setor ordenados do mais consumido para o menos
                    Object.entries(data.items).sort((a,b) => b[1] - a[1]).forEach(([item, qty]) => {
                        tableRows.push([item, qty.toString()]);
                    });
                });

                doc.autoTable({
                    startY: yPos,
                    head: [["Item Solicitado", "Quantidade"]],
                    body: tableRows,
                    theme: 'grid',
                    headStyles: { fillColor: [37, 99, 235] },
                    styles: { fontSize: 9 }
                });

                doc.save(`consumo_detalhado_${monthStr}_${yearStr}.pdf`);
                setShowConsumptionModal(false);
            };

            // --- NOVA FUNÇÃO: EXPORTAR PARA EXCEL (EXCELJS) ---
            const handleExportExcel = async () => {
                setIsExportingExcel(true);
                try {
                    const workbook = new ExcelJS.Workbook();
                    workbook.creator = appUser.name;
                    workbook.created = new Date();

                    // --- PLANILHA 1: RESUMO / DASHBOARD ---
                    const wsResumo = workbook.addWorksheet('Dashboard Gerencial');
                    wsResumo.columns = [{ width: 35 }, { width: 25 }, { width: 35 }, { width: 25 }];
                    
                    // Cabeçalho da Planilha
                    wsResumo.mergeCells('A1:D2');
                    const titleCell = wsResumo.getCell('A1');
                    titleCell.value = 'LABFLOW 2026 - RELATÓRIO ANALÍTICO GERAL';
                    titleCell.font = { size: 16, bold: true, color: { argb: 'FFFFFFFF' } };
                    titleCell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF0F172A' } }; // Azul muito escuro
                    titleCell.alignment = { vertical: 'middle', horizontal: 'center' };

                    // Informações Gerais
                    wsResumo.getCell('A4').value = 'MÉTRICAS GERAIS';
                    wsResumo.getCell('A4').font = { bold: true, size: 12, color: { argb: 'FF1E3A8A' } };
                    
                    const totalReq = requests.length;
                    const totalDelivered = requests.filter(r => r.status === 'approved').length;
                    const totalMissing = requests.filter(r => r.status === 'out_of_stock').length;
                    const totalPending = requests.filter(r => r.status === 'pending').length;

                    wsResumo.addRow(['Total de Solicitações Cadastradas', totalReq]);
                    wsResumo.addRow(['Itens Entregues / Disponíveis', totalDelivered]);
                    wsResumo.addRow(['Itens Em Falta (Não Atendidos)', totalMissing]);
                    wsResumo.addRow(['Itens Pendentes / Em Análise', totalPending]);

                    // Consumo por Setor
                    wsResumo.getCell('A10').value = 'CONSUMO POR SETOR (VOLUME DE PEDIDOS)';
                    wsResumo.getCell('A10').font = { bold: true, size: 12, color: { argb: 'FF1E3A8A' } };
                    wsResumo.getRow(11).values = ['Setor', 'Total de Pedidos'];
                    wsResumo.getRow(11).font = { bold: true };
                    wsResumo.getRow(11).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFE2E8F0' } };

                    const sectorCounts = {};
                    requests.forEach(r => {
                        const s = r.requesterSector || 'Outros';
                        sectorCounts[s] = (sectorCounts[s] || 0) + 1;
                    });
                    
                    let currentRow = 12;
                    Object.entries(sectorCounts).sort((a,b) => b[1] - a[1]).forEach(([sector, count]) => {
                        wsResumo.addRow([sector, count]);
                        currentRow++;
                    });

                    // Estilização simples do Dashboard
                    wsResumo.eachRow((row, rowNumber) => {
                        row.eachCell((cell) => {
                            cell.border = {
                                top: {style:'thin', color: {argb:'FFE2E8F0'}},
                                left: {style:'thin', color: {argb:'FFE2E8F0'}},
                                bottom: {style:'thin', color: {argb:'FFE2E8F0'}},
                                right: {style:'thin', color: {argb:'FFE2E8F0'}}
                            };
                        });
                    });

                    // --- PLANILHA 2: HISTÓRICO DE PEDIDOS ---
                    const wsPedidos = workbook.addWorksheet('Solicitações');
                    wsPedidos.columns = [
                        { header: 'Data do Pedido', key: 'data', width: 22 },
                        { header: 'Setor', key: 'setor', width: 20 },
                        { header: 'Solicitante', key: 'solicitante', width: 25 },
                        { header: 'Item / Material', key: 'item', width: 45 },
                        { header: 'Categoria', key: 'categoria', width: 25 },
                        { header: 'Qtd', key: 'qtd', width: 10 },
                        { header: 'Un.', key: 'unid', width: 10 },
                        { header: 'Status', key: 'status', width: 15 },
                        { header: 'Data Atualização', key: 'dataUpdate', width: 22 },
                        { header: 'Observações / Notas', key: 'obs', width: 40 },
                    ];

                    // Estilizar cabeçalho Pedidos
                    wsPedidos.getRow(1).font = { bold: true, color: { argb: 'FFFFFFFF' } };
                    wsPedidos.getRow(1).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF2563EB' } }; // Azul

                    requests.forEach(r => {
                        let statusPt = r.status === 'approved' ? 'Entregue' : (r.status === 'out_of_stock' ? 'Em Falta' : 'Pendente');
                        wsPedidos.addRow({
                            data: new Date(r.createdAt).toLocaleString('pt-BR'),
                            setor: r.requesterSector,
                            solicitante: r.requesterName,
                            item: r.item,
                            categoria: CAT_LABELS_CLEAN[r.category] || r.category,
                            qtd: r.quantity,
                            unid: r.unit,
                            status: statusPt,
                            dataUpdate: r.statusUpdatedAt ? new Date(r.statusUpdatedAt).toLocaleString('pt-BR') : '-',
                            obs: r.notes || ''
                        });
                    });

                    // Cores no Status da Planilha Pedidos
                    wsPedidos.eachRow((row, rowNumber) => {
                        if(rowNumber > 1) {
                            const statusCell = row.getCell('H');
                            if(statusCell.value === 'Entregue') {
                                statusCell.font = { color: { argb: 'FF16A34A' }, bold: true };
                            } else if(statusCell.value === 'Em Falta') {
                                statusCell.font = { color: { argb: 'FFDC2626' }, bold: true };
                            } else {
                                statusCell.font = { color: { argb: 'FFD97706' }, bold: true }; // Amarelo/Laranja Pendente
                            }
                        }
                    });
                    wsPedidos.autoFilter = 'A1:J1';

                    // --- PLANILHA 3: ESTOQUE ---
                    const wsEstoque = workbook.addWorksheet('Posição do Estoque');
                    wsEstoque.columns = [
                        { header: 'Item / Material', key: 'item', width: 45 },
                        { header: 'Categoria', key: 'categoria', width: 25 },
                        { header: 'Local de Armazenamento', key: 'local', width: 25 },
                        { header: 'Qtd Atual', key: 'qtd', width: 15 },
                        { header: 'Estoque Mínimo', key: 'min', width: 18 },
                        { header: 'Estoque Máximo', key: 'max', width: 18 },
                        { header: 'Status do Estoque', key: 'status', width: 20 }
                    ];

                    wsEstoque.getRow(1).font = { bold: true, color: { argb: 'FFFFFFFF' } };
                    wsEstoque.getRow(1).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF0F766E' } }; // Verde Teak

                    const inventoryArray = Object.values(inventoryMap);
                    inventoryArray.sort((a,b) => a.name.localeCompare(b.name)).forEach(item => {
                        const cur = parseInt(item.currentQty) || 0;
                        const min = parseInt(item.minQty) || 0;
                        const max = parseInt(item.maxQty) || 0;
                        let status = 'OK / Normal';
                        if(cur <= 0 || cur < min) status = 'Crítico (Abaixo do Mín)';
                        else if(cur <= min * 1.2) status = 'Atenção (Próximo Mín)';

                        wsEstoque.addRow({
                            item: item.name,
                            categoria: CAT_LABELS_CLEAN[item.category] || item.category,
                            local: item.location || '-',
                            qtd: cur,
                            min: min,
                            max: max,
                            status: status
                        });
                    });

                    // Cores no Status da Planilha Estoque
                    wsEstoque.eachRow((row, rowNumber) => {
                        if(rowNumber > 1) {
                            const statusCell = row.getCell('G');
                            if(statusCell.value.includes('Crítico')) {
                                statusCell.font = { color: { argb: 'FF991B1B' }, bold: true };
                                statusCell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFEE2E2' } };
                            } else if(statusCell.value.includes('Atenção')) {
                                statusCell.font = { color: { argb: 'FF854D0E' }, bold: true };
                                statusCell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFEF9C3' } };
                            } else {
                                statusCell.font = { color: { argb: 'FF166534' } };
                            }
                        }
                    });
                    wsEstoque.autoFilter = 'A1:G1';

                    // Salvar Arquivo
                    const buffer = await workbook.xlsx.writeBuffer();
                    const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
                    window.saveAs(blob, `LabFlow_Relatorio_Excel_${new Date().toISOString().split('T')[0]}.xlsx`);

                } catch(error) {
                    console.error(error);
                    alert("Erro ao gerar Excel: " + error.message);
                } finally {
                    setIsExportingExcel(false);
                }
            };

            // --- NOVA FUNÇÃO: ARQUIVAR CICLO MANUAL (ADM) ---
            const handleArchiveCycle = async () => {
                if (!confirm("Isso moverá todos os itens 'Disponível' ou 'Em Falta' da Administração para o histórico. Confirmar?")) return;
                const itemsToArchive = requests.filter(r => (r.status === 'approved' || r.status === 'out_of_stock') && !r.isArchived && CAT_GROUPS.admin.includes(r.category));
                if (itemsToArchive.length === 0) return alert("Nenhum item pronto para arquivar.");
                const batch = writeBatch(db);
                itemsToArchive.forEach(req => { const ref = doc(db, 'solicitacoes_lab_2026', req.id); batch.update(ref, { isArchived: true }); });
                try { await batch.commit(); alert(`${itemsToArchive.length} itens movidos para o histórico.`); } catch(e) { console.error(e); alert("Erro ao arquivar."); }
            };

            const { activeList, historyList, masterHistoryList } = React.useMemo(() => {
                if (!appUser) return { activeList: [], historyList: [], masterHistoryList: [] };
                let list = requests.filter(r => r.item.toLowerCase().includes(searchTerm.toLowerCase()) || r.requesterName.toLowerCase().includes(searchTerm.toLowerCase()));
                
                if (appUser.role === 'admin') {
                    list = list.filter(r => CAT_GROUPS.admin.includes(r.category));
                } else if (appUser.role === 'lab_tech') {
                    // Oculta integralmente itens de logística/almoxarifado para os técnicos
                    list = list.filter(r => !CAT_GROUPS.logistics.includes(r.category));
                }
                
                const active = [], history = [], masterHistory = [];
                list.forEach(r => {
                    const isLogistics = CAT_GROUPS.logistics.includes(r.category);
                    
                    if (isLogistics) {
                        // Itens de Logística que já foram finalizados ou arquivados vão direto para o Histórico do Gestor
                        const finished = r.status === 'approved' || r.status === 'out_of_stock';
                        if (r.isArchived || finished) {
                            masterHistory.push(r);
                        } else {
                            if (appUser.role === 'master') active.push(r);
                        }
                    } else {
                        if (r.isArchived) {
                            history.push(r);
                        } else {
                            const finished = r.status === 'approved' || r.status === 'out_of_stock';
                            if (appUser.role === 'admin' || appUser.role === 'master') {
                                active.push(r); 
                            } else {
                                const recent = isRecent(r.statusUpdatedAt || r.createdAt, 7);
                                if (r.status === 'pending' || (finished && recent)) active.push(r); else history.push(r);
                            }
                        }
                    }
                });
                return { activeList: active, historyList: history, masterHistoryList: masterHistory };
            }, [requests, searchTerm, appUser]);

            const groupedHistoryArray = React.useMemo(() => {
                const groups = [];
                const map = new Map();
                historyList.forEach(req => {
                    const d = new Date(req.createdAt);
                    const monthYear = d.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
                    // Capitalizando a primeira letra do mês (ex: "Fevereiro de 2026")
                    const capitalizedStr = monthYear.charAt(0).toUpperCase() + monthYear.slice(1);
                    
                    if (!map.has(capitalizedStr)) {
                        map.set(capitalizedStr, { missing: [], delivered: [] });
                        groups.push(capitalizedStr);
                    }
                    if (req.status === 'out_of_stock') map.get(capitalizedStr).missing.push(req);
                    else map.get(capitalizedStr).delivered.push(req);
                });
                return groups.map(g => ({ month: g, ...map.get(g) }));
            }, [historyList]);

            const groupedMasterHistoryArray = React.useMemo(() => {
                const groups = [];
                const map = new Map();
                masterHistoryList.forEach(req => {
                    const d = new Date(req.createdAt);
                    const monthYear = d.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
                    const capitalizedStr = monthYear.charAt(0).toUpperCase() + monthYear.slice(1);
                    
                    if (!map.has(capitalizedStr)) {
                        map.set(capitalizedStr, { items: [] });
                        groups.push(capitalizedStr);
                    }
                    map.get(capitalizedStr).items.push(req);
                });
                return groups.map(g => ({ month: g, ...map.get(g) }));
            }, [masterHistoryList]);

            const isCarnival = isCarnivalSeason();

            if (loading) return <div className="flex h-screen items-center justify-center text-slate-500">Conectando...</div>;
            if (!appUser) return <LoginScreen onLogin={handleLogin} />;

            return (
                <div className={`min-h-screen pb-20 fade-in ${isCarnival ? 'theme-carnaval' : ''}`}>
                    <NoticeBanner notices={notices} userRole={appUser.role} onUpdateNotice={handleUpdateNotice} />
                    <header className={`bg-white text-slate-800 shadow-sm border-b border-slate-200 sticky top-0 z-10 ${isCarnival ? 'header-bg' : ''}`}>
                        <div className="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center"><div className="flex items-center gap-4 select-none"><InstitutionalLogo />{isCarnival && <span className="bg-pink-100 text-pink-700 text-[10px] font-bold px-2 py-0.5 rounded-full border border-pink-200 animate-pulse">🎭 CARNAVAL</span>}<div className="hidden sm:block h-8 w-px bg-slate-200"></div><div><h1 className="text-sm font-bold text-slate-700 leading-tight">LABFLOW</h1><p className="text-xs text-slate-500 uppercase">{appUser.role === 'master' ? 'Gestor do Sistema' : appUser.role === 'admin' ? 'Administração' : appUser.sector}</p></div></div><div className="flex items-center gap-2">
                            
                            {/* Botão do Dark Mode */}
                            <button onClick={() => setIsDarkMode(!isDarkMode)} className="text-slate-400 hover:text-yellow-500 p-2 transition mr-1" title="Alternar Tema Escuro">
                                {isDarkMode ? <Icons.Sun /> : <Icons.Moon />}
                            </button>

                            {/* Novo botão de Relatório Mensal de Consumo (Abre Modal) */}
                            {(appUser.role === 'admin' || appUser.role === 'master') && (
                                <button onClick={() => setShowConsumptionModal(true)} className="flex items-center gap-2 bg-green-50 hover:bg-green-100 text-green-700 border border-green-200 text-xs font-bold py-2 px-3 rounded transition" title="Gera PDF com gráfico de consumo e itens detalhados por Setor"><Icons.BarChart /><span className="hidden sm:inline">PDF Consumo</span></button>
                            )}

                            {/* Novo botão de ExcelJS */}
                            {(appUser.role === 'admin' || appUser.role === 'master') && (
                                <button onClick={handleExportExcel} disabled={isExportingExcel} className="flex items-center gap-2 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200 text-xs font-bold py-2 px-3 rounded transition" title="Exportar Planilha Excel Detalhada com Dashboard">
                                    {isExportingExcel ? <Icons.RefreshCw className="animate-spin" /> : <Icons.FileSpreadsheet />}
                                    <span className="hidden sm:inline">{isExportingExcel ? 'Gerando...' : 'Excel'}</span>
                                </button>
                            )}

                            {appUser.role === 'master' && (
                                <button onClick={() => handleExportPDF('logistics')} className="flex items-center gap-2 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 text-xs font-bold py-2 px-3 rounded transition"><Icons.FileText /><span className="hidden sm:inline">PDF Logística</span></button>
                            )}
                            <button onClick={() => handleExportPDF('all')} className="flex items-center gap-2 bg-red-50 hover:bg-red-100 text-red-700 border border-red-200 text-xs font-bold py-2 px-3 rounded transition"><Icons.FileText /><span className="hidden sm:inline">PDF Geral</span></button>
                            <button onClick={handleLogout} className="text-slate-400 hover:text-red-500 p-2 transition"><Icons.LogOut /></button>
                        </div></div>
                        <div className={`bg-blue-600 px-4 py-2 text-center text-xs sm:text-sm font-medium text-white shadow-inner flex justify-center gap-6 ${isCarnival ? 'bg-gradient-to-r from-blue-600 via-purple-600 to-pink-600' : ''}`}><span>🧪 Lab: <span className="text-yellow-300 font-bold">{getNextMonday()}</span></span><span>📎 Escritório: <span className="text-yellow-300 font-bold">{getNextOfficeDay()}</span></span></div>
                    </header>
                    <main className="max-w-5xl mx-auto px-4 py-6">
                        <div className="flex flex-wrap gap-2 mb-6">
                            <button onClick={() => setView('active')} className={`px-4 py-2 text-sm font-bold rounded-lg transition-all flex items-center gap-2 border ${view === 'active' ? (isCarnival ? 'bg-pink-600 text-white border-pink-600 shadow-md' : 'bg-blue-600 text-white border-blue-600 shadow-md') : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50 dark:bg-slate-800 dark:border-slate-700 dark:text-slate-300 dark:hover:bg-slate-700'}`}>
                                <Icons.ClipboardList /> Pedidos em Aberto
                            </button>
                            <button onClick={() => setView('history')} className={`px-4 py-2 text-sm font-bold rounded-lg transition-all flex items-center gap-2 border ${view === 'history' ? (isCarnival ? 'bg-pink-600 text-white border-pink-600 shadow-md' : 'bg-blue-600 text-white border-blue-600 shadow-md') : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50 dark:bg-slate-800 dark:border-slate-700 dark:text-slate-300 dark:hover:bg-slate-700'}`}>
                                <Icons.History /> Histórico {appUser.role === 'master' ? 'Admin' : ''}
                            </button>
                            {(appUser.role === 'master') && <button onClick={() => setView('history_master')} className={`px-4 py-2 text-sm font-bold rounded-lg transition-all flex items-center gap-2 border ${view === 'history_master' ? (isCarnival ? 'bg-pink-600 text-white border-pink-600 shadow-md' : 'bg-blue-600 text-white border-blue-600 shadow-md') : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50 dark:bg-slate-800 dark:border-slate-700 dark:text-slate-300 dark:hover:bg-slate-700'}`}>
                                <Icons.Archive /> Histórico do Gestor
                            </button>}
                            {(appUser.role === 'admin' || appUser.role === 'master') && <button onClick={() => setView('inventory')} className={`px-4 py-2 text-sm font-bold rounded-lg transition-all flex items-center gap-2 border ${view === 'inventory' ? (isCarnival ? 'bg-pink-600 text-white border-pink-600 shadow-md' : 'bg-blue-600 text-white border-blue-600 shadow-md') : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50 dark:bg-slate-800 dark:border-slate-700 dark:text-slate-300 dark:hover:bg-slate-700'}`}>
                                <Icons.Box /> Controle de Estoque
                            </button>}
                            {(appUser.role === 'admin' || appUser.role === 'master') && <button onClick={() => setView('movements')} className={`px-4 py-2 text-sm font-bold rounded-lg transition-all flex items-center gap-2 border ${view === 'movements' ? (isCarnival ? 'bg-pink-600 text-white border-pink-600 shadow-md' : 'bg-blue-600 text-white border-blue-600 shadow-md') : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50 dark:bg-slate-800 dark:border-slate-700 dark:text-slate-300 dark:hover:bg-slate-700'}`}>
                                <Icons.Activity /> Movimentações
                            </button>}
                            {(appUser.role === 'admin' || appUser.role === 'master') && <button onClick={() => setView('purchases')} className={`px-4 py-2 text-sm font-bold rounded-lg transition-all flex items-center gap-2 border ${view === 'purchases' ? (isCarnival ? 'bg-pink-600 text-white border-pink-600 shadow-md' : 'bg-blue-600 text-white border-blue-600 shadow-md') : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50 dark:bg-slate-800 dark:border-slate-700 dark:text-slate-300 dark:hover:bg-slate-700'}`}>
                                <Icons.ShoppingCart /> Solicitação de Compras
                            </button>}
                            {(appUser.role === 'admin' || appUser.role === 'master') && (
                                <button onClick={() => setView('suggestions')} className={`px-4 py-2 text-sm font-bold rounded-lg transition-all flex items-center gap-2 border ${view === 'suggestions' ? (isCarnival ? 'bg-pink-600 text-white border-pink-600 shadow-md' : 'bg-blue-600 text-white border-blue-600 shadow-md') : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50 dark:bg-slate-800 dark:border-slate-700 dark:text-slate-300 dark:hover:bg-slate-700'}`}>
                                    <Icons.Lightbulb /> Sugestões
                                    {suggestions.filter(s => s.status === 'pending').length > 0 && (
                                        <span className="bg-yellow-500 text-white rounded-full px-1.5 py-0.5 text-[10px] leading-none ml-1">{suggestions.filter(s => s.status === 'pending').length}</span>
                                    )}
                                </button>
                            )}
                            {(appUser.role === 'admin' || appUser.role === 'master') && <button onClick={() => setView('dashboard')} className={`px-4 py-2 text-sm font-bold rounded-lg transition-all flex items-center gap-2 border ${view === 'dashboard' ? (isCarnival ? 'bg-pink-600 text-white border-pink-600 shadow-md' : 'bg-blue-600 text-white border-blue-600 shadow-md') : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50 dark:bg-slate-800 dark:border-slate-700 dark:text-slate-300 dark:hover:bg-slate-700'}`}>
                                <Icons.BarChart /> Dashboard
                            </button>}
                        </div>
                        {view === 'active' && (
                            <>
                                {(appUser.role === 'lab_tech' || appUser.role === 'master') && (
                                    <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-5 mb-8 relative">
                                        {draftSaved && <div className="absolute top-0 right-0 bg-green-100 text-green-700 text-[10px] px-2 py-1 rounded-bl-lg flex items-center gap-1"><Icons.Save /> Salvo</div>}
                                        <div className="flex justify-between items-center mb-4">
                                            <h2 className="text-lg font-bold text-slate-800 flex items-center gap-2"><div className={`${isCarnival ? 'text-pink-600' : 'text-blue-600'}`}><Icons.ClipboardList /></div> Nova Solicitação</h2>
                                            {appUser.role === 'lab_tech' && (
                                                <button type="button" onClick={() => setShowSuggestionModal(true)} className="text-xs text-blue-600 hover:text-blue-800 font-semibold flex items-center gap-1 transition">
                                                    <Icons.Lightbulb /> Não encontrou o item? Sugerir
                                                </button>
                                            )}
                                        </div>
                                        <form onSubmit={handleSubmitRequest} className="space-y-4">
                                            <div className="grid grid-cols-1 md:grid-cols-12 gap-4">
                                                <div className="md:col-span-5">
                                                    <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Item</label>
                                                    {appUser.role === 'master' && CAT_GROUPS.logistics.includes(category) ? (
                                                        <input 
                                                            type="text" 
                                                            value={newItem} 
                                                            onChange={(e) => setNewItem(e.target.value)} 
                                                            placeholder="Digite o nome do item..."
                                                            className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg outline-none"
                                                            required 
                                                        />
                                                    ) : (
                                                        <select 
                                                            value={newItem} 
                                                            onChange={handleItemChange} 
                                                            className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg outline-none cursor-pointer"
                                                            required
                                                        >
                                                            <option value="" disabled>Selecione um item do estoque...</option>
                                                            {inventoryNames.sort((a, b) => a.localeCompare(b)).map((name, i) => (
                                                                <option key={i} value={name}>{name}</option>
                                                            ))}
                                                        </select>
                                                    )}
                                                </div>
                                                <div className="md:col-span-2"><label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Qtd</label><input type="number" value={quantity} onChange={(e) => setQuantity(e.target.value)} className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg outline-none" required /></div>
                                                <div className="md:col-span-2"><label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Unid</label><select value={unit} onChange={(e) => setUnit(e.target.value)} className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg outline-none"><option value="un">Unid.</option><option value="cx">Caixa</option><option value="ml">ml</option><option value="L">L</option><option value="pct">Pacote</option></select></div>
                                                <div className="md:col-span-3">
                                                    <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Categoria</label>
                                                    <select value={category} onChange={(e) => setCategory(e.target.value)} className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg outline-none">
                                                        <optgroup label="Adm (Cicilha)"><option value="epi">🥽 EPI</option><option value="escritorio">📎 Escritório</option><option value="consumivel_adm">🗑️ Consumível (Adm)</option></optgroup>
                                                        {appUser.role === 'master' && (
                                                            <optgroup label="Almoxarifado (Logística)"><option value="reagente">🧪 Reagente</option><option value="materiais">📦 Materiais</option><option value="consumivel_log">🧴 Consumível (Lab)</option></optgroup>
                                                        )}
                                                    </select>
                                                </div>
                                            </div>

                                            {appUser.role === 'master' && (
                                                <div className="grid grid-cols-1 md:grid-cols-3 gap-4 border-t border-slate-100 pt-4">
                                                    <div>
                                                        <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Código</label>
                                                        <input type="text" value={itemCodeReq} onChange={(e) => setItemCodeReq(e.target.value)} placeholder="Código (Opcional)" className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg outline-none" />
                                                    </div>
                                                    <div>
                                                        <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Local</label>
                                                        <input type="text" value={storageLocationReq} onChange={(e) => setStorageLocationReq(e.target.value)} placeholder="Local (Opcional)" className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg outline-none" />
                                                    </div>
                                                    <div>
                                                        <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Setor Destino</label>
                                                        <select value={sectorReq} onChange={(e) => setSectorReq(e.target.value)} className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg outline-none cursor-pointer">
                                                            <option value="">Para mim ({appUser.sector})</option>
                                                            {SETORES.map(s => <option key={s} value={s}>{s}</option>)}
                                                        </select>
                                                    </div>
                                                </div>
                                            )}

                                            <div className="flex flex-col md:flex-row gap-4 items-center"><input type="text" value={notes} onChange={(e) => setNotes(e.target.value)} placeholder="Observações..." className="flex-1 w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm outline-none" /><div className="flex items-center gap-3 w-full md:w-auto"><label className="flex items-center gap-2 cursor-pointer bg-red-50 text-red-700 px-3 py-2.5 rounded-lg border border-red-100 hover:bg-red-100 transition whitespace-nowrap"><input type="checkbox" checked={isUrgent} onChange={(e) => setIsUrgent(e.target.checked)} className="w-4 h-4 text-red-600 rounded" /><span className="font-semibold text-sm">Urgente</span></label><button type="submit" className={`flex-1 text-white px-6 py-2.5 rounded-lg font-bold shadow-md transition whitespace-nowrap ${isCarnival ? 'btn-primary' : 'bg-blue-600 hover:bg-blue-700'}`}>Adicionar</button></div></div>
                                        </form>
                                    </div>
                                )}
                                <div className="flex flex-col md:flex-row justify-between items-end md:items-center gap-4 mb-6"><div className="relative w-full md:w-96"><div className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"><Icons.Search /></div><input type="text" placeholder="Buscar..." value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} className="w-full pl-10 pr-4 py-2 rounded-full border border-slate-200 focus:ring-2 focus:ring-blue-500 outline-none shadow-sm" /></div>
                                    <div className="flex items-center gap-4">
                                        <div className="text-sm font-medium text-slate-600 bg-slate-200 px-3 py-1 rounded-full">Exibindo: {activeList.length}</div>
                                        {/* BOTÃO MANUAL DE ARQUIVAR (SÓ ADM/MASTER) */}
                                        {(appUser.role === 'admin' || appUser.role === 'master') && (
                                            <button onClick={handleArchiveCycle} className="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold py-2 px-3 rounded shadow flex items-center gap-2 animate-in fade-in"><Icons.Archive /> Fechar Ciclo</button>
                                        )}
                                    </div>
                                </div>
                                <div className="space-y-3">{activeList.length === 0 ? <div className="text-center text-slate-400 py-10">Nenhum pedido pendente ou recente.</div> : activeList.map((req) => (<RequestCard key={req.id} req={req} role={appUser.role} onDelete={deleteRequest} onUpdateStatus={updateStatus} onOutOfStock={handleOutOfStockClick} onSaveStockInfo={handleSaveStockInfo} onApprovePartial={handleApprovePartial} onUpdateReq={handleUpdateReq} onReceiveLogistics={handleReceiveLogistics} currentUser={appUser} />))}</div>
                            </>
                        )}
                        {view === 'history' && (
                            <div className="space-y-8 animate-in fade-in">
                                <div className="flex flex-col md:flex-row justify-between items-end md:items-center gap-4 mb-4">
                                    <div className="relative w-full md:w-96">
                                        <div className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"><Icons.Search /></div>
                                        <input type="text" placeholder="Buscar no histórico..." value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} className="w-full pl-10 pr-4 py-2 rounded-full border border-slate-200 focus:ring-2 focus:ring-blue-500 outline-none shadow-sm" />
                                    </div>
                                    {(appUser.role === 'admin' || appUser.role === 'master') && (
                                        <button 
                                            onClick={() => setIsHistoryLocked(!isHistoryLocked)} 
                                            className={`px-4 py-2 rounded-lg font-bold shadow flex items-center gap-2 transition ${isHistoryLocked ? 'bg-slate-100 text-slate-600 hover:bg-slate-200' : 'bg-red-100 text-red-600 hover:bg-red-200'}`}
                                        >
                                            {isHistoryLocked ? <><Icons.Lock /> Travado</> : <><Icons.Unlock /> Destravado</>}
                                        </button>
                                    )}
                                </div>
                                
                                {groupedHistoryArray.length === 0 ? (
                                    <div className="text-center text-slate-400 py-10">Nenhum item no histórico.</div>
                                ) : (
                                    groupedHistoryArray.map(group => (
                                        <div key={group.month} className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                                            <h2 className="text-xl font-black text-slate-800 mb-4 capitalize border-b border-slate-200 pb-2">{group.month}</h2>
                                            
                                            {group.missing.length > 0 && (
                                                <div className="mb-6">
                                                    <h3 className="text-md font-bold text-red-700 mb-3 flex items-center gap-2"><Icons.PackageX /> Itens em Falta</h3>
                                                    <div className="space-y-3">
                                                        {group.missing.map(req => (<HistoryRow key={req.id} req={req} onMarkRestocked={handleMarkRestocked} isLocked={isHistoryLocked} onDelete={deleteRequest} onEdit={handleUpdateReq} />))}
                                                    </div>
                                                </div>
                                            )}

                                            {group.delivered.length > 0 && (
                                                <div>
                                                    <h3 className="text-md font-bold text-green-700 mb-3 flex items-center gap-2"><Icons.CheckCircle2 /> Itens Entregues/Disponíveis</h3>
                                                    <div className="space-y-3">
                                                        {group.delivered.map(req => (<HistoryRow key={req.id} req={req} onMarkRestocked={handleMarkRestocked} isLocked={isHistoryLocked} onDelete={deleteRequest} onEdit={handleUpdateReq} />))}
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    ))
                                )}
                            </div>
                        )}
                        {view === 'history_master' && (
                            <div className="space-y-8 animate-in fade-in">
                                <div className="flex flex-col md:flex-row justify-between items-end md:items-center gap-4 mb-4">
                                    <div className="relative w-full md:w-96">
                                        <div className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"><Icons.Search /></div>
                                        <input type="text" placeholder="Buscar no histórico do gestor..." value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} className="w-full pl-10 pr-4 py-2 rounded-full border border-slate-200 focus:ring-2 focus:ring-blue-500 outline-none shadow-sm" />
                                    </div>
                                    <button 
                                        onClick={() => setIsHistoryLocked(!isHistoryLocked)} 
                                        className={`px-4 py-2 rounded-lg font-bold shadow flex items-center gap-2 transition ${isHistoryLocked ? 'bg-slate-100 text-slate-600 hover:bg-slate-200' : 'bg-red-100 text-red-600 hover:bg-red-200'}`}
                                    >
                                        {isHistoryLocked ? <><Icons.Lock /> Travado</> : <><Icons.Unlock /> Destravado</>}
                                    </button>
                                </div>
                                
                                {groupedMasterHistoryArray.length === 0 ? (
                                    <div className="text-center text-slate-400 py-10">Nenhum item recebido no histórico logístico.</div>
                                ) : (
                                    groupedMasterHistoryArray.map(group => (
                                        <div key={group.month} className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                                            <h2 className="text-xl font-black text-blue-800 mb-4 capitalize border-b border-slate-200 pb-2">{group.month}</h2>
                                            <div className="space-y-3">
                                                {group.items.map(req => (<HistoryRow key={req.id} req={req} onMarkRestocked={handleMarkRestocked} isLocked={isHistoryLocked} onDelete={deleteRequest} onEdit={handleUpdateReq} />))}
                                            </div>
                                        </div>
                                    ))
                                )}
                            </div>
                        )}
                        {view === 'suggestions' && <SuggestionsView suggestions={suggestions} userRole={appUser.role} />}
                        {view === 'inventory' && <InventoryView userRole={appUser.role} currentUser={appUser} />}
                        {view === 'movements' && <MovementsView userRole={appUser.role} />}
                        {view === 'purchases' && <PurchaseRequestView userRole={appUser.role} />}
                        {view === 'dashboard' && <DashboardView requests={requests} />}
                    </main>
                    
                    {/* MODAL DE ITEM INDISPONÍVEL */}
                    {modalOpen && (<div className="fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay fade-in"><div className="bg-white rounded-xl shadow-2xl p-6 w-full max-w-sm"><h3 className="text-lg font-bold text-red-600 flex items-center gap-2 mb-4"><Icons.PackageX /> Item Indisponível</h3><p className="text-sm text-slate-600 mb-2">Informe o motivo ou previsão:</p><textarea value={stockMessage} onChange={(e) => setStockMessage(e.target.value)} placeholder="Ex: Em processo de compra..." className="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-red-500 outline-none h-24 text-sm mb-4"></textarea><div className="flex gap-2"><button onClick={() => setModalOpen(false)} className="flex-1 py-2 border border-slate-300 rounded-lg text-slate-600 font-semibold hover:bg-slate-50">Cancelar</button><button onClick={confirmOutOfStock} className="flex-1 py-2 bg-red-600 text-white rounded-lg font-bold hover:bg-red-700 shadow">Confirmar</button></div></div></div>)}
                    
                    {/* MODAL DE SUGESTÃO DE ITEM */}
                    {showSuggestionModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay fade-in">
                            <div className="bg-white rounded-xl shadow-2xl p-6 w-full max-w-md">
                                <h3 className="text-lg font-bold text-slate-800 flex items-center gap-2 mb-2"><Icons.Lightbulb /> Sugerir Novo Item</h3>
                                <p className="text-xs text-slate-500 mb-4">O item solicitado será enviado para análise da Administração para futura inclusão no estoque.</p>
                                <form onSubmit={async (e) => {
                                    e.preventDefault();
                                    await addDoc(collection(db, 'sugestoes_lab_2026'), {
                                        item: e.target.sugItem.value,
                                        motivo: e.target.sugMotivo.value,
                                        requesterName: appUser.name,
                                        requesterSector: appUser.sector,
                                        createdAt: new Date().toISOString(),
                                        status: 'pending'
                                    });
                                    setShowSuggestionModal(false);
                                    alert("Sugestão enviada com sucesso!");
                                }}>
                                    <input name="sugItem" required placeholder="Nome do Item sugerido" className="w-full p-3 border border-slate-300 rounded-lg outline-none text-sm mb-3" />
                                    <textarea name="sugMotivo" required placeholder="Justificativa / Onde ou para que será usado?" className="w-full p-3 border border-slate-300 rounded-lg outline-none text-sm h-24 mb-4"></textarea>
                                    <div className="flex gap-2">
                                        <button type="button" onClick={() => setShowSuggestionModal(false)} className="flex-1 py-2 border border-slate-300 rounded-lg text-slate-600 font-semibold hover:bg-slate-50">Cancelar</button>
                                        <button type="submit" className="flex-1 py-2 bg-blue-600 text-white rounded-lg font-bold hover:bg-blue-700 shadow">Enviar Sugestão</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* MODAL DE SELEÇÃO DE MÊS PARA CONSUMO */}
                    {showConsumptionModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay fade-in">
                            <div className="bg-white rounded-xl shadow-2xl p-6 w-full max-w-sm">
                                <h3 className="text-lg font-bold text-slate-800 flex items-center gap-2 mb-4"><Icons.BarChart /> Gerar PDF de Consumo</h3>
                                <p className="text-sm text-slate-600 mb-4">Selecione o mês/ano para visualizar o relatório detalhado por setores e itens:</p>
                                <input 
                                    type="month" 
                                    value={consumptionMonth} 
                                    onChange={(e) => setConsumptionMonth(e.target.value)} 
                                    className="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm mb-6"
                                />
                                <div className="flex gap-2">
                                    <button onClick={() => setShowConsumptionModal(false)} className="flex-1 py-2 border border-slate-300 rounded-lg text-slate-600 font-semibold hover:bg-slate-50">Cancelar</button>
                                    <button onClick={handleExportConsumptionPDF} className="flex-1 py-2 bg-blue-600 text-white rounded-lg font-bold hover:bg-blue-700 shadow">Gerar PDF</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
