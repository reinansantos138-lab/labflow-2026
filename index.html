                            <input type="number" className="p-1.5 border rounded text-xs" value={editData.currentQty ?? ''} onChange={e => setEditData({...editData, currentQty: e.target.value})} placeholder="Qtd" />
                            <input type="number" className="p-1.5 border rounded text-xs" value={editData.minQty ?? ''} onChange={e => setEditData({...editData, minQty: e.target.value})} placeholder="Min" />
                            <input type="number" className="p-1.5 border rounded text-xs" value={editData.maxQty ?? ''} onChange={e => setEditData({...editData, maxQty: e.target.value})} placeholder="Max" />
                            <select className="p-1.5 border rounded text-xs" value={editData.unit} onChange={e => setEditData({...editData, unit: e.target.value})}><option value="un">un</option><option value="cx">cx</option><option value="ml">ml</option><option value="L">L</option><option value="kg">kg</option><option value="pct">pct</option><option value="FR">FR</option></select>
                        </div>

                        {isLogisticsCategory && (
                            <div className="grid grid-cols-3 gap-1 mt-1 border-t border-blue-100 pt-2">
                                <input className="p-1.5 border rounded text-xs" value={editData.marca || ''} onChange={e => setEditData({...editData, marca: e.target.value})} placeholder="Marca" />
                                <input className="p-1.5 border rounded text-xs" value={editData.lote || ''} onChange={e => setEditData({...editData, lote: e.target.value})} placeholder="Lote" />
                                <input type="date" className="p-1.5 border rounded text-xs text-slate-500" value={editData.validade || ''} onChange={e => setEditData({...editData, validade: e.target.value})} title="Validade" />
                            </div>
                        )}

                        {(userRole === 'master' || userRole === 'logistics' || userRole === 'admin') && (
                            <div className="mt-2 pt-2 border-t border-slate-100">
                                <label className="block text-[10px] font-bold text-slate-400 uppercase mb-1">Restringir aos setores (vazio = todos)</label>
                                <div className="flex flex-wrap gap-2">
                                    {SETORES.map(s => (
                                        <label key={s} className="flex items-center gap-1 text-[10px] text-slate-600">
                                            <input type="checkbox" checked={editData.allowedSectors?.includes(s)} onChange={(e) => {
                                                let newSectors = [...(editData.allowedSectors || [])];
                                                if(e.target.checked) newSectors.push(s);
                                                else newSectors = newSectors.filter(sec => sec !== s);
                                                setEditData({...editData, allowedSectors: newSectors});
                                            }} /> {s}
                                        </label>
                                    ))}
                                </div>
                            </div>
                        )}

                        <div className="flex justify-end gap-2 mt-2"><button onClick={handleCancel} className="text-xs text-slate-500 hover:underline">Cancelar</button><button onClick={handleSave} className="bg-blue-600 text-white px-3 py-1 rounded text-xs font-bold">Salvar</button></div>
                    </div>
                </div>
            );
            
            let expiryBadge = null;
            if (item.validade) {
                const vDate = new Date(`${item.validade}T12:00:00`); 
                const today = new Date();
                const diffDays = Math.ceil((vDate - today) / (1000 * 60 * 60 * 24));
                
                if (diffDays < 0) expiryBadge = <span className="bg-red-600 text-white px-2 py-0.5 rounded text-[10px] font-bold animate-pulse">VENCIDO</span>;
                else if (diffDays <= 30) expiryBadge = <span className="bg-orange-500 text-white px-2 py-0.5 rounded text-[10px] font-bold shadow-sm">VENCE EM {diffDays} DIAS</span>;
                else expiryBadge = <span className="bg-slate-100 text-slate-600 px-2 py-0.5 rounded border text-[10px] shadow-sm">Val: {vDate.toLocaleDateString('pt-BR')}</span>;
            }

            return (
                <div className={`bg-white rounded-xl shadow-sm border relative overflow-hidden transition-all ${isFirstToExpire ? 'ring-2 ring-blue-500 border-transparent shadow-md' : 'border-slate-200'}`}>
                    {hasMultipleLots && isFirstToExpire && (
                        <div className="bg-blue-100 text-blue-800 text-[10px] py-1 font-bold flex items-center justify-center gap-1 border-b border-blue-200">
                            ⚠️ USAR PRIMEIRO (Vencimento mais próximo)
                        </div>
                    )}
                    
                    <div className={`absolute ${hasMultipleLots && isFirstToExpire ? 'top-6' : 'top-0'} right-0 px-3 py-1 text-[10px] font-bold uppercase rounded-bl-lg border-l border-b ${getStatusColor(item.currentQty, item.minQty)}`}>{getStatusLabel(item.currentQty, item.minQty)}</div>
                    
                    <div className="p-4">
                        <div className="flex justify-between items-start mt-2">
                            <div>
                                <h4 className="font-bold text-slate-800 text-lg leading-tight pr-12">{item.name}</h4>
                                <div className="text-xs text-slate-500 mb-2 mt-1">
                                    {CAT_LABELS[item.category] || item.category} • Local: {item.location || '-'}
                                    
                                    {(item.marca || item.lote) && (
                                        <div className="mt-1.5 font-medium text-slate-600 bg-slate-50 p-1.5 rounded border border-slate-100 inline-block">
                                            {item.marca && <span>Marca: <strong className="text-slate-700">{item.marca}</strong> </span>}
                                            {item.marca && item.lote && <span className="mx-1 opacity-50">|</span>}
                                            {item.lote && <span>Lote: <strong className="text-slate-700">{item.lote}</strong></span>}
                                        </div>
                                    )}
                                    {expiryBadge && <div className="mt-2 block">{expiryBadge}</div>}
                                    
                                    {(userRole === 'master' || userRole === 'logistics' || userRole === 'admin') && (
                                        <div className="mt-2 flex flex-wrap gap-1 items-center">
                                            <span className="text-[10px] font-bold uppercase text-slate-400">Acesso:</span>
                                            {(!item.allowedSectors || item.allowedSectors.length === 0) ? (
                                                <span className="bg-slate-100 text-slate-500 px-1.5 py-0.5 rounded text-[9px] border">Todos</span>
                                            ) : (
                                                item.allowedSectors.map(s => <span key={s} className="bg-blue-50 text-blue-700 border border-blue-100 px-1.5 py-0.5 rounded text-[9px] font-bold">{s}</span>)
                                            )}
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                        <div className="flex items-center justify-between mt-4 bg-slate-50 p-3 rounded-lg">
                            <div className="text-center"><div className="text-xs text-slate-400 uppercase">Mín</div><div className="font-bold text-slate-600">{item.minQty}</div></div>
                            <div className="text-center"><div className="text-xs text-slate-400 uppercase">Atual</div><div className="text-2xl font-bold text-blue-600">{item.currentQty} <span className="text-sm text-slate-400 font-normal">{item.unit}</span></div></div>
                            <div className="flex flex-col gap-1 items-end min-h-[30px]">
                                {!adjustMode ? (
                                    <div className="flex gap-1 animate-in fade-in">
                                        <button onClick={() => setAdjustMode('out')} className="p-1.5 bg-red-100 text-red-700 rounded hover:bg-red-200 transition" title="Remover em massa"><Icons.X/></button>
                                        <button onClick={() => setAdjustMode('in')} className="p-1.5 bg-green-100 text-green-700 rounded hover:bg-green-200 transition" title="Adicionar em massa"><Icons.Plus/></button>
                                    </div>
                                ) : (
                                    <div className="flex flex-col gap-1 animate-in fade-in items-end">
                                        <input type="number" min="1" value={adjustAmount} onChange={e => setAdjustAmount(e.target.value)} className="w-20 p-1.5 text-center text-xs font-bold border border-slate-300 rounded outline-none focus:border-blue-500" autoFocus placeholder="Qtd" />
                                        <div className="flex gap-1 w-20">
                                            <button onClick={() => setAdjustMode(null)} className="flex-1 bg-slate-200 text-slate-500 hover:text-slate-700 rounded py-1 text-[10px] font-bold transition">X</button>
                                            <button onClick={handleConfirmAdjust} className={`flex-1 text-white rounded py-1 text-[10px] font-bold shadow-sm transition ${adjustMode === 'in' ? 'bg-green-600 hover:bg-green-700' : 'bg-red-600 hover:bg-red-700'}`}>OK</button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                        {!isLocked && (<div className="flex justify-between mt-3 pt-3 border-t border-slate-100 animate-in fade-in"><button onClick={() => onDelete(item.id, item.name)} className="text-red-500 hover:bg-red-50 p-1.5 rounded transition"><Icons.Trash2 /></button><button onClick={() => setIsEditing(true)} className="text-blue-500 hover:bg-blue-50 p-1.5 rounded transition"><Icons.Edit /></button></div>)}
                    </div>
                </div>
            );
        };

        // --- STREAMING_CHUNK:Componente Card de Pedidos... ---
        const RequestCard = ({ req, role, onDelete, onUpdateStatus, onOutOfStock, onSaveStockInfo, onApprovePartial, onUpdateReq, onReceiveLogistics, onConfirmReceipt, currentUser }) => {
            const { showAlert } = React.useContext(DialogContext);
            const [itemCode, setItemCode] = React.useState(req.itemCode || '');
            const [storageLocation, setStorageLocation] = React.useState(req.storageLocation || '');
            const [hasChanges, setHasChanges] = React.useState(false);
            const [showPartialInput, setShowPartialInput] = React.useState(false);
            const [partialQty, setPartialQty] = React.useState(req.quantity);
            const [isEditingReq, setIsEditingReq] = React.useState(false);
            const [editItem, setEditItem] = React.useState(req.item);
            const [editQty, setEditQty] = React.useState(req.quantity);
            const [editUnit, setEditUnit] = React.useState(req.unit);
            const [editCategory, setEditCategory] = React.useState(req.category);
            const [editSector, setEditSector] = React.useState(req.requesterSector || '');

            React.useEffect(() => { if (!req.itemCode && !req.storageLocation && role !== 'lab_tech') { try { const catalog = JSON.parse(localStorage.getItem('labflow_catalog') || '{}'); const savedItem = catalog[req.item.trim().toLowerCase()]; if (savedItem) { if (savedItem.code) { setItemCode(savedItem.code); setHasChanges(true); } if (savedItem.loc) { setStorageLocation(savedItem.loc); setHasChanges(true); } } } catch (e) {} } }, [req.item, role]);

            const handleSaveInfo = () => { onSaveStockInfo(req.id, itemCode, storageLocation, req.item); setHasChanges(false); };
            const handleStatusAction = async (status) => { if (status === 'approved') { try { await processStockTransaction(req.item, req.quantity, 'out', 'pedido', currentUser, req.id, `Pedido Aprovado Total (${req.quantity} ${req.unit})`); onSaveStockInfo(req.id, itemCode, storageLocation, req.item); onUpdateStatus(req.id, status, req); } catch (error) { showAlert("Erro de Estoque: " + error.message); } } else { onUpdateStatus(req.id, status, req); } };
            const handlePartialConfirm = async () => { try { await processStockTransaction(req.item, partialQty, 'out', 'pedido', currentUser, req.id, `Pedido Aprovado Parcial (${partialQty}/${req.quantity} ${req.unit})`); onSaveStockInfo(req.id, itemCode, storageLocation, req.item); onApprovePartial(req.id, partialQty, req.quantity, req); setShowPartialInput(false); } catch (error) { showAlert("Erro de Estoque: " + error.message); } };
            const handleSaveEditReq = () => { onUpdateReq(req.id, { item: editItem.trim(), quantity: editQty, unit: editUnit, category: editCategory, requesterSector: editSector }); setIsEditingReq(false); };
            
            const isAdmCategory = CAT_GROUPS.admin.includes(req.category);
            const badgeColor = isAdmCategory ? 'bg-purple-100 text-purple-700 border-purple-200' : 'bg-slate-100 text-slate-700 border-slate-200';

            return (
                <div className={`bg-white rounded-lg shadow-sm border p-4 transition-all ${req.status === 'pending' ? 'border-l-4 border-l-yellow-400' : req.status === 'approved' ? 'border-l-4 border-l-green-500 bg-green-50/10' : 'border-l-4 border-l-red-500 opacity-75'}`}>
                    {isEditingReq ? (
                        <div className="flex flex-col gap-3 bg-blue-50/50 p-2 rounded"><h4 className="text-xs font-bold text-blue-800 uppercase">Editando Pedido (Gestor)</h4><div className="grid grid-cols-2 gap-2"><div className="col-span-2"><label className="text-[10px] font-bold text-blue-800 uppercase">Item</label><input className="p-2 border rounded text-sm w-full" value={editItem} onChange={e => setEditItem(e.target.value)} /></div><div><label className="text-[10px] font-bold text-blue-800 uppercase">Categoria</label><select className="p-2 border rounded text-sm w-full" value={editCategory} onChange={e => setEditCategory(e.target.value)}><optgroup label="Adm (Escritório)"><option value="epi">🥽 EPI</option><option value="escritorio">📎 Escritório</option><option value="consumivel_adm">🗑️ Consumível (Adm)</option></optgroup><optgroup label="Almoxarifado (Logística)"><option value="reagente">🧪 Reagente</option><option value="materiais">📦 Materiais</option><option value="consumivel_log">🧴 Consumível (Lab)</option></optgroup></select></div><div className="flex gap-1"><div className="flex-1"><label className="text-[10px] font-bold text-blue-800 uppercase">Qtd</label><input className="p-2 border rounded text-sm w-full" type="number" value={editQty} onChange={e => setEditQty(e.target.value)} /></div><div className="w-20"><label className="text-[10px] font-bold text-blue-800 uppercase">Un</label><select className="p-2 border rounded text-sm w-full" value={editUnit} onChange={e => setEditUnit(e.target.value)}><option value="un">un</option><option value="cx">cx</option><option value="ml">ml</option><option value="L">L</option><option value="kg">kg</option><option value="pct">pct</option><option value="FR">FR</option></select></div></div><div className="col-span-2"><label className="text-[10px] font-bold text-blue-800 uppercase">Setor Solicitante</label><select className="p-2 border rounded text-sm w-full" value={editSector} onChange={e => setEditSector(e.target.value)}>{SETORES.map(s => <option key={s} value={s}>{s}</option>)}</select></div></div><div className="flex justify-end gap-2"><button onClick={() => setIsEditingReq(false)} className="px-3 py-1 bg-white border rounded text-xs">Cancelar</button><button onClick={handleSaveEditReq} className="px-3 py-1 bg-blue-600 text-white rounded text-xs font-bold">Salvar Alterações</button></div></div>
                    ) : (
                        <div className="flex flex-col md:flex-row justify-between gap-4">
                            <div className="flex-1">
                                <div className="flex items-center flex-wrap gap-2 mb-2"><span className={`text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded border ${badgeColor}`}>{CAT_LABELS[req.category] || req.category}</span>{req.isUrgent && <span className="flex items-center gap-1 text-[10px] font-bold bg-red-100 text-red-600 px-2 py-0.5 rounded border border-red-200"><Icons.AlertCircle /> URGENTE</span>}<span className="text-xs text-slate-400 flex items-center gap-1 ml-auto md:ml-0"><Icons.Clock /> {formatDate(req.createdAt)}</span></div>
                                <div className="flex items-center gap-2"><div><h3 className="text-lg font-bold text-slate-800 leading-tight">{req.item}</h3><div className="text-sm font-medium text-slate-500 mt-1">Qtd: {req.quantity} {req.unit}</div></div>{(role === 'master' || role === 'admin') && <button onClick={() => setIsEditingReq(true)} className="text-slate-300 hover:text-blue-500 p-1"><Icons.Edit /></button>}</div>
                                {role !== 'lab_tech' && (<div className="mt-3 flex gap-2 items-end"><div className="flex-1 max-w-[120px]"><label className="text-[10px] font-bold text-slate-400 uppercase">Cód.</label><input type="text" value={itemCode} onChange={(e) => { setItemCode(e.target.value); setHasChanges(true); }} placeholder="0000" className="w-full text-xs p-1.5 border border-slate-300 rounded outline-none"/></div><div className="flex-1 max-w-[120px]"><label className="text-[10px] font-bold text-slate-400 uppercase">Local</label><input type="text" value={storageLocation} onChange={(e) => { setStorageLocation(e.target.value); setHasChanges(true); }} placeholder="A1" className="w-full text-xs p-1.5 border border-slate-300 rounded outline-none"/></div>{hasChanges && <button onClick={handleSaveInfo} title="Salvar" className="mb-[1px] p-1.5 bg-blue-100 text-blue-600 rounded"><Icons.Save /></button>}</div>)}
                                {role === 'lab_tech' && (req.itemCode || req.storageLocation) && (<div className="mt-2 text-xs text-slate-500 flex gap-3">{req.itemCode && <span><strong>Cód:</strong> {req.itemCode}</span>}{req.storageLocation && <span><strong>Local:</strong> {req.storageLocation}</span>}</div>)}
                                <div className="mt-3 pt-3 border-t border-slate-50 flex flex-wrap items-center gap-3 text-sm text-slate-600"><div className="flex items-center gap-1.5 bg-slate-100 px-2 py-1 rounded"><Icons.User /> <span className="font-semibold">{req.requesterName}</span><span className="text-slate-300">|</span><span className="text-blue-600 font-bold text-xs">{req.requesterSector || 'N/A'}</span></div>{req.notes && <span className="italic text-slate-400 text-xs">Obs: {req.notes}</span>}</div>
                                {req.status === 'out_of_stock' && req.logisticsMessage && <div className="mt-2 bg-red-50 border border-red-100 p-2 rounded text-red-700 text-sm"><strong>Motivo:</strong> {req.logisticsMessage}</div>}
                                {req.status === 'approved' && req.logisticsMessage && <div className="mt-2 bg-yellow-50 border border-yellow-100 p-2 rounded text-yellow-800 text-sm"><strong>Nota:</strong> {req.logisticsMessage}</div>}
                                
                                {role === 'lab_tech' && req.status === 'approved' && (
                                    <div className="mt-3">
                                        {!req.receivedBy ? (
                                            <button onClick={() => onConfirmReceipt(req.id, req)} className="bg-green-600 text-white px-3 py-1.5 rounded text-xs font-bold hover:bg-green-700 flex items-center gap-1 transition shadow-sm">
                                                <Icons.CheckCircle2 /> Confirmar Retirada
                                            </button>
                                        ) : (
                                            <span className="bg-green-50 text-green-700 border border-green-200 px-2 py-1 rounded text-[10px] font-bold">
                                                Retirado por {req.receivedBy} em {formatDate(req.receivedAt)}
                                            </span>
                                        )}
                                    </div>
                                )}
                            </div>
                            {role !== 'lab_tech' && (
                                <div className="flex flex-row md:flex-col gap-2 justify-center border-t md:border-t-0 md:border-l border-slate-100 pt-3 md:pt-0 md:pl-4 min-w-[140px]">
                                    {role === 'master' && CAT_GROUPS.logistics.includes(req.category) ? (
                                        req.status === 'pending' ? (
                                            <button onClick={() => onReceiveLogistics(req.id, req.item, req.quantity, req.unit)} className="bg-blue-600 text-white py-2 px-3 rounded-lg text-xs font-bold hover:bg-blue-700 flex items-center justify-center gap-2 shadow-sm transition">
                                                <Icons.Box /> DAR BAIXA (ENTRADA)
                                            </button>
                                        ) : (
                                            <div className="text-center"><span className="text-sm font-bold text-green-600">RECEBIDO</span></div>
                                        )
                                    ) : (
                                        req.status === 'pending' ? (
                                            !showPartialInput ? (
                                                <>
                                                    <button onClick={() => handleStatusAction('approved')} className="bg-green-100 text-green-700 py-1.5 px-3 rounded text-xs font-bold hover:bg-green-200 flex items-center justify-center gap-2" title="Entregar Total (Baixa Estoque)"><Icons.CheckCircle2 /> TOTAL</button>
                                                    <button onClick={() => setShowPartialInput(true)} className="bg-orange-100 text-orange-700 py-1.5 px-3 rounded text-xs font-bold hover:bg-orange-200 flex items-center justify-center gap-2" title="Entregar Parcial (Baixa Estoque)"><Icons.Scissors /> PARCIAL</button>
                                                    <button onClick={() => onOutOfStock(req.id, req)} className="bg-red-100 text-red-700 py-1.5 px-3 rounded text-xs font-bold hover:bg-red-200 flex items-center justify-center gap-2"><Icons.PackageX /> EM FALTA</button>
                                                </>
                                            ) : (
                                                <div className="flex flex-col gap-2 animate-in fade-in">
                                                    <div className="text-xs font-bold text-slate-500 text-center">Qtd Real?</div>
                                                    <input type="number" value={partialQty} onChange={(e) => setPartialQty(e.target.value)} className="w-full p-1 border rounded text-center text-sm font-bold"/>
                                                    <div className="flex gap-1"><button onClick={() => setShowPartialInput(false)} className="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded py-1 text-xs">X</button><button onClick={handlePartialConfirm} className="flex-1 bg-green-600 hover:bg-green-700 text-white rounded py-1 text-xs font-bold">OK</button></div>
                                                </div>
                                            )
                                        ) : (
                                            <div className="text-center"><span className={`text-sm font-bold ${req.status === 'approved' ? 'text-green-600' : 'text-red-600'}`}>{req.status === 'approved' ? 'SEPARADO' : 'INDISPONÍVEL'}</span><button onClick={() => handleStatusAction('pending')} className="block mx-auto text-xs text-slate-400 underline mt-1">Alterar</button></div>
                                        )
                                    )}
                                </div>
                            )}
                            {(role === 'lab_tech' || role === 'master') && req.status === 'pending' && role !== 'admin' && role !== 'logistics' && (<div className="flex items-center justify-end md:justify-center min-w-[50px] border-t md:border-t-0 md:border-l border-slate-100 pt-2 md:pl-4"><button onClick={() => onDelete(req.id, req.item)} className="ml-2 text-slate-300 hover:text-red-500"><Icons.Trash2 /></button></div>)}
                            {role === 'lab_tech' && req.status !== 'pending' && !req.receivedBy && (<div className="flex items-center justify-end md:justify-center min-w-[100px] border-t md:border-t-0 md:border-l border-slate-100 pt-2 md:pl-4">{req.status === 'approved' && <div className="text-center"><span className="text-green-600 text-xs font-bold bg-green-50 px-2 py-1 rounded">DISPONÍVEL</span><div className="text-[10px] text-slate-400 mt-1">Retirar na {CAT_GROUPS.admin.includes(req.category) ? '4ª' : '2ª'}</div></div>}{req.status === 'out_of_stock' && <span className="text-red-600 text-xs font-bold bg-red-50 px-2 py-1 rounded">EM FALTA</span>}</div>)}
                        </div>
                    )}
                </div>
            );
        };

        const HistoryRow = ({ req, onMarkRestocked, isLocked, onDelete, onEdit }) => {
            const [isEditing, setIsEditing] = React.useState(false);
            const [editItem, setEditItem] = React.useState(req.item);
            const [editQty, setEditQty] = React.useState(req.quantity);
            const [editUnit, setEditUnit] = React.useState(req.unit);
            const [editCategory, setEditCategory] = React.useState(req.category);

            const handleSave = () => {
                onEdit(req.id, { item: editItem.trim(), quantity: editQty, unit: editUnit, category: editCategory });
                setIsEditing(false);
            };

            if (isEditing) {
                return (
                    <div className="bg-white p-3 rounded-lg border border-blue-200 flex flex-col gap-2">
                        <div className="text-xs font-bold text-blue-800 uppercase mb-1">Editando Histórico</div>
                        <div className="grid grid-cols-2 md:grid-cols-4 gap-2">
                            <input className="p-1.5 border rounded text-sm col-span-2" value={editItem} onChange={e => setEditItem(e.target.value)} />
                            <input type="number" className="p-1.5 border rounded text-sm" value={editQty} onChange={e => setEditQty(e.target.value)} />
                            <select className="p-1.5 border rounded text-sm" value={editUnit} onChange={e => setEditUnit(e.target.value)}>
                                <option value="un">un</option><option value="cx">cx</option><option value="ml">ml</option><option value="L">L</option><option value="pct">pct</option><option value="FR">FR</option>
                            </select>
                            <select className="p-1.5 border rounded text-sm col-span-2" value={editCategory} onChange={e => setEditCategory(e.target.value)}>
                                <optgroup label="Adm (Escritório)"><option value="epi">🥽 EPI</option><option value="escritorio">📎 Escritório</option><option value="consumivel_adm">🗑️ Consumível (Adm)</option></optgroup>
                                <optgroup label="Almoxarifado (Logística)"><option value="reagente">🧪 Reagente</option><option value="materiais">📦 Materiais</option><option value="consumivel_log">🧴 Consumível (Lab)</option></optgroup>
                            </select>
                        </div>
                        <div className="flex justify-end gap-2 mt-2">
                            <button onClick={() => setIsEditing(false)} className="px-3 py-1 bg-slate-100 rounded text-xs">Cancelar</button>
                            <button onClick={handleSave} className="px-3 py-1 bg-blue-600 text-white rounded text-xs font-bold">Salvar</button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="bg-white p-3 rounded-lg border border-slate-200 flex flex-col md:flex-row gap-4 items-center text-sm">
                    <div className="flex-1 w-full">
                        <div className="flex justify-between mb-1"><span className="font-bold text-slate-700">{req.item}</span><span className="text-slate-400 text-xs">{formatDate(req.createdAt)}</span></div>
                        <div className="flex gap-2 text-xs text-slate-500"><span>{req.quantity} {req.unit}</span><span>• {req.requesterName} ({req.requesterSector})</span>{req.itemCode && <span>• Cód: {req.itemCode}</span>}</div>
                        <div className="mt-1"><span className="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded border bg-slate-50 text-slate-500">{CAT_LABELS[req.category] || req.category}</span></div>
                        {req.logisticsMessage && <div className={`text-xs mt-1 ${req.status === 'approved' ? 'text-yellow-700 bg-yellow-50 p-1 rounded inline-block' : 'text-red-500'}`}>Obs: {req.logisticsMessage}</div>}
                        
                        {req.receivedBy && (
                            <div className="mt-1 text-[10px] text-slate-400">
                                Retirado por: <span className="font-bold text-slate-600">{req.receivedBy}</span>
                            </div>
                        )}
                    </div>
                    <div className="flex flex-col md:flex-row items-center md:items-end gap-2 w-full md:w-auto justify-between md:justify-end">
                        <div className="flex items-center gap-2">
                            <span className={`px-2 py-1 rounded text-xs font-bold ${req.status === 'approved' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}`}>{req.status === 'approved' ? 'Entregue/Disp.' : 'Em Falta'}</span>
                            {req.status === 'out_of_stock' && !req.stockRestored && <button onClick={() => onMarkRestocked(req.id)} className="flex items-center gap-1 bg-blue-50 text-blue-600 border border-blue-200 px-2 py-1 rounded text-xs hover:bg-blue-100 transition"><Icons.RefreshCw /> Reposto?</button>}
                            {req.status === 'out_of_stock' && req.stockRestored && <span className="text-xs text-blue-600 font-bold border border-blue-100 bg-blue-50 px-2 py-1 rounded">Estoque OK</span>}
                        </div>
                        {!isLocked && (
                            <div className="flex gap-2 animate-in fade-in pt-2 md:pt-0">
                                <button onClick={() => setIsEditing(true)} className="text-blue-500 hover:bg-blue-50 p-1.5 rounded transition"><Icons.Edit /></button>
                                <button onClick={() => onDelete(req.id, req.item)} className="text-red-500 hover:bg-red-50 p-1.5 rounded transition"><Icons.Trash2 /></button>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // --- STREAMING_CHUNK:Views Auxiliares (Dashboard, Movimentações, etc)... ---
        const PurchaseRequestView = ({ userRole }) => {
            const { showAlert } = React.useContext(DialogContext);
            const [items, setItems] = React.useState([]);
            const [searchTerm, setSearchTerm] = React.useState('');

            React.useEffect(() => {
                const q = query(collection(db, 'estoque_lab_2026'), orderBy('name'));
                const unsubscribe = onSnapshot(q, (snapshot) => {
                    const docs = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setItems(docs);
                });
                return () => unsubscribe();
            }, []);

            const purchaseList = items.filter(item => {
                const isAdmCategory = CAT_GROUPS.admin.includes(item.category);
                const isLogCategory = CAT_GROUPS.logistics.includes(item.category);
                
                let showItem = false;
                if (userRole === 'admin') showItem = isAdmCategory;
                else if (userRole === 'logistics') showItem = isLogCategory;
                else showItem = true; 

                const current = parseInt(item.currentQty || 0);
                const min = parseInt(item.minQty || 0);
                const isLowStock = current <= (min * 1.2); 
                const matchesSearch = item.name.toLowerCase().includes(searchTerm.toLowerCase());
                
                return showItem && isLowStock && matchesSearch;
            });

            const handleExportPurchasePDF = () => {
                if (purchaseList.length === 0) return showAlert("Nenhum item em estado crítico ou de atenção para gerar requisição de compras.");
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();

                doc.setFontSize(16);
                doc.setTextColor(40, 40, 40);
                doc.text(`REQUISIÇÃO DE COMPRAS - ${userRole === 'logistics' ? 'LOGÍSTICA' : 'ADMINISTRATIVO'}`, 105, 20, null, null, 'center');
                doc.setFontSize(10);
                doc.text(`Data de Emissão: ${new Date().toLocaleDateString('pt-BR')}`, 14, 30);
                doc.text(`Solicitante: ${userRole === 'master' ? 'Gestão do Sistema' : userRole === 'logistics' ? 'Logística' : 'Administração'}`, 14, 35);

                const tableColumn = ["Item", "Categoria", "Qtd Atual", "Estoque Mín", "Sugestão de Compra"];
                const tableRows = purchaseList.map(item => {
                    const current = parseInt(item.currentQty || 0);
                    const min = parseInt(item.minQty || 0);
                    const max = parseInt(item.maxQty || 0);
                    const suggestion = max > 0 ? (max - current) : (min > 0 ? min * 2 : 0);
                    
                    return [
                        item.name,
                        CAT_LABELS_CLEAN[item.category] || item.category,
                        `${current} ${item.unit}`,
                        min,
                        `${suggestion > 0 ? suggestion : '-'} ${item.unit}`
                    ];
                });

                doc.autoTable({
                    head: [tableColumn],
                    body: tableRows,
                    startY: 45,
                    theme: 'grid',
                    headStyles: { fillColor: [37, 99, 235] } 
                });

                const finalY = doc.lastAutoTable.finalY + 30;
                doc.line(14, finalY, 90, finalY);
                doc.text("Aprovação da Gerência", 52, finalY + 5, null, null, 'center');

                doc.line(110, finalY, 190, finalY);
                doc.text("Setor de Compras", 150, finalY + 5, null, null, 'center');

                doc.save('requisicao_compras.pdf');
            };

            return (
                <div className="animate-in fade-in">
                    <div className="bg-red-50 border border-red-100 p-4 rounded-lg mb-6">
                        <h3 className="text-red-800 font-bold flex items-center gap-2"><Icons.ShoppingCart /> Painel de Compras</h3>
                        <p className="text-xs text-red-600 mt-1">Listando automaticamente itens com estoque Crítico ou em Atenção.</p>
                    </div>

                    <div className="flex justify-between items-center mb-4">
                        <div className="relative w-full max-w-md">
                            <div className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"><Icons.Search /></div>
                            <input type="text" placeholder="Filtrar lista de compras..." value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} className="w-full pl-10 pr-4 py-2 rounded-full border border-slate-200 focus:ring-2 focus:ring-blue-500 outline-none shadow-sm" />
                        </div>
                        <button onClick={handleExportPurchasePDF} className="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg font-bold shadow flex items-center gap-2">
                            <Icons.FileText /> Gerar Requisição PDF
                        </button>
                    </div>

                    <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                        <table className="w-full text-sm text-left">
                            <thead className="bg-slate-50 text-slate-500 font-semibold border-b">
                                <tr>
                                    <th className="p-3">Item</th>
                                    <th className="p-3">Status</th>
                                    <th className="p-3">Atual</th>
                                    <th className="p-3">Mínimo</th>
                                    <th className="p-3">Máximo</th>
                                    <th className="p-3 font-bold text-blue-600">Sugestão Compra</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-100">
                                {purchaseList.map(item => {
                                    const current = parseInt(item.currentQty || 0);
                                    const min = parseInt(item.minQty || 0);
                                    const max = parseInt(item.maxQty || 0);
                                    const suggestion = max > 0 ? (max - current) : (min * 2);
                                    
                                    return (
                                        <tr key={item.id} className="hover:bg-slate-50">
                                            <td className="p-3 font-bold text-slate-700">{item.name}</td>
                                            <td className="p-3">
                                                {current <= 0 || current < min ? 
                                                    <span className="bg-red-100 text-red-700 px-2 py-0.5 rounded-full text-xs font-bold">Crítico</span> : 
                                                    <span className="bg-yellow-100 text-yellow-800 px-2 py-0.5 rounded-full text-xs font-bold">Atenção</span>
                                                }
                                            </td>
                                            <td className="p-3">{current} {item.unit}</td>
                                            <td className="p-3 text-slate-400">{min}</td>
                                            <td className="p-3 text-slate-400">{max}</td>
                                            <td className="p-3 font-bold text-blue-600 bg-blue-50/50">{suggestion > 0 ? suggestion : '-'} {item.unit}</td>
                                        </tr>
                                    );
                                })}
                                {purchaseList.length === 0 && <tr><td colSpan="6" className="p-8 text-center text-slate-400">Tudo certo! Nenhum item precisa de reposição no momento.</td></tr>}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        };

        const MovementsView = ({ userRole }) => {
            const [movements, setMovements] = React.useState([]);
            const [itemsCatMap, setItemsCatMap] = React.useState({});
            const [loading, setLoading] = React.useState(true);
            const [typeFilter, setTypeFilter] = React.useState('all');

            React.useEffect(() => {
                const unsubscribeItems = onSnapshot(collection(db, 'estoque_lab_2026'), (snapshot) => {
                    const catMap = {};
                    snapshot.docs.forEach(d => { catMap[d.data().name] = d.data().category; });
                    setItemsCatMap(catMap);
                });

                const q = query(collection(db, 'movimentacoes_estoque_2026'), orderBy('timestamp', 'desc'));
                const unsubscribeMovs = onSnapshot(q, (snapshot) => {
                    setMovements(snapshot.docs.map(d => ({id: d.id, ...d.data()})));
                    setLoading(false);
                });
                return () => { unsubscribeItems(); unsubscribeMovs(); };
            }, []);

            if (loading) return <div className="text-center py-10 text-slate-500">Carregando histórico...</div>;

            const displayedMovements = movements.filter(mov => {
                const cat = mov.itemCategory || itemsCatMap[mov.itemName];
                
                let showByRole = true;
                if (userRole === 'admin') showByRole = cat ? CAT_GROUPS.admin.includes(cat) : false;
                if (userRole === 'logistics') showByRole = cat ? CAT_GROUPS.logistics.includes(cat) : false;

                let showByType = true;
                if (typeFilter !== 'all') showByType = mov.type === typeFilter;

                return showByRole && showByType;
            });

            return (
                <div className="animate-in fade-in space-y-4">
                    <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-4">
                        <h3 className="text-lg font-bold text-slate-700 flex items-center gap-2"><Icons.Activity /> Histórico de Movimentações</h3>
                        <div className="flex gap-2 bg-slate-100 p-1 rounded-full border border-slate-200 dark:bg-slate-800 dark:border-slate-700">
                            <button onClick={() => setTypeFilter('all')} className={`px-4 py-1.5 text-xs font-bold rounded-full transition ${typeFilter === 'all' ? 'bg-white text-slate-800 shadow-sm dark:bg-slate-600 dark:text-white' : 'text-slate-500 hover:text-slate-700 dark:text-slate-400'}`}>Todas</button>
                            <button onClick={() => setTypeFilter('in')} className={`px-4 py-1.5 text-xs font-bold rounded-full transition flex items-center gap-1 ${typeFilter === 'in' ? 'bg-green-100 text-green-700 shadow-sm border border-green-200' : 'text-slate-500 hover:text-slate-700 dark:text-slate-400'}`}><Icons.ArrowUpCircle/> Entradas</button>
                            <button onClick={() => setTypeFilter('out')} className={`px-4 py-1.5 text-xs font-bold rounded-full transition flex items-center gap-1 ${typeFilter === 'out' ? 'bg-red-100 text-red-700 shadow-sm border border-red-200' : 'text-slate-500 hover:text-slate-700 dark:text-slate-400'}`}><Icons.ArrowDownCircle/> Saídas</button>
                        </div>
                    </div>
                    <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                        <table className="w-full text-sm text-left">
                            <thead className="bg-slate-50 text-slate-500 font-semibold border-b">
                                <tr>
                                    <th className="p-3">Data</th>
                                    <th className="p-3">Item</th>
                                    <th className="p-3">Qtd</th>
                                    <th className="p-3">Tipo</th>
                                    <th className="p-3">Origem</th>
                                    <th className="p-3">Usuário</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-100">
                                {displayedMovements.map(mov => (
                                    <tr key={mov.id} className="hover:bg-slate-50">
                                        <td className="p-3 text-slate-500 text-xs">{formatDate(mov.timestamp)}</td>
                                        <td className="p-3 font-medium text-slate-700">{mov.itemName}</td>
                                        <td className="p-3 font-bold">{mov.quantity}</td>
                                        <td className="p-3">
                                            {mov.type === 'in' ? 
                                                <span className="bg-green-100 text-green-700 px-2 py-0.5 rounded text-xs font-bold flex items-center w-fit gap-1"><Icons.ArrowUpCircle/> Entrada</span> : 
                                                <span className="bg-red-100 text-red-700 px-2 py-0.5 rounded text-xs font-bold flex items-center w-fit gap-1"><Icons.ArrowDownCircle/> Saída</span>
                                            }
                                        </td>
                                        <td className="p-3 text-xs uppercase tracking-wide text-slate-500">{mov.origin}</td>
                                        <td className="p-3 text-xs text-slate-600">{mov.user}</td>
                                    </tr>
                                ))}
                                {displayedMovements.length === 0 && <tr><td colSpan="6" className="p-8 text-center text-slate-400">Nenhuma movimentação encontrada com este filtro.</td></tr>}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        };

        const AuditView = () => {
            const [logs, setLogs] = React.useState([]);
            const [filter, setFilter] = React.useState('Todas');
            const [loading, setLoading] = React.useState(true);

            React.useEffect(() => {
                const q = query(collection(db, 'audit_log_2026'), orderBy('timestamp', 'desc'), limit(200));
                const unsubscribe = onSnapshot(q, (s) => {
                    setLogs(s.docs.map(d => ({id: d.id, ...d.data()})));
                    setLoading(false);
                });
                return () => unsubscribe();
            }, []);

            if(loading) return <div className="text-center py-10 text-slate-500">Carregando logs de auditoria...</div>;

            const actions = ['Todas', ...new Set(logs.map(l => l.action))];
            const displayedLogs = filter === 'Todas' ? logs : logs.filter(l => l.action === filter);

            const getActionColor = (action) => {
                if (action.includes('excluido')) return 'bg-red-100 text-red-700 border-red-200';
                if (action.includes('editado') || action.includes('manual')) return 'bg-yellow-100 text-yellow-800 border-yellow-200';
                if (action.includes('received')) return 'bg-green-100 text-green-700 border-green-200';
                return 'bg-blue-100 text-blue-700 border-blue-200';
            };

            return (
                <div className="animate-in fade-in space-y-4">
                    <div className="flex flex-col sm:flex-row justify-between items-center gap-4 mb-4">
                        <h3 className="text-lg font-bold text-slate-700 flex items-center gap-2"><Icons.Shield /> Auditoria (Log Imutável)</h3>
                        <select value={filter} onChange={e => setFilter(e.target.value)} className="p-2 border rounded-lg outline-none text-sm bg-white">
                            {actions.map(a => <option key={a} value={a}>{a.toUpperCase()}</option>)}
                        </select>
                    </div>
                    <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden overflow-x-auto">
                        <table className="w-full text-sm text-left">
                            <thead className="bg-slate-50 text-slate-500 font-semibold border-b">
                                <tr>
                                    <th className="p-3">Data/Hora</th>
                                    <th className="p-3">Ação</th>
                                    <th className="p-3">Usuário</th>
                                    <th className="p-3">Detalhes</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-100">
                                {displayedLogs.map(log => {
                                    let detailsStr = JSON.stringify(log.details || {});
                                    if(detailsStr.length > 80) detailsStr = detailsStr.substring(0, 80) + '...';
                                    return (
                                        <tr key={log.id} className="hover:bg-slate-50">
                                            <td className="p-3 text-slate-500 text-xs whitespace-nowrap">{formatDate(log.timestamp)}</td>
                                            <td className="p-3">
                                                <span className={`px-2 py-0.5 rounded text-[10px] font-bold border uppercase ${getActionColor(log.action)}`}>
                                                    {log.action.replace(/_/g, ' ')}
                                                </span>
                                            </td>
                                            <td className="p-3 text-xs font-semibold text-slate-700">
                                                {log.user} <span className="text-slate-400 font-normal">({log.userRole})</span>
                                            </td>
                                            <td className="p-3 text-[10px] text-slate-500 font-mono break-all max-w-xs">{detailsStr}</td>
                                        </tr>
                                    );
                                })}
                                {displayedLogs.length === 0 && <tr><td colSpan="4" className="p-8 text-center text-slate-400">Nenhum log encontrado.</td></tr>}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        };

        const DashboardView = ({ requests, userRole }) => {
            const stats = React.useMemo(() => {
                const relevantRequests = requests.filter(r => {
                    if (userRole === 'admin') return CAT_GROUPS.admin.includes(r.category);
                    if (userRole === 'logistics') return CAT_GROUPS.logistics.includes(r.category);
                    return true; 
                });

                let totalRequests = relevantRequests.length;
                let approved = 0;
                let outOfStock = 0;
                let pending = 0;
                let totalFulfillmentTimeMs = 0;
                let fulfilledCount = 0;

                const itemCounts = {};
                const missingItemCounts = {};
                const sectorCounts = {};
                const monthCounts = {};

                relevantRequests.forEach(r => {
                    const qty = parseInt(r.quantity) || 1;
                    const itemName = r.item ? r.item.trim() : 'Desconhecido';

                    if (r.status === 'approved') {
                        approved++;
                        if (r.statusUpdatedAt && r.createdAt) {
                            const diff = new Date(r.statusUpdatedAt) - new Date(r.createdAt);
                            if (diff > 0) {
                                totalFulfillmentTimeMs += diff;
                                fulfilledCount++;
                            }
                        }
                    } else if (r.status === 'out_of_stock') {
                        outOfStock++;
                        missingItemCounts[itemName] = (missingItemCounts[itemName] || 0) + qty;
                    } else {
                        pending++;
                    }

                    itemCounts[itemName] = (itemCounts[itemName] || 0) + qty;

                    const sector = r.requesterSector || 'Outros';
                    sectorCounts[sector] = (sectorCounts[sector] || 0) + 1;

                    if (r.createdAt) {
                        const d = new Date(r.createdAt);
                        const monthKey = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
                        const monthLabel = d.toLocaleDateString('pt-BR', { month: 'short', year: 'numeric' });
                        if (!monthCounts[monthKey]) monthCounts[monthKey] = { label: monthLabel, count: 0 };
                        monthCounts[monthKey].count++;
                    }
                });

                let avgTimeLabel = "-";
                if (fulfilledCount > 0) {
                    const avgMs = totalFulfillmentTimeMs / fulfilledCount;
                    const hours = avgMs / (1000 * 60 * 60);
                    if (hours < 1) avgTimeLabel = `${Math.round(hours * 60)} min`;
                    else if (hours < 24) avgTimeLabel = `${Math.round(hours)}h`;
                    else avgTimeLabel = `${(hours / 24).toFixed(1)} dias`;
                }

                const topItems = Object.entries(itemCounts).map(([name, count]) => ({name, count})).sort((a,b) => b.count - a.count).slice(0, 5);
                const topMissingItems = Object.entries(missingItemCounts).map(([name, count]) => ({name, count})).sort((a,b) => b.count - a.count).slice(0, 5);
                const topSectors = Object.entries(sectorCounts).map(([name, count]) => ({name, count})).sort((a,b) => b.count - a.count);
                const monthlyData = Object.keys(monthCounts).sort().map(k => monthCounts[k]);

                const maxMonthCount = Math.max(...monthlyData.map(m => m.count), 1);
                const maxSectorCount = Math.max(...topSectors.map(s => s.count), 1);
                const maxItemCount = Math.max(...topItems.map(i => i.count), 1);
                const maxMissingItemCount = Math.max(...topMissingItems.map(i => i.count), 1);

                return {
                    totalRequests, approved, outOfStock, pending, avgTimeLabel,
                    topItems, topMissingItems, topSectors, monthlyData,
                    maxMonthCount, maxSectorCount, maxItemCount, maxMissingItemCount
                };
            }, [requests]);

            const totalFinished = stats.approved + stats.outOfStock;
            const approvedRate = totalFinished > 0 ? Math.round((stats.approved / totalFinished) * 100) : 0;
            const outOfStockRate = totalFinished > 0 ? Math.round((stats.outOfStock / totalFinished) * 100) : 0;

            return (
                <div className="animate-in fade-in space-y-6">
                    <div className="bg-gradient-to-r from-blue-50 to-indigo-50 border border-blue-100 p-4 rounded-xl mb-6">
                        <h3 className="text-blue-800 font-black flex items-center gap-2">
                            <Icons.BarChart /> 
                            {userRole === 'logistics' ? 'Dashboard Logística' : userRole === 'admin' ? 'Dashboard Administrativo' : 'Dashboard Analítico Geral'}
                        </h3>
                        <p className="text-xs text-blue-600 mt-1">Visão gerencial consolidada dos registros do LabFlow pertinentes à sua área.</p>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                        <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex flex-col justify-between">
                            <div className="text-slate-400 text-xs font-bold uppercase tracking-wider mb-2">Total Pedidos</div>
                            <div className="text-4xl font-black text-slate-800">{stats.totalRequests}</div>
                        </div>
                        <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex flex-col justify-between">
                            <div className="text-green-500 text-xs font-bold uppercase tracking-wider mb-2">Itens Entregues</div>
                            <div className="text-4xl font-black text-green-600">{stats.approved}</div>
                        </div>
                        <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex flex-col justify-between">
                            <div className="text-red-400 text-xs font-bold uppercase tracking-wider mb-2">Itens Em Falta</div>
                            <div className="text-4xl font-black text-red-600">{stats.outOfStock}</div>
                        </div>
                        <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex flex-col justify-between">
                            <div className="text-blue-400 text-xs font-bold uppercase tracking-wider mb-2">Tempo Médio Atend.</div>
                            <div className="text-4xl font-black text-blue-600">{stats.avgTimeLabel}</div>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex flex-col justify-center">
                            <h3 className="font-bold text-slate-800 mb-6 flex items-center gap-2">Taxa de Conversão (Finalizados)</h3>
                            <div className="flex h-8 rounded-full overflow-hidden mb-4 bg-slate-100 shadow-inner">
                                <div style={{width: `${approvedRate}%`}} className="bg-green-500 h-full flex items-center justify-center text-xs text-white font-bold transition-all">{approvedRate > 5 ? `${approvedRate}%` : ''}</div>

                        <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">

                                        <div className="flex justify-between text-sm mb-1.5">

                                            <span className="font-bold text-blue-600">{item.count} unid.</span>

                                        <div className="w-full bg-slate-100 h-2.5 rounded-full overflow-hidden">

                                    <div key={i}>
                                        <div className="flex justify-between text-sm mb-1.5">
                                            <span className="font-bold text-slate-700 truncate max-w-[80%] flex items-center gap-2"><span className="text-slate-400 text-xs w-4">{i+1}º</span> {item.name}</span>
                                            <span className="font-bold text-red-600">{item.count} unid.</span>
                                        </div>
                                        <div className="w-full bg-slate-100 h-2.5 rounded-full overflow-hidden">
                                            <div style={{width: `${(item.count / stats.maxMissingItemCount) * 100}%`}} className="bg-red-500 h-full rounded-full transition-all"></div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // --- STREAMING_CHUNK:Notas de Atualização (Changelog)... ---
        const ReleaseNotesView = () => {

                {

                {
                    version: 'v2.0.0',
                    date: 'Junho 2026',
                    changes: [
                        'Implementação do método FIFO (Primeiro a Vencer, Primeiro que Sai) na extração do estoque.',
                        'Aviso visual inteligente de lotes com vencimento próximo (Faixa ⚠️ USAR PRIMEIRO).',
                        'Inclusão da unidade "Frasco (FR)" em todas as telas.',

                        <p className="text-xs text-blue-600 mt-1">Acompanhe as últimas melhorias, correções e novas funcionalidades introduzidas no ecossistema LabFlow 2026.</p>
                    </div>
                    <div className="space-y-4">
                        {notes.map((note, i) => (
                            <div key={i} className="bg-white p-5 rounded-xl shadow-sm border border-slate-200 relative">
                                <div className="flex justify-between items-center mb-3 border-b border-slate-100 pb-2">
                                    <h4 className="text-lg font-black text-slate-800">{note.version}</h4>
                                    <span className="text-xs font-bold text-slate-500 bg-slate-100 px-2 py-1 rounded shadow-sm">{note.date}</span>
                                </div>
                                <ul className="list-disc pl-5 space-y-2 text-sm text-slate-600 marker:text-blue-500">
