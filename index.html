                                        <li key={j}>{change}</li>
                                    ))}
                                </ul>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        // --- STREAMING_CHUNK:App e Navegação Principal... ---
        const App = () => {
            const { showAlert, showConfirm } = React.useContext(DialogContext);
            const [user, setUser] = React.useState(null);
            const [appUser, setAppUser] = React.useState(null);
            const [requests, setRequests] = React.useState([]);
            const [suggestions, setSuggestions] = React.useState([]);
            const [notices, setNotices] = React.useState({ logistics: '', admin: '' });
            const [loading, setLoading] = React.useState(true);
            const [view, setView] = React.useState('active'); 
            const [inventoryNames, setInventoryNames] = React.useState([]);
            const [inventoryMap, setInventoryMap] = React.useState({});
            const [newItem, setNewItem] = React.useState('');
            const [quantity, setQuantity] = React.useState('');
            const [unit, setUnit] = React.useState('un');
            const [category, setCategory] = React.useState('reagente');
            const [isUrgent, setIsUrgent] = React.useState(false);
            const [notes, setNotes] = React.useState('');
            const [searchTerm, setSearchTerm] = React.useState('');
            const [draftSaved, setDraftSaved] = React.useState(false);
            const [modalOpen, setModalOpen] = React.useState(false);
            const [selectedReqId, setSelectedReqId] = React.useState(null);
            const [selectedReq, setSelectedReq] = React.useState(null);
            const [stockMessage, setStockMessage] = React.useState('');
            const [isHistoryLocked, setIsHistoryLocked] = React.useState(true);
            const [techSubTab, setTechSubTab] = React.useState('admin'); 
            
            const [showSuggestionModal, setShowSuggestionModal] = React.useState(false);
            const [isDarkMode, setIsDarkMode] = React.useState(() => localStorage.getItem('labflow_theme') === 'dark');
            const [isExportingExcel, setIsExportingExcel] = React.useState(false);
            const [showConsumptionModal, setShowConsumptionModal] = React.useState(false);
            
            const [consumptionStart, setConsumptionStart] = React.useState(() => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`; });
            const [consumptionEnd, setConsumptionEnd] = React.useState(() => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`; });

            const [itemCodeReq, setItemCodeReq] = React.useState('');
            const [storageLocationReq, setStorageLocationReq] = React.useState('');
            const [sectorReq, setSectorReq] = React.useState('');

            const alertDebounce = React.useRef(new Map());

            React.useEffect(() => { 
                const unsubscribe = onAuthStateChanged(auth, async u => { 
                    setUser(u); 
                    if (u) {
                        const s = localStorage.getItem('labflow_user_v2'); 
                        if (s) {
                            setAppUser(JSON.parse(s)); 
                        } else {
                            try {
                                const docSnap = await getDoc(doc(db, 'users_lab_2026', u.uid));
                                if (docSnap.exists()) {
                                    const data = docSnap.data();
                                    data.uid = u.uid;
                                    setAppUser(data);
                                    localStorage.setItem('labflow_user_v2', JSON.stringify(data));
                                }
                            } catch(e) { console.error(e); }
                        }
                    } else {
                        setAppUser(null);
                        localStorage.removeItem('labflow_user_v2');
                    }
                    setLoading(false); 
                }); 
                return () => unsubscribe(); 
            }, []);

            React.useEffect(() => { if (!user) return; onSnapshot(doc(db, 'solicitacoes_lab_2026', 'NOTICES_CONFIG'), s => s.exists() ? setNotices(s.data()) : setDoc(doc(db, 'solicitacoes_lab_2026', 'NOTICES_CONFIG'), { logistics: '', admin: '' })); }, [user]);
            React.useEffect(() => { if (appUser && (newItem || quantity || notes)) { localStorage.setItem('labflow_draft_v1', JSON.stringify({ item: newItem, quantity, unit, category, notes, isUrgent })); setDraftSaved(true); setTimeout(() => setDraftSaved(false), 2000); } }, [newItem, quantity, unit, category, notes, isUrgent, appUser]);
            React.useEffect(() => { if (!user) return; onSnapshot(query(collection(db, 'solicitacoes_lab_2026'), orderBy('createdAt', 'desc')), s => setRequests(s.docs.filter(d => d.id !== 'NOTICES_CONFIG').map(d => ({ id: d.id, ...d.data() })))); }, [user]);
            
            React.useEffect(() => {
                if (!user) return;
                const q = query(collection(db, 'sugestoes_lab_2026'), orderBy('createdAt', 'desc'));
                const unsubscribe = onSnapshot(q, s => setSuggestions(s.docs.map(d => ({ id: d.id, ...d.data() }))));
                return () => unsubscribe();
            }, [user]);

            React.useEffect(() => {
                if (isDarkMode) { document.documentElement.classList.add('dark'); localStorage.setItem('labflow_theme', 'dark'); }
                else { document.documentElement.classList.remove('dark'); localStorage.setItem('labflow_theme', 'light'); }
            }, [isDarkMode]);

            // Motor Inteligente do Estoque
            React.useEffect(() => { 
                if (!user) return; 
                const q = query(collection(db, 'estoque_lab_2026'), orderBy('name')); 
                const unsub = onSnapshot(q, (s) => {
                    const names = [];
                    const map = {};
                    s.docs.forEach(d => {
                        const data = d.data();
                        const key = data.name.trim().toLowerCase();
                        
                        if (appUser && appUser.role === 'lab_tech') {
                            if (data.allowedSectors && data.allowedSectors.length > 0 && !data.allowedSectors.includes(appUser.sector)) {
                                return;
                            }
                        }

                        if (appUser && (appUser.role === 'lab_tech' || appUser.role === 'master')) {
                            const isLogItem = CAT_GROUPS.logistics.includes(data.category);
                            if (techSubTab === 'admin' && isLogItem) return;
                            if (techSubTab === 'logistics' && !isLogItem) return;
                        }

                        if (!map[key]) {
                            map[key] = { ...data, totalQty: parseInt(data.currentQty) || 0 };
                            names.push(data.name.trim());
                        } else {
                            map[key].totalQty += parseInt(data.currentQty) || 0;
                        }

                        const current = parseInt(data.currentQty) || 0;
                        const min = parseInt(data.minQty) || 0;
                        if (current < min && min > 0) {
                            const lastAlert = alertDebounce.current.get(d.id) || 0;
                            if (Date.now() - lastAlert > 60 * 60 * 1000) {
                                alertDebounce.current.set(d.id, Date.now());
                                const to = CAT_GROUPS.logistics.includes(data.category) ? EMAIL_LOGISTICS : EMAIL_ADMIN;
                                sendEmailNotification(to, `⚠️ Reposição necessária: ${data.name}`, `<h3>Estoque Baixo</h3><p>O item ${data.name} (Lote: ${data.lote || '-'}) possui ${current} unidades (Mín: ${min}).</p>`);
                            }
                        }
                    });
                    
                    names.sort((a, b) => a.localeCompare(b));
                    setInventoryNames(names);
                    setInventoryMap(map);
                }); 
                return () => unsub(); 
            }, [user, appUser, techSubTab]);

            const handleItemChange = (e) => {
                const val = e.target.value;
                setNewItem(val);
                const match = inventoryMap[val.trim().toLowerCase()];
                if (match) {
                    setCategory(match.category);
                    setUnit(match.unit); 
                    setStorageLocationReq(match.location || '');
                    
                    try {
                        const catalog = JSON.parse(localStorage.getItem('labflow_catalog') || '{}');
                        const savedItem = catalog[val.trim().toLowerCase()];
                        if (savedItem && savedItem.code) {
                            setItemCodeReq(savedItem.code);
                        } else {
                            setItemCodeReq('');
                        }
                    } catch(err) {}
                } else {
                    setItemCodeReq('');
                    setStorageLocationReq('');
                }
            };

            const handleLogin = (u) => { setAppUser(u); localStorage.setItem('labflow_user_v2', JSON.stringify(u)); };
            const handleLogout = async () => { 
                await signOut(auth);
                setAppUser(null); 
                localStorage.removeItem('labflow_user_v2'); 
            };
            const handleUpdateNotice = async (n) => await updateDoc(doc(db, 'solicitacoes_lab_2026', 'NOTICES_CONFIG'), n);
            
            const handleSubmitRequest = async (e) => { 
                e.preventDefault(); 
                if (!newItem.trim() || !quantity) return; 
                try {
                    const docRef = await addDoc(collection(db, 'solicitacoes_lab_2026'), { 
                        item: newItem.trim(), 
                        quantity, 
                        unit, 
                        category, 
                        isUrgent, 
                        notes, 
                        itemCode: itemCodeReq, 
                        storageLocation: storageLocationReq, 
                        requesterName: appUser.name, 
                        requesterEmail: appUser.email || '', 
                        requesterSector: sectorReq || appUser.sector, 
                        requesterId: user.uid, 
                        createdAt: new Date().toISOString(), 
                        status: 'pending', 
                        statusUpdatedAt: new Date().toISOString() 
                    }); 
                    
                    const toEmail = CAT_GROUPS.logistics.includes(category) ? EMAIL_LOGISTICS : EMAIL_ADMIN;
                    const htmlMsg = `
                        <div style="font-family: sans-serif; color: #333;">
                            <h2 style="color: #2563eb;">Novo Pedido Cadastrado</h2>
                            <p><b>${appUser.name}</b> (${sectorReq || appUser.sector}) solicitou:</p>
                            <table border="1" cellpadding="8" cellspacing="0" style="border-collapse: collapse; width: 100%; max-width: 500px;">
                                <tr><td style="background:#f8fafc; font-weight:bold;">Item:</td><td>${newItem.trim()}</td></tr>
                                <tr><td style="background:#f8fafc; font-weight:bold;">Qtd:</td><td>${quantity} ${unit}</td></tr>
                                <tr><td style="background:#f8fafc; font-weight:bold;">Urgente:</td><td>${isUrgent ? 'SIM 🔴' : 'Não'}</td></tr>
                                <tr><td style="background:#f8fafc; font-weight:bold;">Obs:</td><td>${notes || '-'}</td></tr>
                            </table>
                        </div>
                    `;
                    sendEmailNotification(toEmail, `Novo pedido: ${newItem.trim()}`, htmlMsg);

                    setNewItem(''); 
                    setQuantity(''); 
                    setNotes(''); 
                    setItemCodeReq('');
                    setStorageLocationReq('');
                    setSectorReq('');
                    localStorage.removeItem('labflow_draft_v1'); 
                    showAlert('Solicitação cadastrada e enviada para aprovação!'); 
                } catch(error) {
                    console.error(error);
                    showAlert('Erro ao enviar solicitação.');
                }
            };

            const handleSaveStockInfo = async (id, c, l, n) => { await updateDoc(doc(db, 'solicitacoes_lab_2026', id), { itemCode: c, storageLocation: l }); const cat = JSON.parse(localStorage.getItem('labflow_catalog') || '{}'); cat[n.trim().toLowerCase()] = { code: c, loc: l }; localStorage.setItem('labflow_catalog', JSON.stringify(cat)); };
            
            const handleUpdateReq = async (id, d) => {
                await updateDoc(doc(db, 'solicitacoes_lab_2026', id), d);
                logAudit('pedido_editado', { requestId: id, changes: d }, appUser);
            };
            const handleEditHistory = async (id, d) => {
                await updateDoc(doc(db, 'solicitacoes_lab_2026', id), d);
                logAudit('historico_editado', { requestId: id, changes: d }, appUser);
            };

            const handleApprovePartial = async (id, nq, oq, req) => { 
                await updateDoc(doc(db, 'solicitacoes_lab_2026', id), { status: 'approved', quantity: nq, statusUpdatedAt: new Date().toISOString(), logisticsMessage: `Qtd Ajustada. Solicitado: ${oq}` }); 
                logAudit('status_alterado', { requestId: id, newStatus: 'approved' }, appUser);
                if (req && req.requesterEmail) {
                    sendEmailNotification(req.requesterEmail, `Atualização do pedido: ${req.item} — Disponível`, `<p>Olá,</p><p>Seu pedido de <b>${req.item}</b> está DISPONÍVEL (Qtd Ajustada: ${nq}).</p><p>Acesse o sistema para confirmar a retirada.</p>`);
                }
            };
            const handleMarkRestocked = async (id) => await updateDoc(doc(db, 'solicitacoes_lab_2026', id), { stockRestored: true });
            
            const handleOutOfStockClick = (id, reqObj) => { setSelectedReqId(id); setSelectedReq(reqObj); setStockMessage(''); setModalOpen(true); };
            const confirmOutOfStock = async () => { 
                if (!selectedReqId) return; 
                await updateDoc(doc(db, 'solicitacoes_lab_2026', selectedReqId), { status: 'out_of_stock', statusUpdatedAt: new Date().toISOString(), logisticsMessage: stockMessage || '' }); 
                logAudit('status_alterado', { requestId: selectedReqId, newStatus: 'out_of_stock' }, appUser);
                
                if (selectedReq && selectedReq.requesterEmail) {
                    sendEmailNotification(selectedReq.requesterEmail, `Atualização do pedido: ${selectedReq.item} — Em Falta`, `<p>Olá,</p><p>Seu pedido de <b>${selectedReq.item}</b> está EM FALTA.</p><p>Motivo: ${stockMessage || 'Não informado.'}</p>`);
                }

                setModalOpen(false); 
                setSelectedReq(null);
            };
            
            const updateStatus = async (id, s, req) => { 
                const d = { status: s, statusUpdatedAt: new Date().toISOString() }; 
                if (s === 'approved' || s === 'pending') d.logisticsMessage = ''; 
                await updateDoc(doc(db, 'solicitacoes_lab_2026', id), d); 
                logAudit('status_alterado', { requestId: id, newStatus: s }, appUser);
                
                if (req && req.requesterEmail && s === 'approved') {
                    sendEmailNotification(req.requesterEmail, `Atualização do pedido: ${req.item} — Disponível`, `<p>Olá,</p><p>Seu pedido de <b>${req.item}</b> (Qtd: ${req.quantity}) está DISPONÍVEL.</p><p>Acesse o LabFlow para confirmar a retirada física do item.</p>`);
                }
            };
            
            const deleteRequest = (id, itemName) => { 
                showConfirm('Tem certeza que deseja excluir esta solicitação permanentemente?', async () => {
                    await deleteDoc(doc(db, 'solicitacoes_lab_2026', id)); 
                    logAudit('pedido_excluido', { requestId: id, item: itemName }, appUser);
                });
            };
            const deleteHistory = (id, itemName) => { 
                showConfirm('Atenção: Excluir do Histórico apagará o registro. Confirmar?', async () => {
                    await deleteDoc(doc(db, 'solicitacoes_lab_2026', id)); 
                    logAudit('historico_excluido', { requestId: id, item: itemName }, appUser);
                });
            };

            const handleConfirmReceipt = async (id, req) => {
                const now = new Date().toISOString();
                await updateDoc(doc(db, 'solicitacoes_lab_2026', id), {
                    receivedBy: appUser.name,
                    receivedAt: now,
                    receivedUID: user.uid
                });
                await logAudit('item_received', { requestId: id, item: req.item }, appUser);
            };
            
            const handleReceiveLogistics = (id, item, quantity, unit) => {
                showConfirm(`Deseja confirmar o recebimento de ${quantity} ${unit} de ${item} e adicionar ao controle de estoque automaticamente?`, async () => {
                    let msg = 'Recebido e incorporado ao estoque.';
                    try {
                        await processStockTransaction(item, quantity, 'in', 'reposicao_logistica', appUser, id, `Reposição recebida do Almoxarifado Central`);
                    } catch (e) {
                        if (e.message === 'NOT_IN_STOCK') {
                            msg = 'Recebido e arquivado (Item não monitorado no estoque).';
                        } else {
                            console.error(e);
                            showAlert("Aviso de Estoque: " + e.message);
                            return;
                        }
                    }

                    await updateDoc(doc(db, 'solicitacoes_lab_2026', id), {
                        status: 'approved',
                        isArchived: true,
                        statusUpdatedAt: new Date().toISOString(),
                        logisticsMessage: msg
                    });
                    logAudit('status_alterado', { requestId: id, newStatus: 'approved_logistics_in' }, appUser);
                });
            };

            const handleSendWeeklyReport = async () => {
                const lastWeek = new Date();
                lastWeek.setDate(lastWeek.getDate() - 7);
                const recentReqs = requests.filter(r => new Date(r.createdAt) > lastWeek);
                
                const totalReqs = recentReqs.length;
                const totalDisp = recentReqs.filter(r => r.status === 'approved').length;
                const totalMiss = recentReqs.filter(r => r.status === 'out_of_stock').length;

                const criticalItemsHtml = Object.values(inventoryMap)
                    .filter(i => parseInt(i.currentQty||0) < parseInt(i.minQty||0))
                    .map(i => `<li><b>${i.name}</b> (Atual: ${i.currentQty}, Mínimo: ${i.minQty})</li>`)
                    .join('');

                const html = `
                    <div style="font-family: sans-serif; color: #333; max-width: 600px;">
                        <h2 style="color: #2563eb;">Relatório Semanal - LabFlow 2026</h2>
                        <p>Resumo das atividades dos últimos 7 dias:</p>
                        <ul>
                            <li><b>Total de Pedidos:</b> ${totalReqs}</li>
                            <li><b style="color: #16a34a;">Entregues/Disponíveis:</b> ${totalDisp}</li>
                            <li><b style="color: #dc2626;">Em Falta (Não Atendidos):</b> ${totalMiss}</li>
                        </ul>
                        <h3 style="color: #dc2626;">Atenção - Estoque Crítico</h3>
                        <ul>
                            ${criticalItemsHtml || '<li>Nenhum item em estado crítico no momento.</li>'}
                        </ul>
                    </div>
                `;
                
                await sendEmailNotification([EMAIL_LOGISTICS, EMAIL_ADMIN], `Relatório Semanal LabFlow (${new Date().toLocaleDateString('pt-BR')})`, html);
                showAlert("O relatório gerencial semanal foi disparado por e-mail com sucesso!");
            };

            const handleExportPDF = (type = 'all') => {
                const d7 = new Date(); d7.setDate(d7.getDate() - 7);
                let data = requests.filter(r => new Date(r.createdAt) > d7);
                
                if (appUser.role === 'lab_tech') {
                    data = data.filter(r => r.requesterSector === appUser.sector);
                } else if (appUser.role === 'admin') {
                    data = data.filter(r => CAT_GROUPS.admin.includes(r.category));
                } else if (appUser.role === 'master' && type === 'logistics') {
                    data = requests.filter(r => CAT_GROUPS.logistics.includes(r.category) && r.status === 'pending');
                }

                if (!data.length) return showAlert("Não existem registros recentes suficientes para exportar.");
                
                const priorityOrder = ['QGI', 'MIC', 'ESP', 'FQA'];
                data.sort((a, b) => {
                    const sectorA = a.requesterSector || 'OUTROS';
                    const sectorB = b.requesterSector || 'OUTROS';
                    const idxA = priorityOrder.indexOf(sectorA);
                    const idxB = priorityOrder.indexOf(sectorB);
                    if (idxA !== -1 && idxB !== -1) return idxA - idxB;
                    if (idxA !== -1) return -1;
                    if (idxB !== -1) return 1;
                    return sectorA.localeCompare(sectorB);
                });

                const { jsPDF } = window.jspdf; const doc = new jsPDF('l', 'mm', 'a4');
                doc.setFontSize(18); doc.text(type === 'logistics' ? "Pedidos Almoxarifado/Logística" : "Relatório Semanal - LabFlow 2026", 14, 22);
                doc.setFontSize(10); doc.text(`Gerado em: ${new Date().toLocaleDateString('pt-BR')}`, 14, 28);
                doc.text(`Perfil: ${type === 'logistics' ? 'Gestão de Logística' : appUser.role === 'admin' ? 'Administração' : appUser.role === 'master' ? 'Gestor do Sistema' : appUser.sector}`, 14, 33);
                
                doc.autoTable({ 
                    head: [["Data", "Cód", "Item", "Local", "Qtd", "Cat", "Solicitante", "Status"]], 
                    body: data.map(r => {
                        const rawLabel = CAT_LABELS[r.category] || r.category;
                        const cleanLabel = rawLabel.replace(/([\u2700-\u27BF]|[\uE000-\uF8FF]|\uD83C[\uDC00-\uDFFF]|\uD83D[\uDC00-\uDFFF]|[\u2011-\u26FF]|\uD83E[\uDD10-\uDDFF])/g, '').trim();
                        let statusPT = 'Pendente';
                        if (r.status === 'approved') statusPT = 'Disponível';
                        if (r.status === 'out_of_stock') statusPT = 'Em Falta';

                        return [
                            new Date(r.createdAt).toLocaleDateString('pt-BR'), 
                            r.itemCode||'-', 
                            r.item, 
                            r.storageLocation||'-', 
                            `${r.quantity} ${r.unit}`, 
                            cleanLabel, 
                            `${r.requesterName} (${r.requesterSector})`, 
                            statusPT
                        ];
                    }), 
                    startY: 40 
                });
                doc.save('relatorio.pdf');
            };

            const handleExportConsumptionPDF = () => {
                if (!consumptionStart || !consumptionEnd) return;
                
                const [sYearStr, sMonthStr] = consumptionStart.split('-');
                const [eYearStr, eMonthStr] = consumptionEnd.split('-');
                
                const startYear = parseInt(sYearStr);
                const startMonth = parseInt(sMonthStr) - 1; 
                const endYear = parseInt(eYearStr);
                const endMonth = parseInt(eMonthStr) - 1;

                const startDate = new Date(startYear, startMonth, 1);
                const endDate = new Date(endYear, endMonth + 1, 0, 23, 59, 59);

                const periodLabel = `${startDate.toLocaleDateString('pt-BR', { month: 'short', year: 'numeric' })} a ${endDate.toLocaleDateString('pt-BR', { month: 'short', year: 'numeric' })}`;

                const periodRequests = requests.filter(r => {
                    if(r.status !== 'approved') return false;
                    const reqDate = new Date(r.statusUpdatedAt || r.createdAt);
                    return reqDate >= startDate && reqDate <= endDate;
                });

                if (periodRequests.length === 0) {
                    showAlert(`Nenhum consumo foi registrado no período de ${periodLabel}.`);
                    return;
                }

                const sectorData = {};
                periodRequests.forEach(r => {
                    const sector = r.requesterSector || 'OUTROS';
                    const qty = parseInt(r.quantity) || 0;
                    const itemName = r.item || 'Desconhecido';
                    const unit = r.unit || 'un';
                    
                    if (!sectorData[sector]) sectorData[sector] = { total: 0, items: {} };
                    
                    sectorData[sector].total += qty;
                    
                    const itemKey = `${itemName} (${unit})`;
                    sectorData[sector].items[itemKey] = (sectorData[sector].items[itemKey] || 0) + qty;
                });

                const chartData = Object.entries(sectorData).sort((a, b) => b[1].total - a[1].total);

                const { jsPDF } = window.jspdf; 
                const doc = new jsPDF('p', 'mm', 'a4');
                
                doc.setFontSize(18); 
                doc.text("Relatório Detalhado de Consumo por Setor", 14, 22);
                doc.setFontSize(10); 
                doc.text(`Referência: ${periodLabel}`, 14, 28);
                doc.text(`Gerado em: ${new Date().toLocaleDateString('pt-BR')} às ${new Date().toLocaleTimeString('pt-BR')}`, 14, 33);
                doc.text(`Gerado por: ${appUser.name} (${appUser.role === 'master' ? 'Gestor' : 'Admin'})`, 14, 38);
                
                let yPos = 50;
                const maxVal = chartData[0][1].total || 1;
                const maxBarWidth = 120;

                doc.setFontSize(12);
                doc.setFont(undefined, 'bold');
                doc.text("Volume Consumido por Área (Soma de Unidades)", 14, yPos);
                yPos += 10;
                
                doc.setFontSize(10);
                doc.setFont(undefined, 'normal');

                chartData.forEach(([sector, data]) => {
                    const value = data.total;
                    doc.text(sector.length > 22 ? sector.substring(0, 22) + '...' : sector, 14, yPos + 4);
                    const barWidth = (value / maxVal) * maxBarWidth;
                    doc.setFillColor(37, 99, 235);
                    doc.rect(55, yPos, barWidth, 6, 'F');
                    doc.setTextColor(80, 80, 80);
                    doc.text(value.toString(), 55 + barWidth + 2, yPos + 4);
                    doc.setTextColor(0, 0, 0);
                    yPos += 9;
                });

                yPos += 10;
                const tableRows = [];

                chartData.forEach(([sector, data]) => {
                    tableRows.push([{
                        content: `▶ SETOR: ${sector.toUpperCase()} (Total Geral: ${data.total})`, 
                        colSpan: 2, 
                        styles: { fontStyle: 'bold', fillColor: [241, 245, 249], textColor: [30, 64, 175] }
                    }]);
                    Object.entries(data.items).sort((a,b) => b[1] - a[1]).forEach(([item, qty]) => {
                        tableRows.push([item, qty.toString()]);
                    });
                });

                doc.autoTable({
                    startY: yPos,
                    head: [["Item Solicitado", "Quantidade"]],
                    body: tableRows,
                    theme: 'grid',
                    headStyles: { fillColor: [37, 99, 235] },
                    styles: { fontSize: 9 }
                });

                doc.save(`consumo_detalhado_${consumptionStart}_a_${consumptionEnd}.pdf`);
                setShowConsumptionModal(false);
            };

            const handleExportExcel = async () => {
                setIsExportingExcel(true);
                try {
                    const workbook = new ExcelJS.Workbook();
                    workbook.creator = appUser.name;
                    workbook.created = new Date();

                    const wsResumo = workbook.addWorksheet('Dashboard Gerencial');
                    wsResumo.columns = [{ width: 35 }, { width: 25 }, { width: 35 }, { width: 25 }];
                    
                    wsResumo.mergeCells('A1:D2');
                    const titleCell = wsResumo.getCell('A1');
                    titleCell.value = 'LABFLOW 2026 - RELATÓRIO ANALÍTICO GERAL';
                    titleCell.font = { size: 16, bold: true, color: { argb: 'FFFFFFFF' } };
                    titleCell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF0F172A' } }; 
                    titleCell.alignment = { vertical: 'middle', horizontal: 'center' };

                    wsResumo.getCell('A4').value = 'MÉTRICAS GERAIS';
                    wsResumo.getCell('A4').font = { bold: true, size: 12, color: { argb: 'FF1E3A8A' } };
                    
                    const totalReq = requests.length;
                    const totalDelivered = requests.filter(r => r.status === 'approved').length;
                    const totalMissing = requests.filter(r => r.status === 'out_of_stock').length;
                    const totalPending = requests.filter(r => r.status === 'pending').length;

                    wsResumo.addRow(['Total de Solicitações Cadastradas', totalReq]);
                    wsResumo.addRow(['Itens Entregues / Disponíveis', totalDelivered]);
                    wsResumo.addRow(['Itens Em Falta (Não Atendidos)', totalMissing]);
                    wsResumo.addRow(['Itens Pendentes / Em Análise', totalPending]);

                    wsResumo.getCell('A10').value = 'CONSUMO POR SETOR (VOLUME DE PEDIDOS)';
                    wsResumo.getCell('A10').font = { bold: true, size: 12, color: { argb: 'FF1E3A8A' } };
                    wsResumo.getRow(11).values = ['Setor', 'Total de Pedidos'];
                    wsResumo.getRow(11).font = { bold: true };
                    wsResumo.getRow(11).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFE2E8F0' } };

                    const sectorCounts = {};
                    requests.forEach(r => {
                        const s = r.requesterSector || 'Outros';
                        sectorCounts[s] = (sectorCounts[s] || 0) + 1;
                    });
                    
                    let currentRow = 12;
                    Object.entries(sectorCounts).sort((a,b) => b[1] - a[1]).forEach(([sector, count]) => {
                        wsResumo.addRow([sector, count]);
                        currentRow++;
                    });

                    wsResumo.eachRow((row, rowNumber) => {
                        row.eachCell((cell) => {
                            cell.border = {
                                top: {style:'thin', color: {argb:'FFE2E8F0'}},
                                left: {style:'thin', color: {argb:'FFE2E8F0'}},
                                bottom: {style:'thin', color: {argb:'FFE2E8F0'}},
                                right: {style:'thin', color: {argb:'FFE2E8F0'}}
                            };
                        });
                    });

                    const wsPedidos = workbook.addWorksheet('Solicitações');
                    wsPedidos.columns = [
                        { header: 'Data do Pedido', key: 'data', width: 22 },
                        { header: 'Setor', key: 'setor', width: 20 },
                        { header: 'Solicitante', key: 'solicitante', width: 25 },
                        { header: 'Item / Material', key: 'item', width: 45 },
                        { header: 'Categoria', key: 'categoria', width: 25 },
                        { header: 'Qtd', key: 'qtd', width: 10 },
                        { header: 'Un.', key: 'unid', width: 10 },
                        { header: 'Status', key: 'status', width: 15 },
                        { header: 'Data Atualização', key: 'dataUpdate', width: 22 },
                        { header: 'Observações / Notas', key: 'obs', width: 40 },
                    ];

                    wsPedidos.getRow(1).font = { bold: true, color: { argb: 'FFFFFFFF' } };
                    wsPedidos.getRow(1).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF2563EB' } }; 

                    requests.forEach(r => {
                        let statusPt = r.status === 'approved' ? 'Entregue' : (r.status === 'out_of_stock' ? 'Em Falta' : 'Pendente');
                        wsPedidos.addRow({
                            data: new Date(r.createdAt).toLocaleString('pt-BR'),
                            setor: r.requesterSector,
                            solicitante: r.requesterName,
                            item: r.item,
                            categoria: CAT_LABELS_CLEAN[r.category] || r.category,
                            qtd: r.quantity,
                            unid: r.unit,
                            status: statusPt,
                            dataUpdate: r.statusUpdatedAt ? new Date(r.statusUpdatedAt).toLocaleString('pt-BR') : '-',
                            obs: r.notes || ''
                        });
                    });

                    wsPedidos.eachRow((row, rowNumber) => {
                        if(rowNumber > 1) {
                            const statusCell = row.getCell('H');
                            if(statusCell.value === 'Entregue') {
                                statusCell.font = { color: { argb: 'FF16A34A' }, bold: true };
                            } else if(statusCell.value === 'Em Falta') {
                                statusCell.font = { color: { argb: 'FFDC2626' }, bold: true };
                            } else {
                                statusCell.font = { color: { argb: 'FFD97706' }, bold: true }; 
                            }
                        }
                    });
                    wsPedidos.autoFilter = 'A1:J1';

                    const wsEstoque = workbook.addWorksheet('Posição do Estoque');
                    wsEstoque.columns = [
                        { header: 'Item / Material', key: 'item', width: 45 },
                        { header: 'Categoria', key: 'categoria', width: 25 },
                        { header: 'Local de Armazenamento', key: 'local', width: 25 },
                        { header: 'Qtd Atual', key: 'qtd', width: 15 },
                        { header: 'Estoque Mínimo', key: 'min', width: 18 },
                        { header: 'Estoque Máximo', key: 'max', width: 18 },
                        { header: 'Status do Estoque', key: 'status', width: 20 }
                    ];

                    wsEstoque.getRow(1).font = { bold: true, color: { argb: 'FFFFFFFF' } };
                    wsEstoque.getRow(1).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF0F766E' } };

                    const inventoryArray = Object.values(inventoryMap);
                    inventoryArray.sort((a,b) => a.name.localeCompare(b.name)).forEach(item => {
                        const cur = parseInt(item.totalQty) || 0;
                        const min = parseInt(item.minQty) || 0;
                        const max = parseInt(item.maxQty) || 0;
                        let status = 'OK / Normal';
                        if(cur <= 0 || cur < min) status = 'Crítico (Abaixo do Mín)';
                        else if(cur <= min * 1.2) status = 'Atenção (Próximo Mín)';

                        wsEstoque.addRow({
                            item: item.name,
                            categoria: CAT_LABELS_CLEAN[item.category] || item.category,
                            local: item.location || '-',
                            qtd: cur,
                            min: min,
                            max: max,
                            status: status
                        });
                    });

                    wsEstoque.eachRow((row, rowNumber) => {
                        if(rowNumber > 1) {
                            const statusCell = row.getCell('G');
                            if(statusCell.value.includes('Crítico')) {
                                statusCell.font = { color: { argb: 'FF991B1B' }, bold: true };
                                statusCell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFEE2E2' } };
                            } else if(statusCell.value.includes('Atenção')) {
                                statusCell.font = { color: { argb: 'FF854D0E' }, bold: true };
                                statusCell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFEF9C3' } };
                            } else {
                                statusCell.font = { color: { argb: 'FF166534' } };
                            }
                        }
                    });
                    wsEstoque.autoFilter = 'A1:G1';

                    const buffer = await workbook.xlsx.writeBuffer();
                    const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
                    window.saveAs(blob, `LabFlow_Relatorio_Excel_${new Date().toISOString().split('T')[0]}.xlsx`);

                } catch(error) {
                    console.error(error);
                    showAlert("Erro ao gerar Excel: " + error.message);
                } finally {
                    setIsExportingExcel(false);
                }
            };

            const handleArchiveCycle = () => {
                showConfirm("Isso moverá todos os itens 'Disponível' ou 'Em Falta' da Administração para o histórico permanente. Confirma esta ação?", async () => {
                    const itemsToArchive = requests.filter(r => (r.status === 'approved' || r.status === 'out_of_stock') && !r.isArchived && CAT_GROUPS.admin.includes(r.category));
                    if (itemsToArchive.length === 0) return showAlert("Nenhum item pronto para arquivar neste ciclo.");
                    const batch = writeBatch(db);
                    itemsToArchive.forEach(req => { const ref = doc(db, 'solicitacoes_lab_2026', req.id); batch.update(ref, { isArchived: true }); });
                    try { await batch.commit(); showAlert(`Ciclo concluído com sucesso. ${itemsToArchive.length} itens movidos para o histórico.`); } catch(e) { console.error(e); showAlert("Erro ao arquivar o ciclo."); }
                });
            };

            const { activeList, historyList, masterHistoryList } = React.useMemo(() => {
                if (!appUser) return { activeList: [], historyList: [], masterHistoryList: [] };
                let list = requests.filter(r => r.item.toLowerCase().includes(searchTerm.toLowerCase()) || r.requesterName.toLowerCase().includes(searchTerm.toLowerCase()));
                
                if (appUser.role === 'admin') {
                    list = list.filter(r => CAT_GROUPS.admin.includes(r.category));
                } else if (appUser.role === 'logistics') {
                    list = list.filter(r => CAT_GROUPS.logistics.includes(r.category));
                } else if (appUser.role === 'lab_tech' || appUser.role === 'master') {
                    if (techSubTab === 'admin') {
                        list = list.filter(r => CAT_GROUPS.admin.includes(r.category));
                    } else if (techSubTab === 'logistics') {
                        list = list.filter(r => CAT_GROUPS.logistics.includes(r.category));
                    }
                }
                
                const active = [], history = [], masterHistory = [];
                list.forEach(r => {
                    const isLogistics = CAT_GROUPS.logistics.includes(r.category);
                    
                    if (isLogistics) {
                        const finished = r.status === 'approved' || r.status === 'out_of_stock';
                        if (r.isArchived || finished) {
                            masterHistory.push(r);
                        } else {
                            if (appUser.role === 'master' || appUser.role === 'logistics' || appUser.role === 'lab_tech') active.push(r);
                        }
                    } else {
                        if (r.isArchived) {
                            history.push(r);
                        } else {
                            const finished = r.status === 'approved' || r.status === 'out_of_stock';
                            if (appUser.role === 'admin' || appUser.role === 'master') {
                                active.push(r); 
                            } else {
                                const recent = isRecent(r.statusUpdatedAt || r.createdAt, 7);
                                if (r.status === 'pending' || (finished && recent)) active.push(r); else history.push(r);
                            }
                        }
                    }
                });
                return { activeList: active, historyList: history, masterHistoryList: masterHistory };
            }, [requests, searchTerm, appUser, techSubTab]);

            const groupedHistoryArray = React.useMemo(() => {
                const groups = [];
                const map = new Map();
                historyList.forEach(req => {
                    const d = new Date(req.createdAt);
                    const monthYear = d.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
                    const capitalizedStr = monthYear.charAt(0).toUpperCase() + monthYear.slice(1);
                    
                    if (!map.has(capitalizedStr)) {
                        map.set(capitalizedStr, { missing: [], delivered: [] });
                        groups.push(capitalizedStr);
                    }
                    if (req.status === 'out_of_stock') map.get(capitalizedStr).missing.push(req);
                    else map.get(capitalizedStr).delivered.push(req);
                });
                return groups.map(g => ({ month: g, ...map.get(g) }));
            }, [historyList]);

            const groupedMasterHistoryArray = React.useMemo(() => {
                const groups = [];
                const map = new Map();
                masterHistoryList.forEach(req => {
                    const d = new Date(req.createdAt);
                    const monthYear = d.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
                    const capitalizedStr = monthYear.charAt(0).toUpperCase() + monthYear.slice(1);
                    
                    if (!map.has(capitalizedStr)) {
                        map.set(capitalizedStr, { items: [] });
                        groups.push(capitalizedStr);
                    }
                    map.get(capitalizedStr).items.push(req);
                });
                return groups.map(g => ({ month: g, ...map.get(g) }));
            }, [masterHistoryList]);

            if (loading) return <div className="flex h-screen items-center justify-center text-slate-500">Conectando ao sistema...</div>;
            if (!appUser) return <LoginScreen onLogin={handleLogin} />;

            return (
                <div className="min-h-screen pb-20 fade-in">
                    <NoticeBanner notices={notices} userRole={appUser.role} onUpdateNotice={handleUpdateNotice} />
                    <header className="bg-white text-slate-800 shadow-sm border-b border-slate-200 sticky top-0 z-10">
                        <div className="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center"><div className="flex items-center gap-4 select-none"><InstitutionalLogo /><div className="hidden sm:block h-8 w-px bg-slate-200"></div><div><h1 className="text-sm font-bold text-slate-700 leading-tight">LABFLOW</h1><p className="text-xs text-slate-500 uppercase">{appUser.role === 'master' ? 'Gestor do Sistema' : appUser.role === 'admin' ? 'Administração' : appUser.role === 'logistics' ? 'Logística' : appUser.sector}</p></div></div><div className="flex items-center gap-2">
                            
                            <button onClick={() => setIsDarkMode(!isDarkMode)} className="text-slate-400 hover:text-blue-600 p-2 transition mr-1" title="Alternar Tema Escuro">
                                {isDarkMode ? <Icons.Sun /> : <Icons.Moon />}
                            </button>

                            {appUser.role === 'master' && (
                                <button onClick={handleSendWeeklyReport} className="flex items-center gap-2 bg-blue-50 hover:bg-blue-100 text-blue-700 border border-blue-200 text-xs font-bold py-2 px-3 rounded transition" title="Disparar E-mail Semanal Agora">
                                    <Icons.Mail /> <span className="hidden sm:inline">Relatório E-mail</span>
                                </button>
                            )}

                            {(appUser.role === 'admin' || appUser.role === 'master') && (
                                <button onClick={() => setShowConsumptionModal(true)} className="flex items-center gap-2 bg-green-50 hover:bg-green-100 text-green-700 border border-green-200 text-xs font-bold py-2 px-3 rounded transition" title="Gera PDF com gráfico de consumo e itens detalhados por Setor"><Icons.BarChart /><span className="hidden sm:inline">PDF Consumo</span></button>
                            )}

                            {(appUser.role === 'admin' || appUser.role === 'master') && (
                                <button onClick={handleExportExcel} disabled={isExportingExcel} className="flex items-center gap-2 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200 text-xs font-bold py-2 px-3 rounded transition" title="Exportar Planilha Excel Detalhada com Dashboard">
                                    {isExportingExcel ? <Icons.RefreshCw className="animate-spin" /> : <Icons.FileSpreadsheet />}
                                    <span className="hidden sm:inline">{isExportingExcel ? 'Gerando...' : 'Excel'}</span>
                                </button>
                            )}

                            {appUser.role === 'master' && (
                                <button onClick={() => handleExportPDF('logistics')} className="flex items-center gap-2 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 text-xs font-bold py-2 px-3 rounded transition"><Icons.FileText /><span className="hidden sm:inline">PDF Logística</span></button>

                                        motivo: e.target.sugMotivo.value,
                                        requesterName: appUser.name,
                                        requesterSector: appUser.sector,
                                        createdAt: new Date().toISOString(),
                                        status: 'pending'
                                    });
                                    setShowSuggestionModal(false);
                                    showAlert("Sugestão enviada com sucesso!");
                                }}>
                                    <input name="sugItem" required placeholder="Nome do Item sugerido" className="w-full p-3 border border-slate-300 rounded-lg outline-none text-sm mb-3" />
                                    <textarea name="sugMotivo" required placeholder="Justificativa / Onde ou para que será usado?" className="w-full p-3 border border-slate-300 rounded-lg outline-none text-sm h-24 mb-4"></textarea>
                                    <div className="flex gap-2">
                                        <button type="button" onClick={() => setShowSuggestionModal(false)} className="flex-1 py-2 border border-slate-300 rounded-lg text-slate-600 font-semibold hover:bg-slate-50">Cancelar</button>
                                        <button type="submit" className="flex-1 py-2 bg-blue-600 text-white rounded-lg font-bold hover:bg-blue-700 shadow">Enviar Sugestão</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* MODAL DE SELEÇÃO DE PERÍODO PARA CONSUMO */}
                    {showConsumptionModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay fade-in">
                            <div className="bg-white rounded-xl shadow-2xl p-6 w-full max-w-sm">
                                <h3 className="text-lg font-bold text-slate-800 flex items-center gap-2 mb-4"><Icons.BarChart /> Gerar PDF de Consumo</h3>
                                <p className="text-sm text-slate-600 mb-4">Selecione o período para visualizar o relatório detalhado por setores e itens:</p>
                                <div className="flex gap-4 mb-6">
                                    <div className="flex-1">
                                        <label className="block text-xs font-bold text-slate-500 uppercase mb-1">Mês Inicial</label>
                                        <input 
                                            type="month" 
                                            value={consumptionStart} 
                                            onChange={(e) => setConsumptionStart(e.target.value)} 
                                            className="w-full p-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm"
                                        />
                                    </div>
                                    <div className="flex-1">
                                        <label className="block text-xs font-bold text-slate-500 uppercase mb-1">Mês Final</label>
                                        <input 
                                            type="month" 
                                            value={consumptionEnd} 
                                            onChange={(e) => setConsumptionEnd(e.target.value)} 
                                            className="w-full p-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm"
                                        />
                                    </div>
                                </div>
                                <div className="flex gap-2">
                                    <button onClick={() => setShowConsumptionModal(false)} className="flex-1 py-2 border border-slate-300 rounded-lg text-slate-600 font-semibold hover:bg-slate-50">Cancelar</button>
                                    <button onClick={handleExportConsumptionPDF} className="flex-1 py-2 bg-blue-600 text-white rounded-lg font-bold hover:bg-blue-700 shadow">Gerar PDF</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<DialogProvider><App /></DialogProvider>);
    </script>
</body>
</html>
